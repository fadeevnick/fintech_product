spring:
  application:
    name: vault
  datasource:
    url: ${VAULT_DB_URL:jdbc:postgresql://localhost:5437/vault}
    username: ${VAULT_DB_USER:vault}
    password: ${VAULT_DB_PASSWORD:vault}
  flyway:
    enabled: true
server:
  port: ${VAULT_HTTP_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
