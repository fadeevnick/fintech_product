spring:
  application:
    name: vault
  datasource:
    url: ${VAULT_DB_URL:jdbc:postgresql://localhost:5437/vault}
    username: ${VAULT_DB_USER:vault}
    password: ${VAULT_DB_PASSWORD:vault}
  flyway:
    enabled: true
minifin:
  vault:
    pan-encryption-key: ${VAULT_PAN_ENCRYPTION_KEY:local-vault-pan-key-change-me}
    service-auth-secret: ${SERVICE_AUTH_SECRET:local-service-secret}
    bin: ${VAULT_TEST_BIN:400000}
server:
  port: ${VAULT_HTTP_PORT:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
