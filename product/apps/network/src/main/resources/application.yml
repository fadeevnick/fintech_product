spring:
  application:
    name: network
  datasource:
    url: ${NETWORK_DB_URL:jdbc:postgresql://localhost:5435/network}
    username: ${NETWORK_DB_USER:network}
    password: ${NETWORK_DB_PASSWORD:network}
  flyway:
    enabled: true
server:
  port: ${NETWORK_HTTP_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
