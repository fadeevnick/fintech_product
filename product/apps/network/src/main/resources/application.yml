spring:
  application:
    name: network
  datasource:
    url: ${NETWORK_DB_URL:jdbc:postgresql://localhost:5435/network}
    username: ${NETWORK_DB_USER:network}
    password: ${NETWORK_DB_PASSWORD:network}
  flyway:
    enabled: true
minifin:
  network:
    issuer-base-url: ${ISSUER_BASE_URL:http://localhost:8084}
    service-auth-secret: ${SERVICE_AUTH_SECRET:local-service-secret}
server:
  port: ${NETWORK_HTTP_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
