spring:
  application:
    name: acquirer
  datasource:
    url: ${ACQUIRER_DB_URL:jdbc:postgresql://localhost:5434/acquirer}
    username: ${ACQUIRER_DB_USER:acquirer}
    password: ${ACQUIRER_DB_PASSWORD:acquirer}
  flyway:
    enabled: true
minifin:
  acquirer:
    network-base-url: ${NETWORK_BASE_URL:http://localhost:8083}
    service-auth-secret: ${SERVICE_AUTH_SECRET:local-service-secret}
server:
  port: ${ACQUIRER_HTTP_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
