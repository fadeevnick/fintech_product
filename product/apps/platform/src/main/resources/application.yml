spring:
  application:
    name: platform
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5433/platform}
    username: ${PLATFORM_DB_USER:platform}
    password: ${PLATFORM_DB_PASSWORD:platform}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
minifin:
  identity:
    expose-verification-token: ${IDENTITY_EXPOSE_VERIFICATION_TOKEN:true}
    session-ttl-hours: ${IDENTITY_SESSION_TTL_HOURS:12}
  backoffice:
    oidc:
      jwk-set-uri: ${BACKOFFICE_OIDC_JWK_SET_URI:http://localhost:18080/realms/minifin-backoffice/protocol/openid-connect/certs}
      client-id: ${BACKOFFICE_OIDC_CLIENT_ID:minifin-backoffice-local}
      issuer-display: ${BACKOFFICE_OIDC_ISSUER_DISPLAY:http://localhost:18080/realms/minifin-backoffice}
  merchant:
    webhooks:
      signing-secret-encryption-key: ${WEBHOOK_SIGNING_SECRET_ENCRYPTION_KEY:local-webhook-signing-secret-key-change-me}
      max-attempts: ${WEBHOOK_MAX_ATTEMPTS:3}
      retry-delays-seconds: ${WEBHOOK_RETRY_DELAYS_SECONDS:1,2}
    stripe:
      # Local-test placeholder. Phase 04 Slice 02 implements only the webhook receiver.
      # The onboarding-start path is recorded as a blocker pending real Stripe sandbox credentials.
      # In production this must be set to the per-environment Stripe webhook signing secret.
      webhook-signing-secret: ${STRIPE_WEBHOOK_SIGNING_SECRET:whsec_local_test_secret}
      webhook-tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
  cards:
    issuer-base-url: ${ISSUER_BASE_URL:http://localhost:8084}
    acquirer-base-url: ${ACQUIRER_BASE_URL:http://localhost:8082}
    service-auth-secret: ${SERVICE_AUTH_SECRET:local-service-secret}
server:
  port: ${PLATFORM_HTTP_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
