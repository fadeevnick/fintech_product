<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Webhooks — MDB-UI-04</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eceae5; --surface: #ffffff; --surf2: #f7f6f3; --inp: #faf9f7; --hover: #f0efe9;
      --sb: #111114; --sb-bdr: #1e1e22; --sb-muted: #545460; --sb-active: #1e1e28;
      --bdr: #dddad2; --bdr-mid: #c5c2ba; --bdr-focus: #1c1c1f;
      --t1: #1c1c1f; --t2: #575763; --t3: #9898a6; --t4: #d0d0da;
      --cta: #1c1c1f; --cta-hov: #2e2e35; --cta-t: #ffffff;
      --g: #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am: #854d0e; --am-bg: #fffbeb; --am-bd: #fde68a;
      --rd: #9b1c1c; --rd-bg: #fef2f2; --rd-bd: #fecaca;
      --or: #b45309; --or-bg: #fff7ed; --or-bd: #fed7aa;
      --pu: #5b21b6; --pu-bg: #f5f3ff; --pu-bd: #ddd6fe;
      --sb-env-bg: #1a1030; --sb-env-t: #b39cf0; --sb-env-bd: #362566;
      --f-ui: 'IBM Plex Sans', sans-serif; --f-mono: 'IBM Plex Mono', monospace;
      --r: 3px; --r-lg: 5px; --w-sb: 220px; --w-tl: 252px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--t1); font-family: var(--f-ui); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #root { width: 100%; height: 100vh; display: flex; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb); border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 14px 14px 12px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14.5px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
    .sb-merchant { margin-top: 10px; padding: 7px 9px; background: rgba(255,255,255,0.04); border-radius: var(--r); border: 1px solid var(--sb-bdr); }
    .sb-m-label { font-size: 9px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 3px; }
    .sb-m-name  { font-size: 12.5px; font-weight: 600; color: #eaeaf4; }
    .sb-m-id    { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); margin-top: 1px; }
    .sb-nav   { flex: 1; padding: 10px 7px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sb-muted); padding: 4px 9px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: var(--r); color: var(--sb-muted); font-size: 12px; cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.35; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; }
    .nav-lock { margin-left: auto; font-size: 9px; opacity: 0.6; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono); color: var(--sb-muted); opacity: 0.8; }
    .nav-item.current .nav-id { color: #7c6ff7; opacity: 1; }
    .sb-footer { padding: 10px 14px; border-top: 1px solid var(--sb-bdr); }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd); font-size: 10px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 4px; }
    .env-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host  { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); }
    .sb-user   { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
    .sb-avatar { width: 24px; height: 24px; border-radius: 50%; background: #5b21b6; color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sb-uname  { font-size: 11px; font-weight: 500; color: #eaeaf4; }
    .sb-urole  { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* MAIN */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .page-hdr  { display: flex; align-items: center; justify-content: space-between; padding: 10px 22px; border-bottom: 1px solid var(--bdr); background: var(--surface); flex-shrink: 0; gap: 10px; flex-wrap: wrap; }
    .page-bc   { font-size: 12.5px; color: var(--t2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep   { color: var(--t3); }
    .page-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3); padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge { font-size: 10px; font-family: var(--f-mono); color: var(--am); background: var(--am-bg); border: 1px solid var(--am-bd); padding: 2px 8px; border-radius: var(--r); display: flex; align-items: center; gap: 5px; }
    .env-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--am); }
    .user-chip { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 3px; border: 1px solid var(--bdr); border-radius: 20px; background: var(--surf2); }
    .user-avatar { width: 22px; height: 22px; border-radius: 50%; background: #5b21b6; color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-name { font-size: 11.5px; color: var(--t2); font-weight: 500; }

    /* CONTENT */
    .content-area { flex: 1; display: flex; overflow: hidden; }
    .left-scroll  { flex: 1; overflow-y: auto; padding: 14px 18px; background: var(--bg); display: flex; flex-direction: column; gap: 11px; min-width: 0; }

    /* PANELS */
    .panel     { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); overflow: hidden; flex-shrink: 0; }
    .panel-hdr { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
    .panel-title { font-size: 11.5px; font-weight: 600; color: var(--t1); text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 13px 16px; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em; font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-active    { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-pending   { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .b-locked    { background: var(--hover); color: var(--t2); border-color: var(--bdr); }
    .b-disabled  { background: var(--hover); color: var(--t3); border-color: var(--bdr); }
    .b-sandbox   { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }
    .b-new       { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-warn      { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .b-delivered { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-failed    { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .b-retrying  { background: var(--or-bg); color: var(--or); border-color: var(--or-bd); }
    .b-dlq       { background: #1c0520; color: #e879f9; border-color: #a21caf; }

    /* STATUS STRIP */
    .status-strip { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); overflow: hidden; flex-shrink: 0; }
    .stat-cell { padding: 11px 14px; border-right: 1px solid var(--bdr); flex: 1 1 120px; min-width: 0; }
    .stat-cell:last-child { border-right: none; }
    .stat-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--t3); margin-bottom: 4px; font-weight: 600; }
    .stat-v { font-size: 12.5px; color: var(--t1); font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .stat-v.mono { font-family: var(--f-mono); font-size: 11px; }
    .stat-v.warn { color: var(--am); }
    .stat-v.red  { color: var(--rd); }
    .stat-v.dlq  { color: #a21caf; }

    /* KV */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 168px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; font-weight: 500; font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover   { background: var(--hover); color: var(--t1); }
    .btn-danger  { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }
    .btn-danger:hover  { background: #fee2e2; }
    .btn-warn    { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .btn-warn:hover    { background: #fef3c7; }
    .btn-success { background: var(--g-bg);  color: var(--g);  border: 1px solid var(--g-bd); }
    .btn-sm  { padding: 4px 10px; font-size: 11px; }
    .btn-xs  { padding: 2px 7px; font-size: 10.5px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ALERTS */
    .alert { display: flex; gap: 10px; padding: 9px 12px 9px 13px; font-size: 12px; line-height: 1.55; border-left-width: 3px; border-left-style: solid; border-radius: var(--r); }
    .alert-warn  { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-red   { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-info  { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-green { background: var(--g-bg);  border-left-color: var(--g);  color: #14532d; }
    .alert-pu    { background: var(--pu-bg); border-left-color: var(--pu); color: #3b0764; }

    /* TABLES */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--t3); padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--bdr); background: var(--surf2); font-weight: 600; white-space: nowrap; }
    .data-table td { padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--hover); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr.row-disabled td { opacity: 0.6; }
    .data-table tr.row-selected td { background: rgba(91,33,182,0.03); }
    .data-table tr.row-hover:hover td { background: var(--surf2); cursor: pointer; }
    .data-table tr.row-expand-open td { background: var(--surf2); }
    .data-table tr.row-new td { background: rgba(240,253,244,0.5); }
    .mono-cell  { font-family: var(--f-mono); font-size: 11px; }
    .tbl-link { font-size: 10.5px; color: var(--pu); cursor: pointer; text-decoration: underline; font-family: var(--f-mono); background: none; border: none; padding: 0; }
    .tbl-link:hover { color: #4c1d95; }
    .url-cell { font-family: var(--f-mono); font-size: 10.5px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t2); }
    .endpoint-table { table-layout: fixed; }
    .endpoint-table th,
    .endpoint-table td { padding-left: 8px; padding-right: 8px; overflow: hidden; }
    .endpoint-table .endpoint-name-col { width: 25%; }
    .endpoint-table .endpoint-status-col { width: 8%; }
    .endpoint-table .endpoint-events-col { width: 22%; }
    .endpoint-table .endpoint-secret-col { width: 9%; }
    .endpoint-table .endpoint-date-col { width: 11%; }
    .endpoint-table .endpoint-actions-col { width: 14%; }
    .endpoint-table td:nth-child(4),
    .endpoint-table td:nth-child(5),
    .endpoint-table td:nth-child(6) { font-size: 10.5px; line-height: 1.35; overflow-wrap: anywhere; }
    .endpoint-table .url-cell { max-width: 100%; }
    .endpoint-actions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }

    /* FORMS */
    .inp-label { font-size: 11px; color: var(--t2); margin-bottom: 4px; font-weight: 500; display: block; }
    .inp-field { width: 100%; padding: 7px 10px; border: 1px solid var(--bdr-mid); border-radius: var(--r); font-size: 12.5px; color: var(--t1); background: var(--inp); outline: none; font-family: var(--f-ui); transition: border-color 0.12s; }
    .inp-field:focus { border-color: var(--bdr-focus); }
    .inp-field.inp-error { border-color: var(--rd); }
    .inp-field.inp-warn  { border-color: var(--am); }
    select.inp-field { cursor: pointer; }
    .inp-hint { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
    .inp-err  { font-size: 10.5px; color: var(--rd); margin-top: 3px; }
    .inp-wrn  { font-size: 10.5px; color: var(--am); margin-top: 3px; }
    .form-row  { display: flex; gap: 11px; }
    .form-row > * { flex: 1; min-width: 0; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
    .form-group:last-child { margin-bottom: 0; }

    /* SCOPE/EVENT CHECKBOXES */
    .scope-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .scope-item { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--bdr); border-radius: var(--r); cursor: pointer; background: var(--surf2); transition: all 0.1s; user-select: none; }
    .scope-item:hover { border-color: var(--bdr-focus); background: var(--hover); }
    .scope-item.checked { background: var(--pu-bg); border-color: var(--pu-bd); }
    .scope-item input { accent-color: var(--pu); width: 12px; height: 12px; cursor: pointer; }
    .scope-label { font-size: 11px; font-family: var(--f-mono); color: var(--t2); }
    .scope-item.checked .scope-label { color: var(--pu); }

    /* ONE-TIME REVEAL */
    .reveal-box { background: var(--g-bg); border: 1.5px solid var(--g-bd); border-radius: var(--r-lg); padding: 14px 16px; }
    .reveal-key { font-family: var(--f-mono); font-size: 12px; color: var(--t1); background: var(--surface); border: 1px solid var(--bdr-mid); border-radius: var(--r); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; word-break: break-all; }
    .reveal-key-text { flex: 1; }
    .reveal-bullets { font-size: 11.5px; color: #166534; line-height: 1.7; margin: 8px 0; }
    .reveal-bullets li { list-style: none; padding-left: 14px; position: relative; }
    .reveal-bullets li::before { content: '⚠'; position: absolute; left: 0; font-size: 10px; top: 1px; }
    .ack-row { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r); cursor: pointer; user-select: none; margin-top: 4px; }
    .ack-row input { accent-color: var(--g); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
    .ack-row span { font-size: 11.5px; color: var(--t1); font-weight: 500; }

    /* TAGS */
    .evt-tag { display: inline-flex; padding: 1px 5px; border-radius: 2px; font-size: 9.5px; font-family: var(--f-mono); background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; white-space: nowrap; margin: 1px; }
    .scope-tag { display: inline-flex; padding: 1px 5px; border-radius: 2px; font-size: 9.5px; font-family: var(--f-mono); background: var(--pu-bg); color: var(--pu); border: 1px solid var(--pu-bd); white-space: nowrap; }
    .scope-tag-gray { background: var(--hover); color: var(--t3); border-color: var(--bdr); }

    /* CODE BLOCK */
    .code-block { background: #1c1c1f; color: #c8c8d8; font-family: var(--f-mono); font-size: 11.5px; border-radius: var(--r); padding: 10px 14px; line-height: 1.65; overflow-x: auto; }
    .c-key  { color: #7c6ff7; }
    .c-str  { color: #fbbf24; }
    .c-val  { color: #a3e635; }
    .c-num  { color: #fb923c; }
    .c-com  { color: #555570; }
    .c-hdr  { color: #f472b6; }
    .c-url  { color: #94a3b8; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,20,0.52); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); width: 500px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
    .modal-hdr  { display: flex; align-items: flex-start; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--bdr); flex-shrink: 0; background: var(--surf2); }
    .modal-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .modal-sub   { font-size: 11px; color: var(--t3); margin-top: 2px; }
    .modal-close { width: 24px; height: 24px; border-radius: var(--r); background: transparent; border: none; color: var(--t3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.1s; flex-shrink: 0; font-size: 14px; }
    .modal-close:hover { background: var(--hover); color: var(--t1); }
    .modal-body  { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer{ padding: 12px 16px; border-top: 1px solid var(--bdr); display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .modal-note  { font-size: 10.5px; color: var(--t3); margin-left: auto; font-style: italic; }

    /* DRAWER */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(17,17,20,0.35); z-index: 90; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 95vw; background: var(--surface); border-left: 1px solid var(--bdr); display: flex; flex-direction: column; z-index: 91; box-shadow: -4px 0 24px rgba(0,0,0,0.12); }
    .drawer-hdr   { padding: 13px 16px; border-bottom: 1px solid var(--bdr); flex-shrink: 0; background: var(--surf2); display: flex; align-items: flex-start; justify-content: space-between; }
    .drawer-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .drawer-sub   { font-size: 10.5px; color: var(--t3); margin-top: 2px; }
    .drawer-body  { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .drawer-footer{ padding: 12px 16px; border-top: 1px solid var(--bdr); flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; }

    /* TIMELINE RAIL */
    .tl-rail  { width: var(--w-tl); flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .tl-hdr   { padding: 10px 14px; border-bottom: 1px solid var(--bdr); flex-shrink: 0; font-size: 9.5px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.1em; }
    .tl-body  { flex: 1; overflow-y: auto; padding: 10px 14px; }

  const [acknowledged, setAcknowledged] = useState(false);
  const [copied, setCopied] = useState(false);

  const SECRET = 'whsec_test_sk_7Xn3kP2m9QbL8vR1cFjA4nZmYoK6wEd2';

  const urlErr  = url && !url.startsWith('https://') ? 'Endpoint URL must use HTTPS.' : null;
  const dupWarn = url && url.startsWith('https://') && endpoints.some(e => e.url === url)
    ? 'Duplicate URL: this endpoint URL is already registered.' : null;
  const evtErr  = events.length === 0 && name ? 'At least one event subscription is required.' : null;

  function toggleEvent(ev) {
    setEvents(prev => prev.includes(ev) ? prev.filter(x => x !== ev) : [...prev, ev]);
  }

  function handleSubmit() {
    if (!name.trim() || urlErr || !url || events.length === 0) return;
    const ep = onCreate({ name: name.trim(), url, events, description: desc });
    setNewEp(ep);
    setStep('reveal');
  }

  function handleCopy() {
    setCopied(true);
    setTimeout(() => setCopied(false), 2200);
  }

  if (step === 'reveal' && newEp) {
    if (acknowledged) {
      return (
        <div className="panel">
          <div className="panel-hdr">
            <span className="panel-title">Endpoint Created — Secret Stored</span>

          </div>
        </div>

    }
    return (
      <div className="panel">
        <div className="panel-hdr">
          <span className="panel-title">Endpoint Signing Secret — One-Time Reveal</span>
          <Badge cls="b-new">NEW · {newEp.id}</Badge>
        </div>
        <div className="panel-body" style={{display:'flex', flexDirection:'column', gap:12}}>
          <div className="alert alert-warn">
            <div>
              <strong>This secret is shown exactly once.</strong> MiniFin stores only an encrypted hash and prefix — the full secret material is not retained. Copy and store it securely now.
            </div>
          </div>
          <div className="reveal-box">
            <div style={{fontSize:11, fontWeight:600, color:'#166534', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>Signing Secret</div>
            <div className="reveal-key">
              <span className="reveal-key-text">{SECRET}</span>
              <button className="btn btn-success btn-xs" onClick={handleCopy} style={{flexShrink:0}}>
                {copied ? '✓ Copied' : 'Copy'}
              </button>
            </div>
            <ul className="reveal-bullets">
              <li>Use this secret to verify the <code style={{fontFamily:'var(--f-mono)',fontSize:10.5}}>MiniFin-Signature</code> header on incoming webhook requests.</li>
              <li>MiniFin stores only the encrypted hash and prefix. The full secret cannot be recovered.</li>
              <li>If you lose this secret, you must rotate to generate a new one.</li>
              <li>Store in your secrets manager (e.g. AWS Secrets Manager, HashiCorp Vault).</li>
            </ul>
            <div className="ack-row" onClick={() => setAcknowledged(true)}>
              <input type="checkbox" readOnly checked={acknowledged} />
              <span>I have securely stored this secret. Hide it now.</span>
            </div>
          </div>
          <div className="kv-table" style={{fontSize:11}}>
            <KV k="Endpoint">{newEp.name} ({newEp.id})</KV>
            <KV k="Prefix retained" mono>{newEp.secretPrefix}</KV>
            <KV k="Fingerprint" mono><span style={{color:'var(--t2)'}}>{newEp.fingerprint}</span></KV>
          </div>
        </div>
      </div>
    );
  }

  return (

            <KV k="Last rotated at" mono>{ep.lastRotatedAt}</KV>
            <KV k="Last delivery">
              {ep.lastSuccess !== '—' ? <span style={{color:'var(--g)',fontSize:11}}>{ep.lastSuccess} — OK</span> : <span style={{color:'var(--t3)'}}>—</span>}
            </KV>
            <KV k="Last failure">
              {ep.lastFailure !== '—' ? <span style={{color:'var(--rd)',fontSize:11}}>{ep.lastFailure}</span> : <span style={{color:'var(--t3)'}}>—</span>}
            </KV>
            {ep.description && <KV k="Description">{ep.description}</KV>}
          </div>
          <div>
            <div style={{fontSize:10.5, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:6}}>Delivery Stats</div>
            <div style={{display:'flex', gap:10}}>
              <div style={{padding:'8px 12px', background:'var(--g-bg)', border:'1px solid var(--g-bd)', borderRadius:'var(--r)', flex:1, textAlign:'center'}}>
                <div style={{fontSize:18, fontWeight:600, color:'var(--g)'}}>{ep.deliveries}</div>
                <div style={{fontSize:10, color:'var(--t3)', marginTop:2}}>Delivered</div>
              </div>
              <div style={{padding:'8px 12px', background: ep.failures > 0 ? 'var(--rd-bg)' : 'var(--surf2)', border:`1px solid ${ep.failures > 0 ? 'var(--rd-bd)' : 'var(--bdr)'}`, borderRadius:'var(--r)', flex:1, textAlign:'center'}}>
                <div style={{fontSize:18, fontWeight:600, color: ep.failures > 0 ? 'var(--rd)' : 'var(--t3)'}}>{ep.failures}</div>
                <div style={{fontSize:10, color:'var(--t3)', marginTop:2}}>Failures</div>
              </div>
            </div>
          </div>
          <div className="alert alert-info" style={{fontSize:11}}>
            The full signing secret is never stored or displayed after the initial one-time reveal. Only the prefix and SHA-256 fingerprint are retained.
          </div>
          {ep.status === 'disabled' && (
            <div className="alert alert-warn" style={{fontSize:11}}>
              This endpoint is disabled. No events will be delivered until it is re-enabled. Events generated while disabled are not queued for retroactive delivery.
            </div>
          )}
        </div>
        <div className="drawer-footer">
          <button className="btn btn-warn btn-sm" onClick={() => { onRotate(ep); onClose(); }}>Rotate Secret</button>
          {ep.status === 'active'
            ? <button className="btn btn-danger btn-sm" onClick={() => { onDisable(ep); onClose(); }}>Disable Endpoint</button>
            : <button className="btn btn-success btn-sm" onClick={() => { onEnable(ep.id); onClose(); }}>Enable Endpoint</button>}
          <button className="btn btn-ghost btn-sm" onClick={onClose}>Close</button>
        </div>
      </div>
    </>
  );
}

/* ── ROTATE SECRET MODAL ── */
function RotateSecretModal({ ep, onConfirm, onClose }) {
  const [step, setStep]   = useState('confirm'); // 'confirm' | 'reveal'
  const [acknowledged, setAcknowledged] = useState(false);
  const [copied, setCopied] = useState(false);
  const NEW_SECRET = 'whsec_test_sk_R8x9mV2nKpL5wQ3jFbC7yTdNuEa1sGh';
  const NEW_PREFIX = 'whsec_test_R8x…';
  const NEW_FP = 'sha256:9g1h2i3j…k456';

  function handleCopy() {
    setCopied(true);
    setTimeout(() => setCopied(false), 2200);
  }

  if (step === 'confirm') {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <div className="modal-hdr">
            <div>
              <div className="modal-title">Rotate Signing Secret</div>
              <div className="modal-sub">{ep.name} · {ep.id}</div>
            </div>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <div className="alert alert-warn">
              <div>
                <strong>The old secret is invalidated immediately upon rotation.</strong> Any signature verification using the old secret will fail. Update your endpoint handler before confirming if zero-downtime rotation is required.
              </div>
            </div>
            <div className="kv-table">
              <KV k="Endpoint">{ep.name}</KV>
              <KV k="Endpoint ID" mono>{ep.id}</KV>
              <KV k="Current prefix" mono>{ep.secretPrefix}</KV>
              <KV k="Current fingerprint" mono><span style={{color:'var(--t2)'}}>{ep.fingerprint}</span></KV>
              <KV k="Rotation effect">Old secret invalidated immediately. New one-time secret reveal follows.</KV>
              <KV k="Actor">Nora Klein (Merchant Admin)</KV>
            </div>
            <div className="alert alert-info" style={{fontSize:11}}>
              After confirming: a new signing secret will be generated and shown once. Update your endpoint's secret store before the next webhook delivery.
              Audit event <code style={{fontFamily:'var(--f-mono)', fontSize:10.5, color:'var(--pu)'}}>webhook.secret_rotated</code> will be written.
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn btn-warn btn-sm" onClick={() => { onConfirm(ep.id, NEW_PREFIX, NEW_FP); setStep('reveal'); }}>Confirm Rotation</button>
            <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
            <span className="modal-note">This action cannot be undone</span>
          </div>
        </div>
      </div>
    );
  }

  if (acknowledged) {
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <div className="modal-hdr">
            <div>
              <div className="modal-title">Secret Rotated — Acknowledged</div>
              <div className="modal-sub">{ep.name} · {ep.id}</div>
            </div>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <div className="alert alert-green">
              New secret acknowledged and cleared from view. Only the prefix and fingerprint are retained. Old secret is no longer valid.
            </div>
            <div className="kv-table">
              <KV k="Endpoint ID" mono>{ep.id}</KV>
              <KV k="New prefix" mono>{NEW_PREFIX}</KV>
              <KV k="New fingerprint" mono><span style={{color:'var(--t2)'}}>{NEW_FP}</span></KV>
              <KV k="Rotated by">Nora Klein</KV>
              <KV k="Rotated at" mono>2026-05-18 10:41</KV>
              <KV k="Audit event" mono><span style={{color:'var(--pu)'}}>webhook.secret_rotated</span></KV>
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn btn-ghost btn-sm" onClick={onClose}>Close</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{width:520}} onClick={e => e.stopPropagation()}>
        <div className="modal-hdr">
          <div>
            <div className="modal-title">New Signing Secret — One-Time Reveal</div>
            <div className="modal-sub">{ep.name} · {ep.id} · rotation complete</div>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="alert alert-warn" style={{fontSize:11}}>
            Old secret has been invalidated. Update your endpoint handler with this new secret now.
          </div>
          <div className="reveal-box">
            <div style={{fontSize:11, fontWeight:600, color:'#166534', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:6}}>New Signing Secret</div>
            <div className="reveal-key">
              <span className="reveal-key-text">{NEW_SECRET}</span>
              <button className="btn btn-success btn-xs" onClick={handleCopy} style={{flexShrink:0}}>
                {copied ? '✓ Copied' : 'Copy'}
              </button>
            </div>
            <ul className="reveal-bullets">
              <li>This secret is shown exactly once. MiniFin does not retain the full value.</li>
              <li>Replace the old secret in your endpoint handler and secrets manager immediately.</li>
              <li>Old secret is already invalidated — deliveries using it will fail verification.</li>
            </ul>
            <div className="ack-row" onClick={() => setAcknowledged(true)}>
              <input type="checkbox" readOnly checked={acknowledged} />
              <span>I have securely stored the new secret. Hide it now.</span>
            </div>
          </div>
          <div className="kv-table" style={{fontSize:11}}>
            <KV k="New prefix" mono>{NEW_PREFIX}</KV>
            <KV k="New fingerprint" mono><span style={{color:'var(--t2)'}}>{NEW_FP}</span></KV>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── DISABLE CONFIRM MODAL ── */
function DisableConfirmModal({ ep, onConfirm, onClose }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{width:460}} onClick={e => e.stopPropagation()}>
        <div className="modal-hdr">
          <div>
            <div className="modal-title">Disable Endpoint</div>
            <div className="modal-sub">{ep.name} · {ep.id}</div>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="alert alert-warn">
            Disabling this endpoint stops all webhook deliveries immediately. Events generated while the endpoint is disabled are <strong>not queued</strong> for retroactive delivery when re-enabled.
          </div>
          <div className="kv-table">
            <KV k="Endpoint">{ep.name}</KV>
            <KV k="URL" mono><span className="url-cell" title={ep.url}>{ep.url}</span></KV>
            <KV k="Current status"><Badge cls="b-active">ACTIVE</Badge></KV>
            <KV k="Subscribed events">
              <div style={{display:'flex', flexWrap:'wrap', gap:2}}>
                {ep.events.map(ev => <span key={ev} className="evt-tag">{ev}</span>)}
              </div>
            </KV>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-danger btn-sm" onClick={onConfirm}>Disable Endpoint</button>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>Cancel</button>
          <span className="modal-note">Reversible — can be re-enabled at any time</span>
        </div>
      </div>
    </div>
  );
}

/* ── TIMELINE RAIL ── */
function TimelineRail({ expandedIdx, onExpand }) {
  return (
    <div className="tl-rail">
      <div className="tl-hdr">Activity &amp; Audit</div>
      <div className="tl-body">
        {TIMELINE_EVENTS.map((evt, i) => (
          <div key={i} className="tl-evt" onClick={() => onExpand(expandedIdx === i ? null : i)}>
            <div className="tl-spine">
              <div className={`tl-dot ${evt.dot}`} />
              {i < TIMELINE_EVENTS.length - 1 && <div className="tl-line" />}
            </div>
            <div className="tl-content">
              <div className="tl-ts">{evt.ts}</div>
              <div className="tl-name">{evt.name}</div>
              <div className="tl-actor">{evt.actor}</div>
              <div className="tl-desc">{evt.desc}</div>
              <div className="tl-audit">{evt.audit}</div>
              {expandedIdx !== i && <div className="tl-expand-hint">click to expand metadata</div>}
              {expandedIdx === i && (
                <div className="tl-meta">{evt.meta}</div>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── LIVE MODE STATUS PANEL ── */
function LiveModePanel() {
  return (
    <div className="panel">
      <div className="panel-hdr">
        <span className="panel-title">Live Mode Availability</span>
        <Badge cls="b-inreview">KYB IN REVIEW</Badge>
      </div>
      <div className="panel-body">
        <div className="lock-grid">
          <div className="lock-item unlocked">
            <div className="lock-item-label">✓ Sandbox Webhooks</div>
            <div className="lock-item-sub">Active — endpoints can be created and tested</div>
          </div>
          <div className="lock-item locked">
            <div className="lock-item-label">⊘ Live Webhooks</div>
            <div className="lock-item-sub">Locked — KYB in review + Stripe Connect required</div>
          </div>
          <div className="lock-item locked">
            <div className="lock-item-label">⊘ Live Event Delivery</div>
            <div className="lock-item-sub">Unavailable until live mode is unlocked</div>
          </div>
          <div className="lock-item locked">
            <div className="lock-item-label">⊘ Live Secret Rotation</div>
            <div className="lock-item-sub">Not available in sandbox-only mode</div>
          </div>
        </div>
        <div style={{marginTop:10, fontSize:11, color:'var(--t3)'}}>
          KYB status: <span style={{fontFamily:'var(--f-mono)', color:'var(--pu)'}}>in_review</span> · Stripe Connect: <span style={{fontFamily:'var(--f-mono)', color:'var(--rd)'}}>not_completed</span> · Contact <span style={{fontFamily:'var(--f-mono)'}}>compliance@minifin.io</span> for status.
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [endpoints, setEndpoints]     = useState(INITIAL_ENDPOINTS);
  const [selectedEpId, setSelectedEpId] = useState('EP-001');
  const [showCreate, setShowCreate]   = useState(false);
  const [drawerEp, setDrawerEp]       = useState(null);
  const [rotateTarget, setRotateTarget] = useState(null);
  const [disableTarget, setDisableTarget] = useState(null);
  const [expandedDelivery, setExpandedDelivery] = useState(null);
  const [expandedTl, setExpandedTl]   = useState(null);

  function handleCreate(formData) {
    const newEp = {
      id: `EP-${String(Date.now()).slice(-4)}`,
      name: formData.name,
      url: formData.url,
      status: 'active',
      events: formData.events,
      secretPrefix: 'whsec_test_7Xn…',
      fingerprint: 'sha256:0a1b2c3d…e5f6',
      lastSuccess: '—',
      lastFailure: '—',
      createdBy: 'Nora Klein',
      createdAt: '2026-05-18 10:42',
      lastRotatedBy: '—',
      lastRotatedAt: '—',
      description: formData.description || '',
      deliveries: 0,
      failures: 0,
      isNew: true,
    };
    setEndpoints(prev => [newEp, ...prev]);
    return newEp;
  }

  function handleRotateConfirm(epId, newPrefix, newFp) {
    setEndpoints(prev => prev.map(ep =>
      ep.id === epId
        ? { ...ep, secretPrefix: newPrefix, fingerprint: newFp, lastRotatedBy: 'Nora Klein', lastRotatedAt: '2026-05-18 10:41' }
        : ep
    ));
  }

  function handleDisableConfirm() {
    if (!disableTarget) return;
    setEndpoints(prev => prev.map(ep =>
      ep.id === disableTarget.id ? { ...ep, status: 'disabled' } : ep
    ));
    setDisableTarget(null);
  }

  function handleEnable(epId) {
    setEndpoints(prev => prev.map(ep =>
      ep.id === epId ? { ...ep, status: 'active' } : ep
    ));
  }

  return (
    <>
      <Sidebar />
      <div className="main-wrap">
        {/* PAGE HEADER */}
        <div className="page-hdr">
          <div className="page-bc">
            <span>Orbit Market</span>
            <span className="sep">›</span>
            <strong>Webhooks</strong>
            <span className="sep">·</span>
            <span style={{fontFamily:'var(--f-mono)', fontSize:11, color:'var(--t3)'}}>MRC-20491</span>
          </div>
          <div className="page-meta">
            <div className="env-badge"><div className="env-badge-dot"/>Local Sandbox</div>
            <Badge cls="b-inreview">KYB IN REVIEW</Badge>
            <div className="user-chip">
              <div className="user-avatar">NK</div>
              <span className="user-name">Nora Klein</span>
              <span style={{fontSize:10, color:'var(--t3)', marginLeft:2}}>Merchant Admin</span>
            </div>
            <span className="screen-id">MDB-UI-04</span>
          </div>
        </div>

        {/* CONTENT */}
        <div className="content-area">
          <div className="left-scroll">
            <StatusStrip endpoints={endpoints} />

            <EndpointTable
              endpoints={endpoints}
              selectedEpId={selectedEpId}
              onSelect={setSelectedEpId}
              onViewDrawer={setDrawerEp}
              onRotate={setRotateTarget}
              onDisable={setDisableTarget}
              onEnable={handleEnable}
              onCreateClick={() => setShowCreate(true)}
            />

            {showCreate && (
              <CreateEndpointPanel
                endpoints={endpoints}
                onCreate={handleCreate}
                onClose={() => setShowCreate(false)}
              />
            )}

            <DeliveryLogPanel
              selectedEpId={selectedEpId}
              endpoints={endpoints}
              expandedId={expandedDelivery}
              onExpand={setExpandedDelivery}
            />

            <RetryDLQPanel />
            <PayloadPreviewPanel />
            <SecurityRulesPanel />
            <LiveModePanel />

            <div style={{height:14}} />
          </div>

          <TimelineRail expandedIdx={expandedTl} onExpand={setExpandedTl} />
        </div>
      </div>

      {/* DRAWER */}
      {drawerEp && (
        <EndpointDrawer
          ep={endpoints.find(e => e.id === drawerEp.id) || drawerEp}
          onClose={() => setDrawerEp(null)}
          onRotate={ep => { setRotateTarget(ep); setDrawerEp(null); }}
          onDisable={ep => { setDisableTarget(ep); setDrawerEp(null); }}
          onEnable={id => { handleEnable(id); setDrawerEp(null); }}
        />
      )}

      {/* ROTATE MODAL */}
      {rotateTarget && (
        <RotateSecretModal
          ep={rotateTarget}
          onConfirm={handleRotateConfirm}
          onClose={() => setRotateTarget(null)}
        />
      )}

      {/* DISABLE MODAL */}
      {disableTarget && (
        <DisableConfirmModal
          ep={disableTarget}
          onConfirm={handleDisableConfirm}
          onClose={() => setDisableTarget(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
