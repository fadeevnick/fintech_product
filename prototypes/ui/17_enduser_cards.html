<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Cards — UEW-UI-06</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --inp:     #faf9f7;
      --hover:   #f0efe9;

      --sb:        #111114;
      --sb-bdr:    #1e1e22;
      --sb-muted:  #545460;
      --sb-active: #1e1e28;

      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;

      --t1: #1c1c1f;
      --t2: #575763;
      --t3: #9898a6;
      --t4: #d0d0da;

      --cta:     #1c1c1f;
      --cta-hov: #2e2e35;
      --cta-t:   #ffffff;

      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;

      --sb-env-bg: #1a1030;
      --sb-env-t:  #b39cf0;
      --sb-env-bd: #362566;

      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;

      --r:    3px;
      --r-lg: 5px;
      --w-sb: 220px;
      --w-tl: 248px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; display: flex; overflow: hidden; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 15px 15px 13px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14.5px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .sb-nav   { flex: 1; padding: 10px 7px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 9px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 12px;
      cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.35; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.6; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono); color: var(--sb-muted); opacity: 0.8; }
    .sb-footer { padding: 10px 14px; border-top: 1px solid var(--sb-bdr); }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 10px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 4px; }
    .env-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host  { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* MAIN */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .page-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .page-bc   { font-size: 12.5px; color: var(--t2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep   { color: var(--t3); }
    .page-bc .mode  { font-family: var(--f-mono); font-size: 11.5px; color: var(--t2); }
    .page-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge { font-size: 10px; font-family: var(--f-mono); color: var(--am);
      background: var(--am-bg); border: 1px solid var(--am-bd);
      padding: 2px 8px; border-radius: var(--r); display: flex; align-items: center; gap: 5px; }
    .env-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--am); }
    .user-chip { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 3px;
      border: 1px solid var(--bdr); border-radius: 20px; background: var(--surf2); }
    .user-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--cta);
      color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center;
      justify-content: center; letter-spacing: 0.03em; flex-shrink: 0; }
    .user-name { font-size: 11.5px; color: var(--t2); font-weight: 500; }

    /* CONTENT */
    .content-area { flex: 1; display: flex; overflow: hidden; }
    .left-scroll  { flex: 1; overflow-y: auto; padding: 16px 20px;
      background: var(--bg); display: flex; flex-direction: column; gap: 12px; min-width: 0; }

    /* PANELS */
    .panel     { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; flex-shrink: 0; }
    .panel-hdr { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); flex-shrink: 0; }
    .panel-title { font-size: 11.5px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 13px 16px; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
      font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-active    { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-done      { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-completed { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-pending   { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-held      { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-limited   { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-action    { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-rejected  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-failed    { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-locked    { background: var(--hover); color: var(--t2);  border-color: var(--bdr); }
    .b-cancelled { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-inreview  { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-frozen    { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-closed    { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-blocked   { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-captured  { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-reversed  { background: var(--hover); color: var(--t2);  border-color: var(--bdr); }
    .b-declined  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-approved  { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }

    /* KV */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 160px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11.5px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover:not(:disabled) { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover:not(:disabled)   { background: var(--hover); color: var(--t1); }
    .btn-warn    { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .btn-warn:hover  { background: #fef3c7; }
    .btn-danger  { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }
    .btn-danger:hover { background: #fee2e2; }
    .btn-purple  { background: var(--pu-bg); color: var(--pu); border: 1px solid var(--pu-bd); }
    .btn-purple:hover { background: #ede9fe; }
    .btn-sm      { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ALERTS */
    .alert { display: flex; gap: 10px; padding: 9px 12px 9px 13px; font-size: 12px;
      line-height: 1.55; border-left-width: 3px; border-left-style: solid; border-radius: var(--r); }
    .alert-warn  { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-red   { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-info  { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-green { background: var(--g-bg);  border-left-color: var(--g);  color: #14532d; }
    .alert-or    { background: var(--or-bg); border-left-color: var(--or); color: #7c2d12; }
    .alert-pu    { background: var(--pu-bg); border-left-color: var(--pu); color: #3b0764; }

    /* TABLES */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--bdr); background: var(--surf2); font-weight: 600; }
    .data-table td { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--hover); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: var(--hover); cursor: pointer; }
    .mono-cell { font-family: var(--f-mono); font-size: 11px; }

    /* LEDGER TABLE */
    .ledger-tbl { width: 100%; border-collapse: collapse; }
    .ledger-tbl th { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--t3); padding: 5px 10px; border-bottom: 1px solid var(--bdr);
      background: var(--surf2); font-weight: 600; text-align: left; }
    .ledger-tbl td { padding: 5px 10px; font-size: 11px; font-family: var(--f-mono);
      border-bottom: 1px solid var(--hover); }
    .ledger-tbl tr:last-child td { border-bottom: none; }
    .le-dr { color: var(--rd); font-weight: 600; }
    .le-cr { color: var(--g);  font-weight: 600; }

    /* FORM */
    .inp-label { font-size: 11px; color: var(--t2); margin-bottom: 4px; font-weight: 500; display: block; }
    .inp-hint  { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
    .inp-err   { font-size: 10.5px; color: var(--rd); margin-top: 3px; }
    .inp-field { width: 100%; padding: 7px 10px; border: 1px solid var(--bdr-mid);
      border-radius: var(--r); font-size: 12.5px; color: var(--t1);
      background: var(--inp); outline: none; font-family: var(--f-ui); transition: border-color 0.12s; }
    .inp-field:focus { border-color: var(--bdr-focus); }
    .inp-field:disabled { opacity: 0.5; cursor: not-allowed; background: var(--surf2); }
    select.inp-field { cursor: pointer; }
    .form-group { display: flex; flex-direction: column; }
    .inp-prefix-wrap { display: flex; align-items: stretch; }
    .inp-prefix { padding: 7px 10px; background: var(--surf2); border: 1px solid var(--bdr-mid);
      border-right: none; border-radius: var(--r) 0 0 var(--r); font-size: 12px;
      color: var(--t3); font-family: var(--f-mono); display: flex; align-items: center; flex-shrink: 0; }
    .inp-prefix + .inp-field { border-radius: 0 var(--r) var(--r) 0; }
    .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* TOGGLE */
    .toggle-row { display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid var(--hover); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 12px; color: var(--t1); }
    .toggle-sub   { font-size: 10.5px; color: var(--t3); margin-top: 1px; }
    .toggle-btn   { width: 32px; height: 18px; border-radius: 9px; border: none; cursor: pointer;
      position: relative; transition: background 0.15s; flex-shrink: 0; }
    .toggle-btn.on  { background: var(--cta); }
    .toggle-btn.off { background: var(--bdr-mid); }
    .toggle-btn::after { content: ''; position: absolute; top: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: white; transition: left 0.15s; }
    .toggle-btn.on::after  { left: 16px; }
    .toggle-btn.off::after { left: 2px; }
    .toggle-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* CARD VISUAL */
    .card-chip { width: 100%; max-width: 280px; height: 158px; border-radius: 8px;
      padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden; flex-shrink: 0; }
    .card-chip-active { background: linear-gradient(135deg, #1c1c2e 0%, #2e2e48 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
    .card-chip-frozen { background: linear-gradient(135deg, #1c2e2e 0%, #1a3a3a 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.18); }
    .card-chip-closed { background: linear-gradient(135deg, #2a2a2a 0%, #3a3a3a 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); opacity: 0.7; }
    .card-chip-blocked { background: repeating-linear-gradient(-45deg, #f0efe9 0px, #f0efe9 4px, #e8e6e1 4px, #e8e6e1 8px);
      border: 2px dashed var(--bdr-mid); box-shadow: none; }
    .card-net  { font-size: 9px; font-family: var(--f-mono); letter-spacing: 0.12em;
      text-transform: uppercase; opacity: 0.7; }
    .card-pan  { font-size: 15px; font-family: var(--f-mono); letter-spacing: 0.18em;
      color: #f0f0f8; font-weight: 500; }
    .card-pan-blocked { font-size: 13px; color: var(--t3); letter-spacing: 0.1em; }
    .card-meta { display: flex; justify-content: space-between; align-items: flex-end; }
    .card-holder { font-size: 11px; font-family: var(--f-mono); letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.7); }
    .card-exp { font-size: 11px; font-family: var(--f-mono); color: rgba(255,255,255,0.5); }
    .card-type-tag { font-size: 9px; font-family: var(--f-mono); padding: 2px 6px;
      border-radius: 2px; font-weight: 600; letter-spacing: 0.08em; }
    .card-corner-mark { position: absolute; top: 14px; right: 16px; width: 30px; height: 20px;
      border-radius: 2px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); }

    /* STATE PATH */
    .state-path { display: flex; align-items: center; flex-wrap: wrap; padding: 10px 14px; gap: 0; }
    .sp-node  { display: flex; align-items: center; }
    .sp-pill  { padding: 3px 9px; border-radius: 2px; font-size: 10px; font-family: var(--f-mono);
      font-weight: 600; letter-spacing: 0.05em; white-space: nowrap; border: 1px solid transparent; }
    .sp-pill.blocked  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .sp-pill.current  { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); box-shadow: 0 0 0 2px rgba(133,77,14,0.14); }
    .sp-pill.next     { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .sp-pill.future   { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .sp-pill.done     { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .sp-pill.active   { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .sp-pill.frozen   { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .sp-pill.closed-s { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .sp-pill.bad      { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .sp-pill.held     { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .sp-arrow { font-size: 10px; color: var(--t4); margin: 0 4px; flex-shrink: 0; }

    /* PROGRESS */
    .prog-wrap { height: 5px; background: var(--hover); border-radius: 3px; overflow: hidden; margin-top: 5px; }
    .prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .prog-green { background: var(--g); }
    .prog-amber { background: var(--am); }
    .prog-red   { background: var(--rd); }

    /* BALANCE GRID */
    .bal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: var(--bdr); border-radius: var(--r); overflow: hidden; }
    .bal-cell { background: var(--surface); padding: 11px 14px; }
    .bal-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); font-weight: 600; margin-bottom: 4px; }
    .bal-val   { font-size: 16px; font-weight: 600; font-family: var(--f-mono);
      letter-spacing: -0.02em; margin-bottom: 2px; }
    .bal-sub   { font-size: 10.5px; color: var(--t3); }

    /* REVIEW ROWS */
    .rev-row { display: flex; align-items: baseline; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid var(--hover); font-size: 12px; gap: 8px; }
    .rev-row:last-child { border-bottom: none; }
    .rev-k { color: var(--t3); font-size: 11px; }
    .rev-v { font-weight: 500; color: var(--t1); }
    .rev-v.mono { font-family: var(--f-mono); font-size: 11.5px; }
    .rev-v.good { color: var(--g); }
    .rev-v.warn { color: var(--am); }
    .rev-v.bad  { color: var(--rd); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,20,0.52);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg);
      width: 560px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08); }
    .modal-hdr  { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--bdr); flex-shrink: 0; background: var(--surf2); }
    .modal-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .modal-sub   { font-size: 11px; color: var(--t3); margin-top: 2px; }
    .modal-close { width: 24px; height: 24px; border-radius: var(--r); background: transparent;

                  status === 'CLOSED'    ? 'card-chip-closed' :

  return (
    <div className={`card-chip ${chipCls}`}>
      <div className="card-corner-mark" />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <span className="card-net" style={{ color: isBlocked ? 'var(--t3)' : 'rgba(255,255,255,0.5)' }}>

          <span style={{ fontSize: 9, fontFamily: 'var(--f-mono)', color: 'rgba(255,255,255,0.4)', background: 'rgba(0,0,0,0.2)', padding: '2px 6px', borderRadius: 2 }}>

        )}

        {isBlocked
          ? <div className="card-pan-blocked">KYC approval required</div>
          : <div className="card-pan">{card.pan}</div>
        }
      </div>
      <div className="card-meta">
        <div>
          <div className="card-holder" style={{ color: isBlocked ? 'var(--t3)' : undefined }}>{card.cardholder}</div>
          <div className="card-exp" style={{ color: isBlocked ? 'var(--t4)' : undefined }}>
            {card.expiry ? `EXP ${card.expiry}` : '—'}

        <div>
          <svg width="30" height="20" viewBox="0 0 30 20" fill="none" opacity={isBlocked ? 0.3 : 0.6}>

/* ── CARD DETAIL MODAL ──────────────────────────────────────────────────── */
const CardDetailModal = ({ card, localState, onStateChange, onClose }) => {
  const [actionMsg, setActionMsg] = useState('');
  const [revealMsg, setRevealMsg] = useState('');
  const status = localState || card.status;

  const doFreeze = () => {
    onStateChange(card.id, 'FROZEN');
    setActionMsg('Card frozen. All new authorizations will be declined. Audit event: card.frozen.');
  };
  const doUnfreeze = () => {
    onStateChange(card.id, 'ACTIVE');
    setActionMsg('Card unfrozen. Authorizations will be processed normally. Audit event: card.unfrozen.');
  };
  const doClose = () => {
    onStateChange(card.id, 'CLOSED');
    setActionMsg('Card closed permanently. This action cannot be reversed. Audit event: card.closed.');
  };
  const doReveal = () => {
    setRevealMsg('PAN reveal requires step-up authentication (re-authentication + OTP). This capability is not available in the local prototype. In production, vault detokenization is gated by step-up auth.');
  };

  const isBlocked = card.status === 'ISSUANCE_BLOCKED';

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <div>
            <div className="modal-title">Card Detail — {card.id}</div>
            <div className="modal-sub">{card.type} · Created {card.created}</div>
          </div>
          <button className="modal-close" onClick={onClose}><IcoX /></button>
        </div>
        <div className="modal-body">
          {/* Card visual */}
          <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start', flexWrap: 'wrap' }}>
            <CardChip card={card} localState={localState} />
            <div style={{ flex: 1, minWidth: 180 }}>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
                <Badge
                  cls={status === 'ACTIVE' ? 'b-active' : status === 'FROZEN' ? 'b-frozen' : status === 'CLOSED' ? 'b-closed' : 'b-blocked'}
                  label={status}
                />
                <Badge cls="b-locked" label={card.type} />
              </div>
              {actionMsg && (
                <div className="alert alert-green" style={{ fontSize: 11, marginBottom: 8 }}>
                  <IcoCheck /><div>{actionMsg}</div>
                </div>
              )}
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {!isBlocked && status !== 'CLOSED' && status !== 'FROZEN' && (
                  <button className="btn btn-purple btn-sm" onClick={doFreeze}><IcoSnowflake /> Freeze Card</button>
                )}
                {!isBlocked && status !== 'CLOSED' && status === 'FROZEN' && (
                  <button className="btn btn-ghost btn-sm" onClick={doUnfreeze}>Unfreeze Card</button>
                )}
                {!isBlocked && status !== 'CLOSED' && (
                  <button className="btn btn-danger btn-sm" onClick={doClose}>Close Card</button>
                )}
                {isBlocked && (
                  <span style={{ fontSize: 11, color: 'var(--rd)' }}>Issuance blocked — no actions available</span>
                )}
              </div>
            </div>
          </div>

          {/* KV details */}
          <div className="kv-table">
            <KV k="Card ID"           mono>{card.id}</KV>
            <KV k="Vault Token Ref"   mono>{card.tokenRef || 'Not issued'}</KV>
            <KV k="Masked PAN"        mono>{card.pan || '—'}</KV>
            <KV k="Expiry"            mono>{card.expiry || '—'}</KV>
            <KV k="Cardholder">{card.cardholder}</KV>
            <KV k="Status"><Badge cls={status === 'ACTIVE' ? 'b-active' : status === 'FROZEN' ? 'b-frozen' : status === 'CLOSED' ? 'b-closed' : 'b-blocked'} label={status} /></KV>
            <KV k="Funding Wallet"    mono>{card.wallet}</KV>
            <KV k="Spend Limit">{card.spendLimit}</KV>
            <KV k="Spend Used"        mono>{card.spendUsed}</KV>
            <KV k="Online Payments">{card.onlinePayments === null ? '—' : card.onlinePayments ? 'Enabled' : 'Disabled'}</KV>
            <KV k="ATM Withdrawals"><span style={{ color: 'var(--t3)' }}>Disabled (MVP scope)</span></KV>
            <KV k="Merchant Categories">{card.merchantCategories}</KV>
            <KV k="Last Authorization" mono style={{ fontSize: 11 }}><span style={{ fontSize: 11 }}>{card.lastAuth}</span></KV>
            <KV k="Ledger Hold Behavior">
              <span style={{ fontSize: 11, color: 'var(--t2)' }}>Auth approval creates hold on wallet.available. Capture moves hold to settlement. Reversal releases hold.</span>
            </KV>
          </div>

          {/* Reveal PAN */}
          <div style={{ borderTop: '1px solid var(--bdr)', paddingTop: 10 }}>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 7 }}>
              PAN / CVV
            </div>
            <button className="btn btn-ghost btn-sm" onClick={doReveal} style={{ marginBottom: revealMsg ? 8 : 0 }}>
              <IcoEye /> Reveal Full PAN
            </button>
            {revealMsg && (
              <div className="alert alert-pu" style={{ marginTop: 8, fontSize: 11.5 }}>
                <IcoLockSm /><div>{revealMsg}</div>
              </div>
            )}
          </div>

          {/* Audit trail */}
          <div style={{ borderTop: '1px solid var(--bdr)', paddingTop: 10 }}>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 7 }}>
              Audit Trail
            </div>
            {card.audit.map((a, i) => (
              <div key={i} className="audit-row">
                <div className="audit-ts">{a.ts}</div>
                <div className="audit-evt">{a.evt}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Close</button>
          <span className="modal-note">Read-only detail · Local prototype</span>
        </div>
      </div>
    </div>
  );
};

                    {AUTH_DATA.map((a, i) => (
                      <tr key={i} onClick={() => setDetailAuth(a)}>
                        <td><span className="mono-cell" style={{ color: 'var(--t1)' }}>{a.id}</span></td>
                        <td><span className="mono-cell">{a.ts}</span></td>
                        <td>
                          <div style={{ fontWeight: 500, fontSize: 12 }}>{a.merchant}</div>
                          <div style={{ fontSize: 10, color: 'var(--t3)', fontFamily: 'var(--f-mono)' }}>{a.mcc}</div>
                        </td>
                        <td style={{ textAlign: 'right' }}>
                          <span style={{ fontFamily: 'var(--f-mono)', fontSize: 11.5, fontWeight: 500 }}>{a.amount}</span>
                        </td>
                        <td><span className="mono-cell">{a.card.split('·')[0].trim()}</span></td>
                        <td><Badge cls={a.badgeCls} label={a.badgeLabel} /></td>
                        <td style={{ fontSize: 11, color: a.declineReason ? 'var(--rd)' : 'var(--t3)', maxWidth: 180 }}>
                          {a.declineReason
                            ? <span title={a.declineReason}>{a.ledgerEffect}</span>
                            : a.ledgerEffect}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* ── LEDGER / HOLD EXPLANATION ──────────────────────── */}
            <div className="panel">
              <div className="panel-hdr">
                <span className="panel-title">Ledger &amp; Authorization Hold Mechanics</span>
                <span style={{ fontSize: 10.5, color: 'var(--or)', fontFamily: 'var(--f-mono)' }}>
                  Active hold: EUR 75.00 · AUTH-48201
                </span>
              </div>
              <div className="panel-body">
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
                  <div>
                    <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 8 }}>
                      Current Balance State
                    </div>
                    {[
                      { k: 'Available balance',      v: 'EUR 842.50',    cls: 'good' },
                      { k: 'Authorization hold',     v: 'EUR 75.00',     cls: 'warn' },
                      { k: 'Pending deposit (in)',    v: 'EUR 250.00',    cls: 'warn' },
                      { k: 'Total ledger balance',   v: 'EUR 1,167.50',  cls: '' },
                      { k: 'Active hold (AUTH-48201)',v: 'Supermarkt Müller · 2026-05-17', cls: '' },
                    ].map((r, i) => (
                      <div key={i} className="rev-row">
                        <span className="rev-k">{r.k}</span>
                        <span className={`rev-v mono ${r.cls}`}>{r.v}</span>
                      </div>
                    ))}
                  </div>
                  <div>
                    <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 8 }}>
                      Authorization → Ledger Flow
                    </div>
                    {[
                      { step: '1. Auth approved', desc: 'DR user.wallet.available → CR issuer.auth.hold_account', color: 'var(--or)' },
                      { step: '2. Capture',       desc: 'DR issuer.auth.hold_account → CR issuer.settlement.account', color: 'var(--g)' },
                      { step: '3. Reversal',      desc: 'DR issuer.auth.hold_account → CR user.wallet.available', color: 'var(--pu)' },
                      { step: '4. Decline',       desc: 'No ledger entries. Balance unchanged.', color: 'var(--t3)' },
                    ].map((r, i) => (
                      <div key={i} style={{ padding: '6px 0', borderBottom: i < 3 ? '1px solid var(--hover)' : 'none' }}>
                        <div style={{ fontSize: 11, fontWeight: 600, color: r.color, marginBottom: 2 }}>{r.step}</div>
                        <div style={{ fontSize: 10.5, fontFamily: 'var(--f-mono)', color: 'var(--t2)' }}>{r.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

          </div>{/* left-scroll */}

          {/* ── TIMELINE RAIL ──────────────────────────────────────── */}
          <div className="tl-rail">
            <div className="tl-hdr">Card &amp; Auth Events</div>
            <div className="tl-body">
              {[
                { dot: 'held', ts: '2026-05-17 08:44', name: 'Auth Hold — Active',
                  actor: 'System · issuer',
                  desc: 'AUTH-48201 EUR 75.00 · Supermarkt Müller. Hold placed. Available reduced by EUR 75.00. Audit: card.authorization_approved_held.' },
                { dot: 'bad', ts: '2026-05-17 11:05', name: 'Issuance Blocked',
                  actor: 'System · eligibility-check',
                  desc: 'Card issuance attempt rejected — KYC in review. No vault token created. Audit: card.issue_blocked.' },
                { dot: 'ok', ts: '2026-05-16 13:22', name: 'Auth Captured',
                  actor: 'System · issuer',
                  desc: 'AUTH-48180 EUR 9.99 · Spotify AB. Hold released; debit settled. Audit: card.authorization_captured.' },
                { dot: 'bad', ts: '2026-05-14 20:15', name: 'Auth Declined',
                  actor: 'System · issuer',
                  desc: 'AUTH-48055 EUR 350.00 · ElektroShop. Declined — insufficient balance. Audit: card.authorization_declined.' },
                { dot: 'bad', ts: '2026-05-10 18:22', name: 'Auth Declined — Frozen',
                  actor: 'System · issuer',
                  desc: 'AUTH-47990 EUR 29.99 · Amazon. Declined — card CARD-90018 frozen. Audit: card.authorization_declined (card_frozen).' },
                { dot: 'neu', ts: '2026-05-08 11:05', name: 'Auth Reversed',
                  actor: 'System · issuer',
                  desc: 'AUTH-47881 EUR 65.00 · Billa AG. Merchant reversed. Hold released to available. Audit: card.authorization_reversed.' },
                { dot: 'pu', ts: '2026-03-20 11:04', name: 'Card Frozen',
                  actor: 'Elena Markovic · EU-10482',
                  desc: 'CARD-90018 frozen by user request. All new auths will decline. Audit: card.frozen.' },
                { dot: 'ok', ts: '2026-03-12 10:44', name: 'Card Issued',
                  actor: 'System · issuer',
                  desc: 'CARD-90031 issued. Vault token VLT-TOK-9031A created. Status: ACTIVE. Audit: card.issued.' },
              ].map((e, i, arr) => (
                <div key={i} className="tl-evt">
                  <div className="tl-spine">
                    <div className={`tl-dot ${e.dot}`} />
                    {i < arr.length - 1 && <div className="tl-line" />}
                  </div>
                  <div className="tl-content">
                    <div className="tl-ts">{e.ts}</div>
                    <div className="tl-name">{e.name}</div>
                    <div className="tl-actor">{e.actor}</div>
                    <div className="tl-desc">{e.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

        </div>{/* content-area */}
      </div>

      {detailCard && (
        <CardDetailModal
          card={detailCard}
          localState={cardLocalStates[detailCard.id]}
          onStateChange={handleCardStateChange}
          onClose={() => setDetailCard(null)}
        />
      )}
      {detailAuth && (
        <AuthDetailModal auth={detailAuth} onClose={() => setDetailAuth(null)} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
