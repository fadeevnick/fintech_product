<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Backoffice Work Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --hover:   #f0efe9;
      --sb:        #0e0e12;
      --sb-bdr:    #1a1a20;
      --sb-muted:  #4e4e5c;
      --sb-active: #1c1c2a;
      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;
      --t1: #1c1c1f;
      --t2: #575763;
      --t3: #9898a6;
      --t4: #d0d0da;
      --cta:     #1c1c1f;
      --cta-hov: #2e2e35;
      --cta-t:   #ffffff;
      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;
      --bl:   #1e40af;  --bl-bg:#eff6ff;  --bl-bd:#bfdbfe;
      --sb-env-bg:  #0e1a30;
      --sb-env-t:   #93c5fd;
      --sb-env-bd:  #1e3a6a;
      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;
      --r: 3px; --r-lg: 5px;
      --w-sb: 210px; --w-au: 256px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; display: flex; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 13px 13px 11px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 8px; }
    .sb-name  { font-size: 14px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
    .sb-nav   { flex: 1; padding: 8px 6px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 8px 4px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 7px; padding: 5px 8px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 11.5px;
      cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.28; }
    .nav-item.limited { opacity: 0.7; }
    .nav-item.nav-on  { color: #a5b4fc; opacity: 0.9; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; opacity: 1; }
    .nav-badge-ro { margin-left: auto; font-size: 8px; font-family: var(--f-mono);
      color: var(--or); background: var(--or-bg); border: 1px solid var(--or-bd);
      padding: 1px 4px; border-radius: 2px; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.5; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono); color: var(--sb-muted); opacity: 0.7; }
    .sb-div   { height: 1px; background: var(--sb-bdr); margin: 4px 0; }
    .sb-footer { padding: 9px 12px; border-top: 1px solid var(--sb-bdr); }
    .env-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 9.5px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 3px; }
    .env-dot  { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host { font-size: 9.5px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* MAIN */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .page-hdr  { display: flex; align-items: center; gap: 0; padding: 0;
      border-bottom: 1px solid var(--bdr); background: var(--surface); flex-shrink: 0; }
    .hdr-left  { display: flex; align-items: center; gap: 5px; padding: 9px 18px;
      font-size: 12px; color: var(--t2); flex: 1; min-width: 0; }
    .hdr-left strong { color: var(--t1); font-weight: 500; }
    .hdr-left .sep   { color: var(--t4); }
    .hdr-session { display: flex; align-items: center; gap: 8px; padding: 7px 14px;
      border-left: 1px solid var(--bdr); flex-shrink: 0; }
    .session-user { font-size: 11.5px; font-weight: 500; color: var(--t1); }
    .session-meta { font-size: 10px; color: var(--t3); font-family: var(--f-mono); }
    .hdr-right { display: flex; align-items: center; gap: 7px; padding: 9px 16px;
      border-left: 1px solid var(--bdr); flex-shrink: 0; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge-hdr { font-size: 10px; font-family: var(--f-mono); color: var(--bl);
      background: var(--bl-bg); border: 1px solid var(--bl-bd);
      padding: 2px 7px; border-radius: var(--r); display: flex; align-items: center; gap: 4px; }
    .env-bdot  { width: 5px; height: 5px; border-radius: 50%; background: var(--bl); }

    .main-body { flex: 1; overflow-y: auto; padding: 14px 18px; background: var(--bg);
      display: flex; flex-direction: column; gap: 14px; }

    /* METRICS STRIP */
    .metrics-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .metric-card { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); padding: 9px 12px; }
    .metric-val  { font-size: 22px; font-weight: 600; color: var(--t1); line-height: 1.1;
      font-family: var(--f-mono); letter-spacing: -0.02em; }
    .metric-val.rd  { color: var(--rd); }
    .metric-val.am  { color: var(--am); }
    .metric-val.bl  { color: var(--bl); }
    .metric-lbl  { font-size: 10px; color: var(--t3); margin-top: 3px; text-transform: uppercase;
      letter-spacing: 0.06em; }
    .metric-sub  { font-size: 10px; color: var(--t3); margin-top: 1px; }

    /* PRIORITY LANE */
    .section-hdr { display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--t2);
      text-transform: uppercase; letter-spacing: 0.07em; }
    .priority-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .priority-scroll::-webkit-scrollbar { height: 3px; }
    .priority-card { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); padding: 10px 12px; min-width: 210px; flex-shrink: 0;
      cursor: pointer; transition: border-color 0.12s; position: relative; }
    .priority-card:hover { border-color: var(--bdr-focus); }
    .priority-card.critical { border-left: 3px solid var(--rd); }
    .priority-card.high     { border-left: 3px solid var(--or); }
    .priority-card.medium   { border-left: 3px solid var(--am); }
    .pc-type  { font-size: 9.5px; color: var(--t3); text-transform: uppercase;
      letter-spacing: 0.08em; font-family: var(--f-mono); margin-bottom: 4px; }
    .pc-title { font-size: 12px; font-weight: 500; color: var(--t1); margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc-sub   { font-size: 10.5px; color: var(--t2); margin-bottom: 6px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .pc-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pc-age   { font-size: 10px; color: var(--t3); font-family: var(--f-mono); }

    /* QUEUE GRID */
    .queue-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .queue-card { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); padding: 11px 13px; cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s; }
    .queue-card:hover  { border-color: var(--bdr-focus); }
    .queue-card.sel    { border-color: var(--cta); box-shadow: 0 0 0 1px var(--cta); }
    .queue-card.ro     { background: #fffdf5; }
    .queue-card.senior { opacity: 0.65; }
    .qc-name   { font-size: 11.5px; font-weight: 600; color: var(--t1); margin-bottom: 7px;
      display: flex; align-items: center; justify-content: space-between; }
    .qc-counts { display: flex; gap: 12px; margin-bottom: 7px; }
    .qc-count  { display: flex; flex-direction: column; }
    .qc-num    { font-size: 17px; font-weight: 600; font-family: var(--f-mono); color: var(--t1);
      line-height: 1.1; letter-spacing: -0.02em; }
    .qc-num.rd { color: var(--rd); }
    .qc-lbl    { font-size: 9.5px; color: var(--t3); }
    .qc-meta   { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .qc-age    { font-size: 10px; color: var(--t3); font-family: var(--f-mono); }
    .qc-sla    { font-size: 9px; padding: 1.5px 5px; border-radius: 2px; font-family: var(--f-mono);
      font-weight: 600; letter-spacing: 0.05em; }
    .sla-ok     { background: var(--g-bg);  color: var(--g);   border: 1px solid var(--g-bd); }
    .sla-warn   { background: var(--am-bg); color: var(--am);  border: 1px solid var(--am-bd); }
    .sla-breach { background: var(--rd-bg); color: var(--rd);  border: 1px solid var(--rd-bd); }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em;
      font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-critical  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-high      { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-medium    { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-low       { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-allowed   { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-ro        { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-senior    { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-oidc      { background: var(--bl-bg); color: var(--bl);  border-color: var(--bl-bd); }
    .b-open      { background: var(--bl-bg); color: var(--bl);  border-color: var(--bl-bd); }
    .b-review    { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-evidence  { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-done      { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-co        { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-op        { background: #f0f9ff;     color: #0369a1;    border-color: #bae6fd; }
    .b-sc        { background: #fff1f2;     color: #be123c;    border-color: #fecdd3; }

    /* FILTER BAR */
    .filter-bar  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-grp  { display: flex; align-items: center; gap: 4px; }
    .filter-lbl  { font-size: 10px; color: var(--t3); text-transform: uppercase;
      letter-spacing: 0.07em; white-space: nowrap; }
    .filter-chip { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--bdr-mid); background: var(--surface);
      color: var(--t3); transition: all 0.1s; font-family: var(--f-ui); white-space: nowrap; }
    .filter-chip:hover  { color: var(--t2); background: var(--hover); }
    .filter-chip.active { background: var(--cta); color: #fff; border-color: var(--cta); }
    .filter-chip.rd.active { background: var(--rd); border-color: var(--rd); }
    .filter-chip.am.active { background: var(--am); border-color: var(--am); }
    .filter-toggle { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--bdr-mid); background: var(--surface);
      color: var(--t3); transition: all 0.1s; font-family: var(--f-ui); }
    .filter-toggle.on { background: var(--bl-bg); color: var(--bl); border-color: var(--bl-bd); }
    .search-wrap { display: flex; align-items: center; gap: 0; flex: 1; max-width: 240px; margin-left: auto; }
    .search-input { background: var(--surface); border: 1px solid var(--bdr-mid);
      border-radius: var(--r); padding: 4px 10px; font-size: 12px; color: var(--t1);
      font-family: var(--f-ui); width: 100%; outline: none; }
    .search-input::placeholder { color: var(--t4); }
    .search-input:focus { border-color: var(--bdr-focus); }

    /* WORK TABLE */
    .table-wrap { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; }
    .table-hdr-row { display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .table-hdr-title { font-size: 11px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .wt { width: 100%; border-collapse: collapse; }
    .wt th { font-size: 10px; font-weight: 600; color: var(--t3); text-transform: uppercase;
      letter-spacing: 0.07em; padding: 6px 10px; border-bottom: 1px solid var(--bdr);
      text-align: left; white-space: nowrap; background: var(--surf2); }
    .wt td { padding: 7px 10px; border-bottom: 1px solid var(--hover); font-size: 12px;
      color: var(--t1); vertical-align: middle; }
    .wt tr:last-child td { border-bottom: none; }
    .wt tr.sel-row td { background: #f5f4ff; }
    .wt tr:hover td  { background: var(--hover); }
    .wt tr.sel-row:hover td { background: #f0eeff; }
    .wt tr { cursor: pointer; }
    .td-mono  { font-family: var(--f-mono); font-size: 11px; color: var(--t2); }
    .td-muted { color: var(--t3); }
    .td-sub   { font-size: 10.5px; color: var(--t3); margin-top: 1px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 5px 11px; border-radius: var(--r); font-size: 11.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover { background: var(--cta-hov); }
    .btn-ghost  { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover { background: var(--hover); color: var(--t1); }
    .btn-danger { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }
    .btn-danger:hover { background: var(--rd-bd); }
    .btn-disabled { background: var(--surface); color: var(--t4); border: 1px solid var(--bdr);
      cursor: not-allowed; }
    .btn-sm { padding: 3px 8px; font-size: 10.5px; }
    .btn-xs { padding: 2px 7px; font-size: 10px; }

    /* ALERTS */
    .alert { display: flex; gap: 10px; padding: 8px 11px 8px 12px; font-size: 11.5px;
      line-height: 1.55; border-radius: 0 var(--r) var(--r) 0;
      border-left-width: 3px; border-left-style: solid; }
    .alert-icon { flex-shrink: 0; font-style: normal; font-size: 11px; margin-top: 1px; font-weight: 600; }
    .alert-err  { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-warn { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-info { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-blue { background: var(--bl-bg); border-left-color: var(--bl); color: #1e3a8a; }
    .alert-pu   { background: var(--pu-bg); border-left-color: var(--pu); color: #4c1d95; }

    /* KV TABLE */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 4.5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 140px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11px; }

    /* DETAIL PANEL */
    .detail-pane { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; }
    .detail-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .detail-title { font-size: 12px; font-weight: 600; color: var(--t1); display: flex; align-items: center; gap: 8px; }
    .detail-body  { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .detail-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .action-grid  { display: flex; flex-direction: column; gap: 6px; }
    .action-row   { display: flex; align-items: center; justify-content: space-between;
      padding: 5px 9px; border-radius: var(--r); border: 1px solid var(--bdr); }
    .action-row.allowed { border-color: var(--g-bd); background: var(--g-bg); }
    .action-row.blocked { border-color: var(--bdr); background: var(--hover); opacity: 0.6; }
    .action-name  { font-size: 12px; color: var(--t1); }
    .action-name.dim { color: var(--t3); }
    .action-reason { font-size: 10.5px; color: var(--t3); }
    .timeline-row  { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); align-items: flex-start; }
    .timeline-row:last-child { border-bottom: none; }
    .tl-dot  { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .tl-dot.ok  { background: var(--g); }
    .tl-dot.bad { background: var(--rd); }
    .tl-dot.am  { background: var(--am); }
    .tl-dot.bl  { background: var(--bl); }
    .tl-ts   { font-size: 10px; color: var(--t3); font-family: var(--f-mono); min-width: 60px; flex-shrink: 0; }
    .tl-txt  { font-size: 11.5px; color: var(--t2); }

    /* AUDIT RAIL */
    .audit-rail { width: var(--w-au); flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .audit-hdr  { padding: 9px 13px; border-bottom: 1px solid var(--bdr);
      font-size: 9.5px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.1em; }
    .audit-body { flex: 1; overflow-y: auto; padding: 11px 13px; display: flex; flex-direction: column; gap: 0; }
    .audit-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--t3); margin-bottom: 6px; margin-top: 2px; }
    .audit-evt  { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .audit-evt:last-child { border-bottom: none; }
    .audit-dot  { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .audit-dot.ok  { background: var(--g); }
    .audit-dot.bad { background: var(--rd); }
    .audit-dot.am  { background: var(--am); }
    .audit-dot.bl  { background: var(--bl); }
    .audit-dot.dim { background: var(--t4); }
    .audit-name { font-size: 10.5px; font-family: var(--f-mono); color: var(--t1); }
    .audit-meta { font-size: 9.5px; color: var(--t3); margin-top: 1px; }
    .sec-fact { display: flex; gap: 8px; padding: 4.5px 0; border-bottom: 1px solid var(--hover); }
    .sec-fact:last-child { border-bottom: none; }

const DetailPanel = ({ itemId, onClose }) => {
  const item = WORK_ITEMS.find(i => i.id === itemId);
  const detail = DETAIL_DATA[itemId];
  const [openingCase, setOpeningCase] = useState(false);

  if (!item) return null;

  return (
    <div className="detail-pane">
      <div className="detail-hdr">
        <div className="detail-title">
          <span style={{ fontFamily: 'var(--f-mono)', fontSize: '11.5px' }}>{item.id}</span>
          <Bdg type={item.priority} />
          {detail && <Bdg type={detail.risk} label={`Risk: ${detail.risk}`} />}
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          <Bdg type={item.status} label={statusLabel[item.status]} />
          <button className="btn btn-ghost btn-sm" onClick={onClose}>Close</button>
        </div>
      </div>
      <div className="detail-body">
        {detail ? (
          <>
            {detail.auditNote && (
              <Alrt type="pu" icon="!">
                <strong>Sensitive read:</strong> {detail.auditNote}
              </Alrt>
            )}
            <div className="detail-grid">
              <div>
                <div style={{ fontSize: '10px', color: 'var(--t3)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 7 }}>Case summary</div>
                <div className="kv-table">
                  <KV k="Subject"   v={detail.subject} />
                  <KV k="User ID"   v={detail.userId} mono />
                  <KV k="Queue"     v={detail.queue} />
                  <KV k="Trigger"   v={detail.trigger} />
                  {detail.amount && <KV k="Exposure" v={detail.amount} mono />}
                  <KV k="Risk score" v={`${detail.riskScore}/100`} mono />
                  <KV k="Prior alerts" v={String(detail.priorAlerts)} mono />
                  <KV k="Required role"><Bdg type={detail.roleReq} /></KV>
                </div>
              </div>
              <div>
                <div style={{ fontSize: '10px', color: 'var(--t3)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 7 }}>Timeline</div>
                <div>
                  {detail.timeline.map((t, i) => (
                    <div key={i} className="timeline-row">
                      <div className={`tl-dot ${t.dot}`} />
                      <span className="tl-ts">{t.ts}</span>
                      <span className="tl-txt">{t.txt}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="detail-grid">
              <div>
                <div style={{ fontSize: '10px', color: 'var(--t3)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 7 }}>Allowed actions (Maya · CO)</div>
                <div className="action-grid">
                  {detail.allowed.map((a, i) => (
                    <div key={i} className="action-row allowed">
                      <span className="action-name">✓ {a}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div>
                <div style={{ fontSize: '10px', color: 'var(--t3)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 7 }}>Blocked actions</div>
                <div className="action-grid">
                  {detail.blocked.map((b, i) => (
                    <div key={i} className="action-row blocked">
                      <span className="action-name dim">— {b.action}</span>
                      <span className="action-reason">{b.reason}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', borderTop: '1px solid var(--bdr)', paddingTop: 10 }}>
              <button className="btn btn-primary" onClick={() => setOpeningCase(true)}>
                Open case details
              </button>
              <button className="btn btn-ghost btn-sm">Assign to self</button>
              <button className="btn btn-ghost btn-sm">Escalate</button>
              {itemId === 'AML-8831' && <button className="btn btn-danger btn-sm">Freeze account</button>}
              <button className="btn btn-disabled btn-sm" title="senior_compliance required">Senior override</button>
              {openingCase && (
                <span style={{ alignSelf: 'center', fontSize: '11px', color: 'var(--g)', fontFamily: 'var(--f-mono)' }}>
                  ✓ Audit note recorded · backoffice.sensitive_read
                </span>
              )}
            </div>
          </>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div className="kv-table">
              <KV k="Case ID"  v={item.id} mono />
              <KV k="Queue"    v={item.queue} />
              <KV k="Subject"  v={item.subject} />
              <KV k="Detail"   v={item.detail} />
              {item.amount && <KV k="Amount" v={item.amount} mono />}
              <KV k="Status"><Bdg type={item.status} label={statusLabel[item.status]} /></KV>
              <KV k="Assigned" v={item.assigned || 'Unassigned'} />
              <KV k="Age"      v={item.age} mono />
            </div>
            {item.roleReq === 'OP' && (
              <Alrt type="warn" icon="i">
                This queue is <strong>read-only</strong> for compliance_officer.
                Write access requires backoffice_operator or senior_compliance role.
              </Alrt>
            )}
            {item.roleReq === 'SC' && (
              <Alrt type="err" icon="×">
                This case requires <strong>senior_compliance</strong> role. Contact your senior compliance admin.
              </Alrt>
            )}

              {item.roleReq !== 'SC' && <button className="btn btn-primary btn-sm">
                {item.roleReq === 'OP' ? 'View (read-only)' : 'Open case'}
              </button>}
              <button className="btn btn-ghost btn-sm">Assign to self</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* ── AUDIT RAIL ── */
const AuditRail = ({ selectedItem }) => {
  const events = [
    { name: 'oidc.login_succeeded',      meta: '14:12:08 · maya.ivanova@…', dot: 'ok' },
    { name: 'backoffice.role_mapped',    meta: '14:12:08 · compliance_officer', dot: 'ok' },
    { name: 'backoffice.queue_opened',   meta: '14:13:01 · Work Queue',     dot: 'bl' },
    { name: 'backoffice.case_read',      meta: '14:14:22 · KYC-1042',       dot: 'bl' },
    { name: 'backoffice.sensitive_read', meta: '14:15:08 · SNX-2110',       dot: 'am' },
    { name: 'backoffice.case_assigned',  meta: '14:15:40 · KYC-1042 → maya', dot: 'ok' },

      <div className="audit-hdr">Audit &amp; Security</div>
      <div className="audit-body">
        <div className="audit-sec">Session identity</div>
        <div className="kv-table" style={{ marginBottom: 8 }}>
          <KV k="User"   v={USER.name} />
          <KV k="Role">  <Bdg type="CO" /></KV>

        </div>
        <div className="hr" />
        <div className="audit-sec">Read-audit required</div>
        {[
          'AML HIGH / CRITICAL alert details',
          'Sanctions hit details',
          'Frozen account review',
          'Audit log viewer access',
        ].map((f, i) => (
          <div key={i} className="sec-fact">
            <span className="sec-mark">!</span>
            <span className="sec-text">{f}</span>
          </div>
        ))}
        <div className="hr" />
        <div className="audit-sec">Event log (this session)</div>
        {events.map((ev, i) => (
          <div key={i} className="audit-evt">
            <div className={`audit-dot ${ev.dot}`} />
            <div>
              <div className="audit-name">{ev.name}</div>
              <div className="audit-meta">{ev.meta}</div>
            </div>
          </div>
        ))}
        <div className="hr" />
        <div className="audit-sec">Security invariants</div>
        {[
          'End-user and merchant cookie sessions cannot access backoffice APIs.',
          'All queue opens and sensitive reads are audited with actor + timestamp.',
          'Role mapping enforced server-side on every request.',
          'Bearer token validated on every backoffice API call.',
        ].map((f, i) => (
          <div key={i} className="sec-fact">
            <span className="sec-mark">—</span>
            <span className="sec-text">{f}</span>
          </div>
        ))}
      </div>
    </aside>
  );
};

/* ── APP ── */
function App() {
  const [selectedQueue, setSelectedQueue] = useState(null);
  const [selectedItem, setSelectedItem]   = useState(null);
  const [filterP,      setFilterP]        = useState('all');
  const [filterSla,    setFilterSla]      = useState('all');
  const [assignedMe,   setAssignedMe]     = useState(false);
  const [search,       setSearch]         = useState('');

  const handleQueueSelect = (qid) => {
    setSelectedQueue(qid);
    setSelectedItem(null);
  };

  const handleItemSelect = (id) => {
    setSelectedItem(id);
  };

  const handlePrioritySelect = (caseId) => {
    setSelectedItem(caseId);
    const item = WORK_ITEMS.find(i => i.id === caseId);
    if (item) setSelectedQueue(item.qid);
  };

  const filteredItems = useMemo(() => {
    return WORK_ITEMS.filter(item => {
      if (selectedQueue && item.qid !== selectedQueue) return false;
      if (filterP !== 'all' && item.priority !== filterP) return false;
      if (filterSla !== 'all' && item.sla !== filterSla) return false;
      if (assignedMe && item.assigned !== 'Maya I.') return false;
      if (search) {
        const q = search.toLowerCase();
        if (!item.id.toLowerCase().includes(q) && !item.subject.toLowerCase().includes(q) && !item.detail.toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }, [selectedQueue, filterP, filterSla, assignedMe, search]);

  const selectedQueueLabel = QUEUES.find(q => q.id === selectedQueue)?.label;

  return (
    <>
      <Sidebar />
      <div className="main-wrap">
        {/* PAGE HEADER */}
        <div className="page-hdr">
          <div className="hdr-left">
            <span>Backoffice</span>
            <span className="sep" style={{ color: 'var(--t4)' }}>/</span>
            <strong>Work Queue</strong>
            {selectedQueueLabel && <>
              <span className="sep" style={{ color: 'var(--t4)' }}>·</span>
              <span style={{ fontFamily: 'var(--f-mono)', fontSize: '11.5px', color: 'var(--t2)' }}>{selectedQueueLabel}</span>
            </>}
          </div>
          <div className="hdr-session">
            <div>
              <div className="session-user">{USER.name}</div>
              <div className="session-meta">{USER.email}</div>
            </div>
            <Bdg type="CO" />
            <span className="badge b-oidc">OIDC</span>
            <span style={{ fontSize: '10px', color: 'var(--t3)', fontFamily: 'var(--f-mono)', whiteSpace: 'nowrap' }}>exp {USER.tokenExp}</span>
          </div>
          <div className="hdr-right">
            <span className="screen-id">BOF-UI-02</span>
            <span className="env-badge-hdr"><span className="env-bdot" />Local Sandbox</span>
          </div>
        </div>

        {/* MAIN BODY */}
        <div className="main-body">
          <MetricsStrip />
          <PriorityLane onSelect={handlePrioritySelect} />
          <QueueGrid selectedQueue={selectedQueue} onSelect={handleQueueSelect} />

          {/* TABLE SECTION */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <FilterBar
              filterP={filterP} setFilterP={setFilterP}
              filterSla={filterSla} setFilterSla={setFilterSla}
              assignedMe={assignedMe} setAssignedMe={setAssignedMe}
              search={search} setSearch={setSearch}
            />
            <WorkTable items={filteredItems} selectedId={selectedItem} onSelect={handleItemSelect} />
            {selectedItem && (
              <DetailPanel itemId={selectedItem} onClose={() => setSelectedItem(null)} />
            )}
          </div>

          {/* RBAC NOTE for limited queue */}
          {selectedQueue && QUEUES.find(q => q.id === selectedQueue)?.access === 'ro' && (
            <Alrt type="warn" icon="i">
              <strong>Read-only access:</strong> You are viewing <strong>{selectedQueueLabel}</strong> as compliance_officer.
              Approve, reject, and write actions require backoffice_operator or senior_compliance role.
              Contact your senior compliance admin to request elevated access.
            </Alrt>
          )}
          {selectedQueue === 'chargebacks' && (
            <Alrt type="pu" icon="×">
              <strong>senior_compliance required:</strong> Chargeback decisions require senior_compliance role.
              You can view this queue but all action buttons are disabled.
            </Alrt>
          )}
        </div>
      </div>
      <AuditRail selectedItem={selectedItem} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
