<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Backoffice OIDC Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --hover:   #f0efe9;

      /* Sidebar — slightly cooler than merchant/end-user to signal higher-privilege surface */
      --sb:        #0e0e12;
      --sb-bdr:    #1a1a20;
      --sb-t:      #c4c4d2;
      --sb-muted:  #4e4e5c;
      --sb-hover:  #161620;
      --sb-active: #1c1c2a;

      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;

      --t1: #1c1c1f;
      --t2: #575763;
      --t3: #9898a6;
      --t4: #d0d0da;

      --cta:     #1c1c1f;
      --cta-hov: #2e2e35;
      --cta-t:   #ffffff;

      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;
      --bl:   #1e40af;  --bl-bg:#eff6ff;  --bl-bd:#bfdbfe;

      --sb-env-bg:  #0e1a30;
      --sb-env-t:   #93c5fd;
      --sb-env-bd:  #1e3a6a;

      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;
      --r:    3px;
      --r-lg: 5px;
      --w-sb: 220px;
      --w-au: 272px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; display: flex; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* ── SIDEBAR ── */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 15px 15px 13px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14.5px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase;
      letter-spacing: 0.1em; margin-top: 4px; }
    .sb-nav   { flex: 1; padding: 10px 7px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 9px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 12px;
      cursor: default; user-select: none; transition: background 0.1s; position: relative; }
    .nav-item.locked  { opacity: 0.3; }
    .nav-item.limited { opacity: 0.65; }
    .nav-item.active-nav { background: var(--sb-active); color: #a5b4fc; opacity: 1; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; opacity: 1; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.6; }
    .nav-badge-ro { margin-left: auto; font-size: 8.5px; font-family: var(--f-mono);
      color: var(--or); background: var(--or-bg); border: 1px solid var(--or-bd);
      padding: 1px 4px; border-radius: 2px; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono);
      color: var(--sb-muted); opacity: 0.8; }
    .sb-div   { height: 1px; background: var(--sb-bdr); margin: 5px 0; }
    .sb-footer { padding: 10px 14px; border-top: 1px solid var(--sb-bdr); }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 10px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 4px; }
    .env-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host  { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* ── MAIN ── */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .page-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .page-bc   { font-size: 12.5px; color: var(--t2); display: flex; align-items: center; gap: 5px; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep   { color: var(--t3); }
    .page-bc .mode  { font-family: var(--f-mono); font-size: 11.5px; color: var(--t2); }
    .page-meta { display: flex; align-items: center; gap: 8px; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge { font-size: 10px; font-family: var(--f-mono); color: var(--bl);
      background: var(--bl-bg); border: 1px solid var(--bl-bd);
      padding: 2px 8px; border-radius: var(--r); display: flex; align-items: center; gap: 5px; }
    .env-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--bl); }
    .main-body { flex: 1; overflow-y: auto; padding: 18px 22px; background: var(--bg); }

    /* ── STATE TABS ── */
    .mode-tabs { display: flex; border-bottom: 1px solid var(--bdr); margin-bottom: 18px; }
    .mode-tab  { padding: 7px 15px; font-size: 12px; font-weight: 500; color: var(--t3);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      white-space: nowrap; user-select: none; transition: color 0.12s, border-color 0.12s; }
    .mode-tab:hover  { color: var(--t2); }
    .mode-tab.active { color: var(--t1); border-bottom-color: var(--t1); }
    .mode-tab.err-tab { color: var(--rd); }
    .mode-tab.err-tab.active { border-bottom-color: var(--rd); }

    /* ── PANELS ── */
    .panel      { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; }
    .panel-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .panel-title { font-size: 11.5px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 14px 16px; }

    /* ── FORM / FIELDS ── */
    .field     { display: flex; flex-direction: column; gap: 4px; }
    .field-lbl { font-size: 10.5px; font-weight: 500; color: var(--t2);
      text-transform: uppercase; letter-spacing: 0.06em; }
    .field-hint { font-size: 10.5px; color: var(--t3); }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover { background: var(--hover); color: var(--t1); }
    .btn-oidc    { background: #1a3a6e; color: #fff; gap: 9px; }
    .btn-oidc:hover { background: #163060; }
    .btn-sm      { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── ALERTS ── */
    .alert { display: flex; gap: 10px; padding: 9px 12px 9px 13px; font-size: 12px;
      line-height: 1.55; border-radius: 0 var(--r) var(--r) 0;
      border-left-width: 3px; border-left-style: solid; }
    .alert-icon { flex-shrink: 0; font-style: normal; font-size: 11px; margin-top: 1px; font-weight: 600; }
    .alert-err  { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-ok   { background: var(--g-bg);  border-left-color: var(--g);  color: #14532d; }
    .alert-warn { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-info { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-blue { background: var(--bl-bg); border-left-color: var(--bl); color: #1e3a8a; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
      font-family: var(--f-mono); border: 1px solid transparent; }
    .b-active     { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-denied     { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-expired    { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-locked     { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-ro         { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-oidc       { background: var(--bl-bg); color: var(--bl);  border-color: var(--bl-bd); }
    .b-pending    { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-missing    { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-allowed    { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-401        { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-403        { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-role-op    { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
    .b-role-co    { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }
    .b-role-sc    { background: #fff1f2; color: #be123c; border-color: #fecdd3; }

    /* ── KV TABLE ── */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 160px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11.5px; }

    /* ── SUCCESS BLOCK ── */
    .success-hdr    { display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      background: var(--g-bg); border: 1px solid var(--g-bd);
      border-left: 3px solid var(--g); border-radius: 0 var(--r) var(--r) 0; }
    .success-circle { width: 26px; height: 26px; border-radius: 50%; background: var(--g);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0; font-weight: 700; }
    .success-title  { font-size: 13px; font-weight: 600; color: var(--g); }
    .success-sub    { font-size: 11px; color: #2d6a4f; margin-top: 2px; }

    /* ── PERMISSIONS GRID ── */
    .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .perm-row  { display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px; border-radius: var(--r); background: var(--surf2); }
    .perm-name { font-size: 11.5px; color: var(--t2); }
    .perm-row.allowed { background: var(--g-bg); }
    .perm-row.denied  { background: var(--hover); opacity: 0.7; }
    .perm-row.ro      { background: var(--or-bg); }

    /* ── ROLE TABLE ── */
    .role-table { display: flex; flex-direction: column; gap: 0; }
    .role-row   { display: flex; align-items: center; gap: 12px; padding: 8px 10px;
      border-bottom: 1px solid var(--bdr); }
    .role-row:last-child { border-bottom: none; }
    .role-row.active-role { background: var(--pu-bg); }
    .role-name  { font-family: var(--f-mono); font-size: 11px; color: var(--t1); min-width: 190px; }
    .role-desc  { font-size: 11px; color: var(--t3); flex: 1; }

    /* ── EVENT LOG ── */
    .ev-log   { display: flex; flex-direction: column; }
    .ev-row   { display: grid; grid-template-columns: 80px 1fr 90px 52px; gap: 10px;
      padding: 5px 0; border-bottom: 1px solid var(--hover); align-items: center; }
    .ev-row:last-child { border-bottom: none; }
    .ev-ts    { font-size: 10px; color: var(--t3); font-family: var(--f-mono); }
    .ev-name  { font-size: 11px; color: var(--t1); font-family: var(--f-mono); }
    .ev-actor { font-size: 10.5px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev-out   { display: flex; justify-content: flex-end; }

    /* ── REDIRECTING SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--bdr);
      border-top-color: var(--bl); border-radius: 50%;
      animation: spin 0.8s linear infinite; flex-shrink: 0; }

    /* ── POLICY DRAWER ── */
    .policy-drawer { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; }
    .policy-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }

    /* ── AUDIT RAIL ── */
    .audit-rail { width: var(--w-au); flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .audit-hdr  { padding: 10px 14px; border-bottom: 1px solid var(--bdr);
      font-size: 9.5px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.1em; }
    .audit-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .audit-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--t3); margin-bottom: 7px; margin-top: 2px; }
    .audit-evt  { display: flex; gap: 9px; padding: 5.5px 0; border-bottom: 1px solid var(--hover); }
    .audit-evt:last-child { border-bottom: none; }
    .audit-dot  { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .audit-dot.ok   { background: var(--g); }
    .audit-dot.pend { background: var(--am); }
    .audit-dot.bad  { background: var(--rd); }
    .audit-dot.dim  { background: var(--t4); }
    .audit-dot.bl   { background: var(--bl); }
    .audit-name { font-size: 11px; font-family: var(--f-mono); color: var(--t1); }
    .audit-meta { font-size: 10px; color: var(--t3); margin-top: 1px; }
    .sec-fact { display: flex; gap: 9px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .sec-fact:last-child { border-bottom: none; }
    .sec-mark { font-size: 10px; color: var(--t3); flex-shrink: 0; margin-top: 2px; font-family: var(--f-mono); }
    .sec-text { font-size: 11px; color: var(--t2); line-height: 1.45; }

    /* ── UTILITY ── */
    .col   { display: flex; flex-direction: column; gap: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .hr    { height: 1px; background: var(--bdr); margin: 11px 0; }

    /* OIDC provider chip */
    .oidc-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px;
      border-radius: var(--r); background: var(--bl-bg); border: 1px solid var(--bl-bd);
      font-size: 11px; color: var(--bl); font-family: var(--f-mono); }
    .oidc-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--bl); }

    /* denied code */
    .denied-code { font-size: 36px; font-weight: 600; font-family: var(--f-mono); line-height: 1; }
    .code-rd  { color: var(--rd); }
    .code-or  { color: var(--or); }
    .code-pu  { color: var(--pu); }

    @media (max-width: 1100px) { :root { --w-au: 240px; } }
    @media (max-width: 900px)  { .audit-rail { display: none; } }
    @media (max-width: 680px)  { .sidebar { display: none; } .grid2, .perm-grid { grid-template-columns: 1fr; } }
  </style>
</head>

const Badge = ({ type, label }) => {
  const map = {
    ACTIVE:    ['b-active',  'ACTIVE'],
    DENIED:    ['b-denied',  'DENIED'],
    EXPIRED:   ['b-expired', 'EXPIRED'],
    LOCKED:    ['b-locked',  'LOCKED'],
    RO:        ['b-ro',      'READ-ONLY'],
    OIDC:      ['b-oidc',    'OIDC'],
    PENDING:   ['b-pending', 'PENDING'],
    MISSING:   ['b-missing', 'CLAIM MISSING'],
    ALLOWED:   ['b-allowed', 'ALLOWED'],
    '401':     ['b-401',     '401'],
    '403':     ['b-403',     '403'],
    OP:        ['b-role-op', 'backoffice_operator'],
    CO:        ['b-role-co', 'compliance_officer'],
    SC:        ['b-role-sc', 'senior_compliance'],
  };
  const [cls, dflt] = map[type] || ['b-locked', type];
  return <span className={`badge ${cls}`}>{label || dflt}</span>;
};

  );
};

/* ── AUDIT RAIL ── */
const SECURITY_FACTS = [
  { mark: '—', text: 'No backoffice password is collected by MiniFin UI.' },
  { mark: '—', text: 'OIDC token validated server-side on every API request.' },
  { mark: '—', text: 'Backoffice endpoints require bearer token — not platform cookie.' },
  { mark: '—', text: 'End-user and merchant cookie sessions cannot access backoffice APIs.' },
  { mark: '—', text: 'Role mapping enforced server-side from Keycloak group/role claim.' },
  { mark: '—', text: 'Login success, denied access, and session expiry are audited.' },
  { mark: '—', text: 'PKCE prevents authorization code interception attacks.' },
];

const AuditRail = ({ mode }) => (
  <aside className="audit-rail">
    <div className="audit-hdr">Audit &amp; Security</div>
    <div className="audit-body">
      <EvLog mode={mode} />
      <div className="hr" />
      <div className="audit-sec">Security invariants</div>
      {SECURITY_FACTS.map((f, i) => (
        <div key={i} className="sec-fact">
          <span className="sec-mark">{f.mark}</span>
          <span className="sec-text">{f.text}</span>
        </div>
      ))}
    </div>
  </aside>
);

/* ── SIDEBAR ── */
const NAV_LOCKED = [
  { ico: <IcoQueue />,     label: 'Work Queue' },
  { ico: <IcoDeposit />,  label: 'Manual Deposits' },
  { ico: <IcoWithdraw />, label: 'Manual Withdrawals' },
  { ico: <IcoKyc />,      label: 'KYC Cases' },
  { ico: <IcoAml />,      label: 'AML Alerts' },
  { ico: <IcoSanctions />,label: 'Sanctions Hits' },
  { ico: <IcoChargeback />,label: 'Chargebacks' },
  { ico: <IcoAudit />,    label: 'Audit Log' },
];

const NAV_AUTH = [
  { ico: <IcoQueue />,     label: 'Work Queue',        state: 'active-nav' },
  { ico: <IcoDeposit />,  label: 'Manual Deposits',   state: 'limited', tag: 'ro' },
  { ico: <IcoWithdraw />, label: 'Manual Withdrawals',state: 'limited', tag: 'ro' },
  { ico: <IcoKyc />,      label: 'KYC Cases',          state: 'active-nav' },
  { ico: <IcoAml />,      label: 'AML Alerts',         state: 'active-nav' },
  { ico: <IcoSanctions />,label: 'Sanctions Hits',     state: 'active-nav' },
  { ico: <IcoChargeback />,label: 'Chargebacks',       state: 'locked', tag: 'lock' },
  { ico: <IcoAudit />,    label: 'Audit Log',          state: 'active-nav' },
];

const Sidebar = ({ mode }) => {
  const isAuth = mode === 'authenticated';
  const navItems = isAuth ? NAV_AUTH : NAV_LOCKED;

  return (
    <aside className="sidebar">
      <div className="sb-brand">
        <div className="sb-mark">
          <LogoMark />
          <div className="sb-name">MiniFin</div>
        </div>
        <div className="sb-sub">Backoffice</div>
      </div>
      <nav className="sb-nav">
        <div className="nav-sec">Workflow</div>
        {navItems.map((item, i) => {
          const cls = item.state === 'active-nav' ? 'active-nav'
                    : item.state === 'limited'    ? 'limited'
                    : 'locked';
          return (
            <div key={i} className={`nav-item ${cls}`}
              title={!isAuth ? 'Locked — authenticate first' : item.state === 'locked' ? 'senior_compliance required' : ''}>
              <span style={{ width: 14, height: 14, display: 'flex', alignItems: 'center', flexShrink: 0 }}>{item.ico}</span>
              <span>{item.label}</span>
              {item.tag === 'ro'   && <span className="nav-badge-ro">RO</span>}
              {item.tag === 'lock' && <span className="nav-lock"><IcoLockSm /></span>}
              {!isAuth             && <span className="nav-lock"><IcoLockSm /></span>}
            </div>
          );
        })}
        <div className="sb-div" />
        <div className="nav-item current">
          <span style={{ width: 14, height: 14, display: 'flex', alignItems: 'center', flexShrink: 0 }}><IcoAuth /></span>
          <span>Authentication</span>
          <span className="nav-id">BOF-UI-01</span>
        </div>
      </nav>
      <div className="sb-footer">
        <div className="env-chip">
          <div className="env-dot" />
          <span>Local Sandbox</span>
        </div>
        <div className="env-host">backoffice.miniefin.local</div>
      </div>
    </aside>
  );
};

/* ── APP ── */
const MODES = [
  { id: 'ready',         label: 'Ready to login' },
  { id: 'redirecting',   label: 'Redirecting' },
  { id: 'authenticated', label: 'Authenticated' },
  { id: 'denied',        label: 'Access denied',     err: true },
  { id: 'expired',       label: 'Session expired',   err: true },
  { id: 'missing',       label: 'Missing role claim', err: true },
];

const MODE_LABELS = {
  ready:         'Ready to Login',
  redirecting:   'Redirecting to Keycloak',
  authenticated: 'Authenticated',
  denied:        'Access Denied',
  expired:       'Session Expired',
  missing:       'Missing Role Claim',
};

function App() {
  const [mode, setMode] = useState('ready');
  const [showPolicy, setShowPolicy] = useState(false);

  const goRedirect = () => setMode('redirecting');
  const goAuth     = () => setMode('authenticated');

  const renderPanel = () => {
    switch (mode) {
      case 'ready':         return <ReadyPanel onLogin={goRedirect} showPolicy={showPolicy} setShowPolicy={setShowPolicy} />;
      case 'redirecting':   return <RedirectingPanel onAuthenticated={goAuth} />;
      case 'authenticated': return <AuthenticatedPanel />;
      case 'denied':        return <DeniedPanel />;
      case 'expired':       return <ExpiredPanel onLogin={goRedirect} />;
      case 'missing':       return <MissingRolePanel />;
      default:              return null;
    }
  };

  return (
    <>
      <Sidebar mode={mode} />
      <div className="main-wrap">
        <div className="page-hdr">
          <div className="page-bc">
            <span>Backoffice</span>
            <span className="sep">/</span>
            <strong>Authentication</strong>
            <span className="sep">·</span>
            <span className="mode">{MODE_LABELS[mode]}</span>
          </div>
          <div className="page-meta">
            <span className="screen-id">BOF-UI-01</span>
            <span className="env-badge">
              <span className="env-badge-dot" />
              Local Sandbox
            </span>
          </div>
        </div>

        <div className="main-body">
          <div className="mode-tabs">
            {MODES.map(m => (
              <div key={m.id}
                className={`mode-tab${m.err ? ' err-tab' : ''}${mode === m.id ? ' active' : ''}`}
                onClick={() => { setMode(m.id); setShowPolicy(false); }}>
                {m.label}
              </div>
            ))}
          </div>
          {renderPanel()}
        </div>
      </div>
      <AuditRail mode={mode} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
