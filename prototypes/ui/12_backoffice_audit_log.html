<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniFin — Audit Log — BOF-UI-09</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eceae5; --surface: #ffffff; --surf2: #f7f6f3; --hover: #f0efe9;
      --sb: #0e0e12; --sb-bdr: #1e1e22; --sb-muted: #545460; --sb-active: #1e1e28;
      --bdr: #dddad2; --bdr-mid: #c5c2ba; --bdr-focus: #1c1c1f;
      --t1: #1c1c1f; --t2: #575763; --t3: #9898a6; --t4: #d0d0da;
      --g: #166534; --g-bg: #f0fdf4; --g-bd: #bbf7d0;
      --am: #854d0e; --am-bg: #fffbeb; --am-bd: #fde68a;
      --rd: #9b1c1c; --rd-bg: #fef2f2; --rd-bd: #fecaca;
      --pu: #5b21b6; --pu-bg: #f5f3ff; --pu-bd: #ddd6fe;
      --bl: #1e40af; --bl-bg: #eff6ff; --bl-bd: #bfdbfe;
      --or: #9a3412; --or-bg: #fff7ed; --or-bd: #fed7aa;
      --frz: #86198f; --frz-bg: #fdf2f8; --frz-bd: #f0abfc;
      --f-ui: 'IBM Plex Sans', sans-serif; --f-mono: 'IBM Plex Mono', monospace;
      --w-sb: 210px; --w-au: 252px; --r: 4px;
    }
    html, body, #root { height: 100%; font-family: var(--f-ui); font-size: 13px; background: var(--bg); color: var(--t1); }
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb); border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-product { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
    .sb-surface { font-size: 10px; font-weight: 500; color: var(--sb-muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }
    .sb-env { margin: 8px 14px; padding: 3px 8px; background: #1e3a5f; border: 1px solid #2d4f7a; border-radius: var(--r); font-size: 9px; font-weight: 600; color: #7cb9f4; text-transform: uppercase; letter-spacing: .6px; text-align: center; }
    .sb-sec { font-size: 9px; font-weight: 600; color: var(--sb-muted); text-transform: uppercase; letter-spacing: .6px; padding: 10px 16px 4px; }
    .sb-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
    .sb-item { display: flex; align-items: center; gap: 8px; padding: 7px 16px; color: #9898a6; font-size: 12.5px; cursor: pointer; transition: background .12s, color .12s; position: relative; }
    .sb-item:hover { background: rgba(255,255,255,.04); color: #ccc; }
    .sb-item.active { background: var(--sb-active); color: #fff; }
    .sb-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #7cb9f4; }
    .sb-icon { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
    .sb-bdg { margin-left: auto; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 10px; }
    .sb-bdg.alrt { background: #4a1a1a; color: #f87171; }
    .sb-bdg.cnt  { background: #1a2e1a; color: #86efac; }
    .sb-bdg.ro   { background: #2d3748; color: #90cdf4; }
    .sb-user { padding: 10px 16px; border-top: 1px solid var(--sb-bdr); }
    .sb-user-name { font-size: 12px; font-weight: 500; color: #e2e8f0; }
    .sb-user-role { font-size: 10px; color: var(--sb-muted); margin-top: 1px; }
    .sb-user-session { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
    .sess-dot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    .sess-txt { font-size: 9px; color: #3d6b3d; font-family: var(--f-mono); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 0 20px; height: 44px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .topbar-screen { font-size: 10px; font-weight: 600; color: var(--t3); font-family: var(--f-mono); }
    .topbar-host { font-size: 11px; color: var(--t2); font-family: var(--f-mono); }
    .topbar-sep { color: var(--t4); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
    .badge.green   { color: var(--g);   background: var(--g-bg);   border-color: var(--g-bd); }
    .badge.amber   { color: var(--am);  background: var(--am-bg);  border-color: var(--am-bd); }
    .badge.red     { color: var(--rd);  background: var(--rd-bg);  border-color: var(--rd-bd); }
    .badge.purple  { color: var(--pu);  background: var(--pu-bg);  border-color: var(--pu-bd); }
    .badge.blue    { color: var(--bl);  background: var(--bl-bg);  border-color: var(--bl-bd); }
    .badge.orange  { color: var(--or);  background: var(--or-bg);  border-color: var(--or-bd); }
    .badge.freeze  { color: var(--frz); background: var(--frz-bg); border-color: var(--frz-bd); }
    .badge.neutral { color: var(--t2);  background: var(--surf2);  border-color: var(--bdr); }

    /* ── Page header ── */
    .page-hdr { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 14px 20px 0; flex-shrink: 0; }
    .page-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .page-title { font-size: 17px; font-weight: 700; color: var(--t1); letter-spacing: -.3px; }
    .page-sub { font-size: 12px; color: var(--t3); }
    .stats-strip { display: flex; border-top: 1px solid var(--bdr); margin: 0 -20px; overflow-x: auto; }
    .stat-cell { padding: 8px 14px; border-right: 1px solid var(--bdr); display: flex; flex-direction: column; gap: 2px; cursor: pointer; flex-shrink: 0; }
    .stat-cell:last-child { border-right: none; }
    .stat-val { font-size: 18px; font-weight: 700; font-family: var(--f-mono); }
    .stat-val.rd { color: var(--rd); }
    .stat-val.am { color: var(--am); }
    .stat-val.bl { color: var(--bl); }
    .stat-val.pu { color: var(--frz); }
    .stat-val.or { color: var(--or); }
    .stat-lbl { font-size: 10px; color: var(--t3); font-weight: 500; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }

    /* ── Action bar ── */
    .action-bar { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 8px 20px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: var(--r); font-size: 12px; font-weight: 500; font-family: var(--f-ui); border: 1px solid; cursor: pointer; transition: all .12s; white-space: nowrap; }
    .btn-primary { background: var(--t1); color: #fff; border-color: var(--t1); }
    .btn-primary:hover { background: #2d2d31; }
    .btn-default { background: var(--surface); color: var(--t1); border-color: var(--bdr-mid); }
    .btn-default:hover { background: var(--hover); }
    .btn-warn    { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .btn-green   { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .btn-green:hover { background: #dcfce7; }
    .btn-purple  { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }
    .btn-disabled { background: var(--surf2) !important; color: var(--t4) !important; border-color: var(--bdr) !important; cursor: not-allowed !important; }
    .btn-sep { width: 1px; height: 20px; background: var(--bdr); margin: 0 2px; flex-shrink: 0; }
    .btn-copied { background: var(--g-bg) !important; color: var(--g) !important; border-color: var(--g-bd) !important; }

    /* ── Filter bar ── */
    .filter-bar { background: var(--surf2); border-bottom: 1px solid var(--bdr); padding: 7px 20px; display: flex; align-items: center; gap: 7px; flex-shrink: 0; flex-wrap: wrap; }
    .filter-lbl { font-size: 11px; color: var(--t3); font-weight: 500; flex-shrink: 0; }
    .filter-select { font-size: 11.5px; font-family: var(--f-ui); padding: 3px 7px; border: 1px solid var(--bdr-mid); border-radius: var(--r); background: var(--surface); color: var(--t1); cursor: pointer; }
    .filter-search { max-width: 200px; font-size: 11.5px; font-family: var(--f-ui); padding: 3px 8px; border: 1px solid var(--bdr-mid); border-radius: var(--r); background: var(--surface); color: var(--t1); }
    .filter-chip { display: inline-flex; align-items: center; padding: 3px 9px; border: 1px solid var(--bdr-mid); border-radius: 10px; font-size: 11px; font-weight: 500; background: var(--surface); color: var(--t2); cursor: pointer; transition: all .12s; white-space: nowrap; }
    .filter-chip.active { background: var(--t1); color: #fff; border-color: var(--t1); }
    .filter-chip.warn-active { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .filter-count { margin-left: auto; font-size: 10px; color: var(--t3); font-family: var(--f-mono); flex-shrink: 0; }

    /* ── Content area ── */
    .content-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    .table-area { flex: 0 0 54%; overflow-y: auto; border-right: 1px solid var(--bdr); overflow-x: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    thead th { background: var(--surf2); padding: 5px 7px; text-align: left; font-size: 9.5px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--bdr); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
    thead th:first-child { padding-left: 10px; }
    tbody tr { border-bottom: 1px solid var(--bdr); cursor: pointer; transition: background .1s; }
    tbody tr:hover { background: var(--hover); }
    tbody tr.sel { background: #eef3ff; }
    tbody tr.corr-hi { background: #f5f3ff; }
    tbody td { padding: 5px 7px; vertical-align: middle; }
    tbody td:first-child { padding-left: 10px; }
    .mono { font-family: var(--f-mono); }

    /* State chips */
    .rchip { display: inline-flex; font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 3px; white-space: nowrap; font-family: var(--f-mono); border: 1px solid; }
    .rchip.blue   { background: var(--bl-bg);  color: var(--bl);  border-color: var(--bl-bd); }
    .rchip.amber  { background: var(--am-bg);  color: var(--am);  border-color: var(--am-bd); }
    .rchip.orange { background: var(--or-bg);  color: var(--or);  border-color: var(--or-bd); }
    .rchip.red    { background: var(--rd-bg);  color: var(--rd);  border-color: var(--rd-bd); }
    .rchip.green  { background: var(--g-bg);   color: var(--g);   border-color: var(--g-bd); }
    .rchip.purple { background: var(--pu-bg);  color: var(--pu);  border-color: var(--pu-bd); }
    .rchip.neutral{ background: var(--surf2);  color: var(--t2);  border-color: var(--bdr); }

    /* Severity dots */
    .sev-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; font-family: var(--f-mono); }
    .sev-dot::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .sev-dot.INFO::before     { background: var(--t4); }
    .sev-dot.WARN::before     { background: var(--am); }
    .sev-dot.HIGH::before     { background: var(--or); }
    .sev-dot.CRITICAL::before { background: var(--rd); }
    .sev-dot.INFO     { color: var(--t3); }
    .sev-dot.WARN     { color: var(--am); }
    .sev-dot.HIGH     { color: var(--or); }
    .sev-dot.CRITICAL { color: var(--rd); }

    /* ── Detail panel ── */
    .detail-panel { flex: 1; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
    .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--t3); gap: 8px; }

    .detail-hdr { padding: 10px 14px; border-bottom: 1px solid var(--bdr); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--surf2); flex-shrink: 0; }
    .detail-id   { font-family: var(--f-mono); font-weight: 600; font-size: 10px; color: var(--t3); margin-bottom: 2px; }
    .detail-evtype { font-size: 13px; font-weight: 700; color: var(--t1); letter-spacing: -.2px; font-family: var(--f-mono); }
    .detail-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }

    .tab-nav { display: flex; border-bottom: 1px solid var(--bdr); background: var(--surface); flex-shrink: 0; }
    .tab-item { padding: 8px 13px; font-size: 11.5px; font-weight: 500; color: var(--t3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .12s; white-space: nowrap; }
    .tab-item:hover { color: var(--t1); }
    .tab-item.active { color: var(--t1); border-bottom-color: var(--t1); font-weight: 600; }

    .tab-content { flex: 1; overflow-y: auto; }
    .detail-sec { padding: 10px 14px; border-bottom: 1px solid var(--bdr); }
    .detail-sec:last-child { border-bottom: none; }
    .detail-sec-title { font-size: 10px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }

    .kv { width: 100%; border-collapse: collapse; }
    .kv tr { border-bottom: 1px solid var(--bdr); }
    .kv tr:last-child { border-bottom: none; }
    .kv td { padding: 4px 0; vertical-align: top; }
    .kv td:first-child { font-size: 11px; color: var(--t3); font-weight: 500; width: 44%; padding-right: 8px; }
    .kv td:last-child  { font-size: 11.5px; color: var(--t1); font-weight: 500; }

    /* Metadata viewer */
    .meta-box { background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r); overflow: hidden; font-family: var(--f-mono); }
    .meta-row { display: flex; align-items: flex-start; gap: 0; padding: 4px 10px; border-bottom: 1px solid var(--bdr); font-size: 11px; }
    .meta-row:last-child { border-bottom: none; }
    .meta-key { color: var(--bl); font-weight: 600; min-width: 44%; flex-shrink: 0; }
    .meta-val { color: var(--t1); word-break: break-all; }
    .meta-val.masked { color: var(--rd); font-style: italic; }
    .meta-val.sensitive-val { color: var(--or); }
    .meta-section-hdr { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; background: var(--hover); border-bottom: 1px solid var(--bdr); cursor: pointer; font-size: 10px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .5px; }
    .meta-section-hdr:hover { background: var(--bdr); }
    .senior-blocked-meta { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--pu-bg); border: 1px solid var(--pu-bd); border-radius: var(--r); margin-top: 8px; font-size: 11px; color: var(--pu); }

    /* Correlation chain */
    .corr-chain { display: flex; flex-direction: column; }
    .corr-item { display: flex; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--bdr); align-items: flex-start; position: relative; }
    .corr-item:last-child { border-bottom: none; }
    .corr-item.current { background: #eef3ff; border-left: 3px solid var(--bl); }
    .corr-connector { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; margin-top: 2px; }
    .corr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .corr-dot.success  { background: var(--g); }
    .corr-dot.warn     { background: var(--am); }
    .corr-dot.denied   { background: var(--rd); }
    .corr-dot.current  { background: var(--bl); box-shadow: 0 0 0 2px var(--bl-bd); }
    .corr-line { width: 1px; flex: 1; background: var(--bdr); min-height: 16px; margin: 2px 0; }
    .corr-info { flex: 1; }
    .corr-ev { font-size: 11px; font-weight: 600; font-family: var(--f-mono); color: var(--t1); }
    .corr-meta { font-size: 10px; color: var(--t3); margin-top: 2px; }
    .corr-svc { font-size: 9px; font-family: var(--f-mono); color: var(--t3); }
    .corr-desc { font-size: 10.5px; color: var(--t2); margin-top: 2px; }

    /* Append-only panel */
    .immutable-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 10px; font-size: 10px; font-weight: 700; font-family: var(--f-mono); background: var(--g-bg); color: var(--g); border: 1px solid var(--g-bd); }
    .denied-badge    { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 10px; font-size: 10px; font-weight: 700; font-family: var(--f-mono); background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }
    .append-box { background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r); overflow: hidden; }
    .append-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--bdr); font-size: 11px; }
    .append-row:last-child { border-bottom: none; }
    .append-ico { flex-shrink: 0; font-size: 12px; margin-top: 1px; }
    .append-label { font-weight: 600; color: var(--t1); }
    .append-desc { color: var(--t3); font-size: 10.5px; margin-top: 1px; }
    .blocked-event-box { background: var(--rd-bg); border: 1px solid var(--rd-bd); border-radius: var(--r); padding: 10px 12px; }
    .blocked-event-title { font-size: 11px; font-weight: 700; color: var(--rd); margin-bottom: 6px; font-family: var(--f-mono); }

    /* Read-audit section */
    .read-audit-explain { background: var(--am-bg); border: 1px solid var(--am-bd); border-radius: var(--r); padding: 10px 12px; }
    .ra-title { font-size: 11px; font-weight: 700; color: var(--am); margin-bottom: 6px; }
    .ra-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--am); padding: 2px 0; }
    .ra-row::before { content: '→'; color: var(--am); font-size: 10px; flex-shrink: 0; }

    /* RBAC blocked */
    .senior-blk-box { background: var(--pu-bg); border: 1px solid var(--pu-bd); border-radius: var(--r); padding: 9px 11px; }
    .senior-blk-title { font-size: 11px; font-weight: 700; color: var(--pu); margin-bottom: 6px; }
    .senior-blk-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--pu); padding: 3px 0; border-bottom: 1px solid var(--pu-bd); }
    .senior-blk-row:last-child { border-bottom: none; }
    .senior-blk-row::before { content: '🔒'; font-size: 10px; }

    .alert-box { padding: 7px 10px; border-radius: var(--r); font-size: 11px; line-height: 1.5; border: 1px solid; margin-bottom: 6px; }
    .alert-box.amber  { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .alert-box.red    { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .alert-box.green  { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .alert-box.purple { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }

    /* ── Audit rail ── */
    .audit-rail { width: var(--w-au); flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .au-hdr { padding: 10px 14px 8px; border-bottom: 1px solid var(--bdr); background: var(--surf2); flex-shrink: 0; }
    .au-title { font-size: 10px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: .6px; }
    .au-sub { font-size: 10px; color: var(--t3); margin-top: 2px; }
    .au-body { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 12px; }
    .au-sec-title { font-size: 9px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px; }
    .au-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; margin-bottom: 3px; }
    .au-k { font-size: 10px; color: var(--t3); }
    .au-v { font-size: 10px; font-weight: 500; color: var(--t1); text-align: right; font-family: var(--f-mono); }
    .au-v.ok { color: var(--g); }
    .au-v.warn { color: var(--am); }
    .au-v.danger { color: var(--rd); }
    .au-ev-log { background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r); overflow: hidden; }
    .au-ev { padding: 5px 8px; border-bottom: 1px solid var(--bdr); }

                          <div className="ra-row">KYC document preview → read_audit.kyc_document_previewed</div>
                          <div className="ra-row">Frozen account review → read_audit.frozen_account_reviewed</div>
                          <div className="ra-row">Audit log viewer opened → read_audit.audit_log_search_performed</div>
                          <div style={{marginTop:6,fontSize:10.5,color:'var(--am)'}}>
                            If the server crashes after writing the read-audit event but before returning data, the audit record still exists. Absence of a read-audit record means data was never returned.
                          </div>
                        </div>
                      </div>
                    </>}

                  </div>{/* end tab-content */}
                </>
            }
          </div>{/* end detail-panel */}

          {/* ── Audit rail ── */}
          <div className="audit-rail">
            <div className="au-hdr">
              <div className="au-title">Security &amp; Audit</div>
              <div className="au-sub">BOF-UI-09 · compliance_officer</div>
            </div>
            <div className="au-body">

              <div>
                <div className="au-sec-title">Session identity</div>
                <div className="au-row"><span className="au-k">User</span><span className="au-v">{USER.name}</span></div>
                <div className="au-row"><span className="au-k">OIDC role</span><span className="au-v ok">compliance_officer</span></div>
                <div className="au-row"><span className="au-k">Auth source</span><span className="au-v">Keycloak OIDC</span></div>
                <div className="au-row"><span className="au-k">Token status</span><span className="au-v ok">active</span></div>
                <div className="au-row"><span className="au-k">Platform role</span><span className="au-v ok">compliance_officer</span></div>
              </div>

              <div>
                <div className="au-sec-title">Access invariants</div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico ok">✓</span>
                  <span className="au-rbac-txt"><strong>Audit log viewer</strong> access is itself read-audited</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico ok">✓</span>
                  <span className="au-rbac-txt"><strong>Export actions</strong> are logged to audit trail</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico ok">✓</span>
                  <span className="au-rbac-txt"><strong>Audit table</strong> is append-only — no mutations possible</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>Raw metadata</strong> — senior_compliance only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>Full stream export</strong> — senior_compliance only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>Retention override</strong> — senior_compliance only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>End-user / merchant</strong> cannot access this screen</span>
                </div>
              </div>

              <div>
                <div className="au-sec-title">Session event log</div>
                <div className="au-ev-log">
                  {sessionLog.slice(0,9).map((e, i) => (
                    <div key={i} className="au-ev">
                      <div className={`au-ev-code${e.isNew?' new':''}`}>{e.ev}</div>
                      <div className="au-ev-meta">{e.meta}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="au-sec-title">Audit event types (this screen)</div>
                <div style={{display:'flex',flexDirection:'column',gap:0}}>
                  {[
                    'audit_log.viewer_opened',
                    'read_audit.audit_log_search_performed',
                    'audit_log.event_opened',
                    'audit_log.correlation_chain_viewed',
                    'audit_log.export_denied',
                    'audit_log.raw_metadata_denied',
                    'audit_log.request_id_copied',
                  ].map(ev => (
                    <div key={ev} className="au-inv">{ev}</div>
                  ))}
                </div>
              </div>

            </div>
          </div>

        </div>{/* end content-area */}
      </div>{/* end main */}

      {permMsg && (
        <div className="perm-popover">🔒 {permMsg}</div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
