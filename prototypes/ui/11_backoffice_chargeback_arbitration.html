<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniFin — Chargeback Arbitration — BOF-UI-08</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eceae5; --surface: #ffffff; --surf2: #f7f6f3; --hover: #f0efe9;
      --sb: #0e0e12; --sb-bdr: #1e1e22; --sb-muted: #545460; --sb-active: #1e1e28;
      --bdr: #dddad2; --bdr-mid: #c5c2ba; --bdr-focus: #1c1c1f;
      --t1: #1c1c1f; --t2: #575763; --t3: #9898a6; --t4: #d0d0da;
      --g: #166534; --g-bg: #f0fdf4; --g-bd: #bbf7d0;
      --am: #854d0e; --am-bg: #fffbeb; --am-bd: #fde68a;
      --rd: #9b1c1c; --rd-bg: #fef2f2; --rd-bd: #fecaca;
      --pu: #5b21b6; --pu-bg: #f5f3ff; --pu-bd: #ddd6fe;
      --bl: #1e40af; --bl-bg: #eff6ff; --bl-bd: #bfdbfe;
      --or: #9a3412; --or-bg: #fff7ed; --or-bd: #fed7aa;
      --frz: #86198f; --frz-bg: #fdf2f8; --frz-bd: #f0abfc;
      --f-ui: 'IBM Plex Sans', sans-serif; --f-mono: 'IBM Plex Mono', monospace;
      --w-sb: 210px; --w-au: 252px; --r: 4px;
    }
    html, body, #root { height: 100%; font-family: var(--f-ui); font-size: 13px; background: var(--bg); color: var(--t1); }
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb); border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-product { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
    .sb-surface { font-size: 10px; font-weight: 500; color: var(--sb-muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }
    .sb-env { margin: 8px 14px; padding: 3px 8px; background: #1e3a5f; border: 1px solid #2d4f7a; border-radius: var(--r); font-size: 9px; font-weight: 600; color: #7cb9f4; text-transform: uppercase; letter-spacing: .6px; text-align: center; }
    .sb-sec { font-size: 9px; font-weight: 600; color: var(--sb-muted); text-transform: uppercase; letter-spacing: .6px; padding: 10px 16px 4px; }
    .sb-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
    .sb-item { display: flex; align-items: center; gap: 8px; padding: 7px 16px; color: #9898a6; font-size: 12.5px; cursor: pointer; transition: background .12s, color .12s; position: relative; }
    .sb-item:hover { background: rgba(255,255,255,.04); color: #ccc; }
    .sb-item.active { background: var(--sb-active); color: #fff; }
    .sb-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #7cb9f4; }
    .sb-icon { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
    .sb-bdg { margin-left: auto; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 10px; }
    .sb-bdg.alrt { background: #4a1a1a; color: #f87171; }
    .sb-bdg.cnt  { background: #1a2e1a; color: #86efac; }
    .sb-bdg.ro   { background: #2d3748; color: #90cdf4; }
    .sb-user { padding: 10px 16px; border-top: 1px solid var(--sb-bdr); }
    .sb-user-name { font-size: 12px; font-weight: 500; color: #e2e8f0; }
    .sb-user-role { font-size: 10px; color: var(--sb-muted); margin-top: 1px; }
    .sb-user-session { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
    .sess-dot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    .sess-txt { font-size: 9px; color: #3d6b3d; font-family: var(--f-mono); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 0 20px; height: 44px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .topbar-screen { font-size: 10px; font-weight: 600; color: var(--t3); font-family: var(--f-mono); }
    .topbar-host { font-size: 11px; color: var(--t2); font-family: var(--f-mono); }
    .topbar-sep { color: var(--t4); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
    .badge.green   { color: var(--g);   background: var(--g-bg);   border-color: var(--g-bd); }
    .badge.amber   { color: var(--am);  background: var(--am-bg);  border-color: var(--am-bd); }
    .badge.red     { color: var(--rd);  background: var(--rd-bg);  border-color: var(--rd-bd); }
    .badge.purple  { color: var(--pu);  background: var(--pu-bg);  border-color: var(--pu-bd); }
    .badge.blue    { color: var(--bl);  background: var(--bl-bg);  border-color: var(--bl-bd); }
    .badge.orange  { color: var(--or);  background: var(--or-bg);  border-color: var(--or-bd); }
    .badge.freeze  { color: var(--frz); background: var(--frz-bg); border-color: var(--frz-bd); }
    .badge.neutral { color: var(--t2);  background: var(--surf2);  border-color: var(--bdr); }

    /* ── Page header ── */
    .page-hdr { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 14px 20px 0; flex-shrink: 0; }
    .page-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .page-title { font-size: 17px; font-weight: 700; color: var(--t1); letter-spacing: -.3px; }
    .page-sub { font-size: 12px; color: var(--t3); }
    .stats-strip { display: flex; border-top: 1px solid var(--bdr); margin: 0 -20px; }
    .stat-cell { padding: 8px 14px; border-right: 1px solid var(--bdr); display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
    .stat-cell:last-child { border-right: none; }
    .stat-val { font-size: 18px; font-weight: 700; font-family: var(--f-mono); }
    .stat-val.rd { color: var(--rd); }
    .stat-val.am { color: var(--am); }
    .stat-val.bl { color: var(--bl); }
    .stat-val.pu { color: var(--frz); }
    .stat-val.or { color: var(--or); }
    .stat-lbl { font-size: 10px; color: var(--t3); font-weight: 500; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }

    /* ── Action bar ── */
    .action-bar { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 8px 20px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: var(--r); font-size: 12px; font-weight: 500; font-family: var(--f-ui); border: 1px solid; cursor: pointer; transition: all .12s; white-space: nowrap; }
    .btn-primary { background: var(--t1); color: #fff; border-color: var(--t1); }
    .btn-primary:hover { background: #2d2d31; }
    .btn-default { background: var(--surface); color: var(--t1); border-color: var(--bdr-mid); }
    .btn-default:hover { background: var(--hover); }
    .btn-danger  { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .btn-danger:hover { background: #fee2e2; }
    .btn-warn    { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .btn-warn:hover { background: #fef3c7; }
    .btn-green   { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .btn-green:hover { background: #dcfce7; }
    .btn-purple  { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }
    .btn-disabled { background: var(--surf2) !important; color: var(--t4) !important; border-color: var(--bdr) !important; cursor: not-allowed !important; }
    .btn-sep { width: 1px; height: 20px; background: var(--bdr); margin: 0 2px; flex-shrink: 0; }

    /* ── Filter bar ── */
    .filter-bar { background: var(--surf2); border-bottom: 1px solid var(--bdr); padding: 7px 20px; display: flex; align-items: center; gap: 7px; flex-shrink: 0; flex-wrap: wrap; }
    .filter-lbl { font-size: 11px; color: var(--t3); font-weight: 500; flex-shrink: 0; }
    .filter-select { font-size: 11.5px; font-family: var(--f-ui); padding: 3px 7px; border: 1px solid var(--bdr-mid); border-radius: var(--r); background: var(--surface); color: var(--t1); cursor: pointer; }
    .filter-search { max-width: 180px; font-size: 11.5px; font-family: var(--f-ui); padding: 3px 8px; border: 1px solid var(--bdr-mid); border-radius: var(--r); background: var(--surface); color: var(--t1); }
    .filter-chip { display: inline-flex; align-items: center; padding: 3px 9px; border: 1px solid var(--bdr-mid); border-radius: 10px; font-size: 11px; font-weight: 500; background: var(--surface); color: var(--t2); cursor: pointer; transition: all .12s; }
    .filter-chip.active { background: var(--t1); color: #fff; border-color: var(--t1); }
    .filter-count { margin-left: auto; font-size: 10px; color: var(--t3); font-family: var(--f-mono); flex-shrink: 0; }

    /* ── State flow strip ── */
    .state-strip { background: var(--surface); border-bottom: 1px solid var(--bdr); padding: 7px 20px; flex-shrink: 0; }
    .state-strip-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .state-strip-title { font-size: 10px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .6px; }
    .sf-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .sf-row:last-child { margin-bottom: 0; }
    .sf-row-lbl { font-size: 9px; font-weight: 600; color: var(--t4); text-transform: uppercase; letter-spacing: .5px; min-width: 36px; flex-shrink: 0; }
    .sf-flow { display: flex; align-items: center; gap: 0; overflow-x: auto; }
    .sf-node { display: flex; align-items: center; flex-shrink: 0; }
    .sf-s { padding: 2px 7px; border-radius: 10px; font-size: 9px; font-weight: 600; font-family: var(--f-mono); background: var(--surf2); color: var(--t3); border: 1px solid var(--bdr); white-space: nowrap; }
    .sf-s.cur  { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .sf-s.done { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .sf-s.bad  { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .sf-s.side { background: var(--or-bg); color: var(--or); border-color: var(--or-bd); }
    .sf-s.esc  { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }
    .sf-arr { color: var(--t4); font-size: 11px; padding: 0 3px; }

    /* ── Content area ── */
    .content-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    .table-area { flex: 0 0 52%; overflow-y: auto; border-right: 1px solid var(--bdr); overflow-x: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    thead th { background: var(--surf2); padding: 5px 7px; text-align: left; font-size: 9.5px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--bdr); white-space: nowrap; position: sticky; top: 0; z-index: 2; }
    thead th:first-child { padding-left: 10px; }
    tbody tr { border-bottom: 1px solid var(--bdr); cursor: pointer; transition: background .1s; }
    tbody tr:hover { background: var(--hover); }
    tbody tr.sel { background: #eef3ff; }
    tbody td { padding: 6px 7px; vertical-align: middle; }
    tbody td:first-child { padding-left: 10px; }
    .mono { font-family: var(--f-mono); }

    /* Priority indicator */
    .pri-cell { display: flex; align-items: center; gap: 4px; }
    .pri-bar { width: 3px; height: 22px; border-radius: 2px; flex-shrink: 0; }
    .pri-bar.P1 { background: var(--rd); }
    .pri-bar.P2 { background: var(--or); }
    .pri-bar.P3 { background: var(--am); }
    .pri-bar.P4 { background: var(--g); }
    .pri-lbl { font-size: 10px; font-weight: 700; font-family: var(--f-mono); }
    .pri-lbl.P1 { color: var(--rd); }
    .pri-lbl.P2 { color: var(--or); }
    .pri-lbl.P3 { color: var(--am); }
    .pri-lbl.P4 { color: var(--g); }

    /* State chips */
    .rchip { display: inline-flex; font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 3px; white-space: nowrap; font-family: var(--f-mono); border: 1px solid; }
    .rchip.blue   { background: var(--bl-bg);  color: var(--bl);  border-color: var(--bl-bd); }
    .rchip.amber  { background: var(--am-bg);  color: var(--am);  border-color: var(--am-bd); }
    .rchip.orange { background: var(--or-bg);  color: var(--or);  border-color: var(--or-bd); }
    .rchip.red    { background: var(--rd-bg);  color: var(--rd);  border-color: var(--rd-bd); }
    .rchip.green  { background: var(--g-bg);   color: var(--g);   border-color: var(--g-bd); }
    .rchip.purple { background: var(--pu-bg);  color: var(--pu);  border-color: var(--pu-bd); }
    .rchip.neutral{ background: var(--surf2);  color: var(--t2);  border-color: var(--bdr); }

    /* Deadline urgency */
    .dl-ok   { color: var(--t3); font-family: var(--f-mono); font-size: 10px; font-weight: 600; }
    .dl-warn { color: var(--am); font-family: var(--f-mono); font-size: 10px; font-weight: 600; }
    .dl-exp  { color: var(--rd); font-family: var(--f-mono); font-size: 10px; font-weight: 600; text-decoration: line-through; }

    /* Role required */
    .role-ok  { font-size: 9px; font-weight: 600; font-family: var(--f-mono); color: var(--g); }
    .role-blk { font-size: 9px; font-weight: 600; font-family: var(--f-mono); color: var(--pu); }

    /* ── Detail panel ── */
    .detail-panel { flex: 1; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
    .detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--t3); gap: 8px; }

    .detail-hdr { padding: 10px 14px; border-bottom: 1px solid var(--bdr); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--surf2); flex-shrink: 0; }
    .detail-id   { font-family: var(--f-mono); font-weight: 600; font-size: 10px; color: var(--t3); margin-bottom: 2px; }
    .detail-name { font-size: 14px; font-weight: 700; color: var(--t1); letter-spacing: -.2px; }
    .detail-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }

    .tab-nav { display: flex; border-bottom: 1px solid var(--bdr); background: var(--surface); flex-shrink: 0; }
    .tab-item { padding: 8px 13px; font-size: 11.5px; font-weight: 500; color: var(--t3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .12s; white-space: nowrap; }
    .tab-item:hover { color: var(--t1); }
    .tab-item.active { color: var(--t1); border-bottom-color: var(--t1); font-weight: 600; }

    .tab-content { flex: 1; overflow-y: auto; }
    .detail-sec { padding: 10px 14px; border-bottom: 1px solid var(--bdr); }
    .detail-sec-title { font-size: 10px; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }

    .kv { width: 100%; border-collapse: collapse; }
    .kv tr { border-bottom: 1px solid var(--bdr); }
    .kv tr:last-child { border-bottom: none; }
    .kv td { padding: 4px 0; vertical-align: top; }
    .kv td:first-child { font-size: 11px; color: var(--t3); font-weight: 500; width: 44%; padding-right: 8px; }
    .kv td:last-child  { font-size: 11.5px; color: var(--t1); font-weight: 500; }

    /* Evidence table */
    .ev-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .ev-table thead th { background: var(--surf2); padding: 5px 8px; font-size: 9px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--bdr); white-space: nowrap; }
    .ev-table tbody tr { border-bottom: 1px solid var(--bdr); }
    .ev-table tbody td { padding: 6px 8px; vertical-align: middle; }
    .ev-status.RECEIVED  { color: var(--g);  font-weight: 600; font-family: var(--f-mono); font-size: 10px; }
    .ev-status.REQUESTED { color: var(--bl); font-weight: 600; font-family: var(--f-mono); font-size: 10px; }
    .ev-status.MISSING   { color: var(--t3); font-weight: 600; font-family: var(--f-mono); font-size: 10px; }
    .ev-status.ACCEPTED  { color: var(--g);  font-weight: 700; font-family: var(--f-mono); font-size: 10px; }
    .ev-status.REJECTED  { color: var(--rd); font-weight: 600; font-family: var(--f-mono); font-size: 10px; }
    .ev-status.EXPIRED   { color: var(--rd); font-weight: 600; font-family: var(--f-mono); font-size: 10px; text-decoration: line-through; }
    .ev-sensitive { font-size: 9px; font-weight: 600; font-family: var(--f-mono); color: var(--or); background: var(--or-bg); border: 1px solid var(--or-bd); border-radius: 3px; padding: 1px 4px; }
    .ev-btn { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 3px; border: 1px solid; cursor: pointer; font-family: var(--f-ui); background: var(--surface); color: var(--t2); border-color: var(--bdr-mid); margin-right: 3px; }
    .ev-btn:hover { background: var(--hover); }
    .ev-btn.req { color: var(--bl); border-color: var(--bl-bd); background: var(--bl-bg); }

    .read-audit-banner { display: flex; gap: 8px; align-items: flex-start; background: var(--am-bg); border: 1px solid var(--am-bd); border-radius: var(--r); padding: 8px 10px; margin: 8px 14px; font-size: 11px; color: var(--am); line-height: 1.5; }
    .read-audit-banner button { margin-top: 6px; font-size: 11px; padding: 3px 9px; border-radius: var(--r); border: 1px solid var(--am-bd); background: var(--am-bg); color: var(--am); cursor: pointer; font-family: var(--f-ui); font-weight: 600; margin-right: 5px; }
    .ev-preview-placeholder { margin: 8px 14px; background: var(--surf2); border: 1px dashed var(--bdr-mid); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .ev-preview-placeholder-icon { font-size: 22px; opacity: .4; }
    .ev-preview-placeholder-lbl { font-size: 11px; color: var(--t3); }
    .ev-preview-placeholder-sub { font-size: 10px; color: var(--t4); font-family: var(--f-mono); }

    /* Deadline panel */
    .dl-panel { display: flex; flex-direction: column; gap: 0; }
    .dl-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--bdr); }
    .dl-row:last-child { border-bottom: none; }
    .dl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .dl-dot.ok   { background: var(--g); }
    .dl-dot.warn { background: var(--am); }
    .dl-dot.exp  { background: var(--rd); }
    .dl-info { flex: 1; }
    .dl-label { font-size: 12px; font-weight: 600; color: var(--t1); }
    .dl-date  { font-size: 11px; font-family: var(--f-mono); color: var(--t2); margin-top: 1px; }
    .dl-remain { font-size: 10px; font-weight: 700; font-family: var(--f-mono); }
    .dl-remain.ok   { color: var(--g); }
    .dl-remain.warn { color: var(--am); }
    .dl-remain.exp  { color: var(--rd); }
    .dl-badge { flex-shrink: 0; margin-top: 1px; }
    .auto-loss-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 10px; font-size: 9px; font-weight: 700; font-family: var(--f-mono); background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }

    .sla-box { margin: 8px 14px; background: var(--am-bg); border: 1px solid var(--am-bd); border-radius: var(--r); padding: 8px 10px; font-size: 11px; color: var(--am); line-height: 1.5; }
    .sla-box.red { background: var(--rd-bg); border-color: var(--rd-bd); color: var(--rd); }

    /* Ledger tabs */
    .ledger-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--bdr); }
    .ledger-tab { padding: 6px 13px; font-size: 11px; font-weight: 500; color: var(--t3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .12s; }
    .ledger-tab:hover { color: var(--t1); }
    .ledger-tab.active { font-weight: 600; border-bottom-color: var(--t1); color: var(--t1); }

      const q = search.toLowerCase();
      if (!c.id.toLowerCase().includes(q) &&
          !c.paymentId.toLowerCase().includes(q) &&
          !c.cardholder.toLowerCase().includes(q) &&
          !c.merchant.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  /* Action handlers */
  function handleRequestEvidence() {
    if (!sel) return;
    mutateCase(sel.id, { state: 'NEEDS_MORE_EVIDENCE' });
    pushAudit('warn', 'chargeback.evidence_requested', `Maya Ivanova · ${sel.id} · ${new Date().toLocaleTimeString()}`);
    setActionSuccess({ type: 'info', msg: `Case ${sel.id} moved to NEEDS_MORE_EVIDENCE. Evidence request logged.` });
    setTimeout(() => setActionSuccess(null), 4000);
  }
  function handleAcceptMerchant() {
    if (!sel) return;
    mutateCase(sel.id, { state: 'MERCHANT_ACCEPTED', merchantLiability: 'ACCEPTED' });
    pushAudit('success', 'chargeback.merchant_accepted', `Maya Ivanova · ${sel.id}`);
    setActionSuccess({ type: 'success', msg: `Merchant liability accepted. Case ${sel.id} updated to MERCHANT_ACCEPTED.` });
    setTimeout(() => setActionSuccess(null), 4000);
  }
  function handleDecide(outcome) {
    if (!sel) return;
    if (!rationale.trim()) { showPerm('Decision rationale is required.'); return; }
    if (!evChecked)         { showPerm('Confirm evidence checklist before deciding.'); return; }
    mutateCase(sel.id, { state: outcome });
    const evCode = outcome === 'WON' ? 'chargeback.decision_won' : 'chargeback.decision_lost';
    pushAudit(outcome === 'WON' ? 'success' : 'danger', evCode, `Maya Ivanova · ${sel.id} · ${reason || 'no reason'}`);
    setActionSuccess({ type: outcome === 'WON' ? 'success' : 'warn', msg: `Decision ${outcome} submitted for ${sel.id}. Ledger movement is server-side only.` });
    setActiveDecision(null);
    setRationale(''); setReason(''); setEvChecked(false); setDlChecked(false); setLgChecked(false);
    setTimeout(() => setActionSuccess(null), 5000);
  }
  function handleEscalate() {
    if (!sel) return;
    mutateCase(sel.id, { state: 'ESCALATED' });
    pushAudit('purple', 'chargeback.escalated', `Maya Ivanova · ${sel.id}`);
    setActionSuccess({ type: 'info', msg: `Case ${sel.id} escalated to senior compliance.` });
    setTimeout(() => setActionSuccess(null), 4000);
  }
  function handleAddNote() {
    if (!noteText.trim()) return;
    const note = { ts: '2026-05-17 14:31', actor: USER.name, text: noteText };
    mutateCase(sel.id, { notes: [...(sel.notes||[]), note] });

                            </tr>
                          </thead>
                          <tbody>
                            {(sel.id === 'CHB-9027' ? EVIDENCE_9027 : []).map(ev => (
                              <tr key={ev.id}>
                                <td style={{fontWeight:500,color:'var(--t1)',fontSize:11}}>{ev.category}</td>
                                <td><span className={`ev-status ${ev.status}`}>{ev.status}</span></td>
                                <td style={{fontSize:10,color:'var(--t3)',fontFamily:'var(--f-mono)'}}>{ev.source}</td>
                                <td style={{fontSize:10,color:'var(--t3)',fontFamily:'var(--f-mono)'}}>{ev.uploadedAt}</td>
                                <td>{ev.sensitive && <span className="ev-sensitive">SENSITIVE</span>}</td>
                                <td>
                                  {ev.status === 'RECEIVED' && (
                                    <>
                                      <button
                                        className="ev-btn"
                                        onClick={() => {
                                          if (ev.sensitive && !confirmedPreviews[ev.id]) {
                                            setReadAuditItem(ev.id);
                                          } else {
                                            setReadAuditItem(ev.id);
                                            setConfirmedPreviews(p => ({...p, [ev.id]: confirmedPreviews[ev.id] || !ev.sensitive}));
                                          }
                                        }}
                                      >Preview</button>
                                      <button className="ev-btn">Metadata</button>
                                    </>
                                  )}
                                  {ev.status === 'MISSING' && (
                                    <button className="ev-btn req">Request</button>
                                  )}
                                  {ev.status === 'REQUESTED' && (
                                    <span style={{fontSize:10,color:'var(--bl)'}}>Awaiting…</span>
                                  )}
                                </td>
                              </tr>
                            ))}
                            {sel.id !== 'CHB-9027' && (
                              <tr>
                                <td colSpan={6} style={{textAlign:'center',color:'var(--t3)',fontSize:11,padding:'16px 8px'}}>
                                  Evidence detail available for CHB-9027 in this prototype. Select CHB-9027 to view.
                                </td>
                              </tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </>}

                    {/* ── Deadlines ── */}
                    {detailTab === 'deadlines' && <>
                      {dlStatus(sel.deadline) === 'warn' && (
                        <div className="sla-box" style={{margin:'8px 14px'}}>
                          ⚠️ <strong>Merchant evidence deadline in less than 24h.</strong> Evidence must be submitted by {sel.deadline.replace('T',' ')}. Failure to receive merchant evidence may result in automatic case loss.
                        </div>
                      )}
                      {dlStatus(sel.deadline) === 'exp' && (
                        <div className="sla-box red" style={{margin:'8px 14px'}}>
                          ⛔ <strong>Deadline breached.</strong> Merchant evidence deadline has expired. Override requires senior_compliance. Auto-loss risk is active.
                        </div>
                      )}
                      <div className="dl-panel">
                        {(sel.id === 'CHB-9027' ? DEADLINES_9027 : [
                          { label: 'Merchant evidence deadline', iso: sel.deadline, required: 'Merchant must submit evidence', autoLoss: true },
                          { label: 'Arbitration deadline', iso: sel.deadline.replace(/T.*/,'T') + '23:59', required: 'Decision required', autoLoss: false },
                          { label: 'Network final decision', iso: '2026-05-31T18:00', required: 'Card network ruling', autoLoss: false },
                        ]).map((dl, i) => {
                          const ds = dlStatus(dl.iso);
                          const dr = dlRemain(dl.iso);
                          return (
                            <div key={i} className="dl-row">
                              <div className={`dl-dot ${ds}`} />
                              <div className="dl-info">
                                <div className="dl-label">{dl.label}</div>
                                <div className="dl-date">{dl.iso.replace('T',' ')}</div>
                                <div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>{dl.required}</div>
                              </div>
                              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                                <span className={`dl-remain ${ds}`}>{dr}</span>
                                {dl.autoLoss && ds !== 'ok' && (
                                  <span className="auto-loss-badge">⚡ auto-loss risk</span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      <div className="detail-sec">
                        <div className="detail-sec-title">SLA summary</div>
                        <table className="kv">
                          <tbody>
                            <tr><td>Next required action</td><td style={{fontSize:11}}>
                              {dlStatus(sel.deadline) === 'exp' ? 'Senior override or case close' : 'Await merchant evidence / escalate'}
                            </td></tr>
                            <tr><td>SLA breach state</td><td>
                              <span className={`rchip ${dlStatus(sel.deadline) === 'exp' ? 'red' : dlStatus(sel.deadline) === 'warn' ? 'amber' : 'green'}`}>
                                {dlStatus(sel.deadline) === 'exp' ? 'BREACHED' : dlStatus(sel.deadline) === 'warn' ? 'AT_RISK' : 'ON_TRACK'}
                              </span>
                            </td></tr>
                            <tr><td>Override deadline</td><td><span className="role-blk">🔒 senior_compliance only</span></td></tr>
                          </tbody>
                        </table>
                      </div>
                    </>}

                    {/* ── Ledger Impact ── */}
                    {detailTab === 'ledger' && <>
                      <div style={{padding:'8px 14px 0',fontSize:11,color:'var(--t3)'}}>
                        Projected ledger movement for <strong style={{color:'var(--t1)'}}>{sel.id}</strong> by outcome. Server-side only — this is a preview.
                      </div>
                      <div className="ledger-tabs">
                        {[['WON','won','Decision: WON'],['LOST','lost','Decision: LOST'],['MERCHANT_ACCEPTED','merch','Merchant accepted']].map(([id,cls,lbl]) => (
                          <div
                            key={id}
                            className={`ledger-tab ${cls}${ledgerTab===id?' active':''}`}
                            onClick={() => {
                              setLedgerTab(id);
                              pushAudit('live', 'chargeback.ledger_projection_viewed', `Maya Ivanova · ${sel.id} · ${id} projection`);
                            }}
                          >{lbl}</div>
                        ))}
                      </div>
                      <div style={{padding:'8px 14px'}}>
                        <table className="ledger-table">
                          <thead>
                            <tr>
                              <th>Account</th>
                              <th>Direction</th>
                              <th style={{textAlign:'right'}}>Amount</th>
                              <th>Timing</th>
                              <th>Status</th>
                            </tr>
                          </thead>
                          <tbody>
                            {(ledgerTab==='WON' ? LEDGER_WON : ledgerTab==='LOST' ? LEDGER_LOST : LEDGER_MERCH).map((row, i) => (
                              <tr key={i}>
                                <td style={{fontSize:11,color:'var(--t1)'}}>{row.account}</td>
                                <td><span className={row.dirCls}>{row.dir}</span></td>
                                <td style={{textAlign:'right',fontFamily:'var(--f-mono)',fontSize:11,fontWeight:600}}>{row.amount}</td>
                                <td style={{fontSize:10,color:'var(--t3)',fontFamily:'var(--f-mono)'}}>{row.timing}</td>
                                <td><span className="rchip neutral">{row.status}</span></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      <div className="ledger-disclaimer">
                        ⚠️ These are projected postings only. Final ledger movement is <strong>server-side and audit-backed</strong>. UI cannot trigger or force ledger entries. Force Ledger Repost requires <strong>senior_compliance</strong>.
                      </div>
                      <div className="detail-sec">
                        <div className="detail-sec-title">Senior-only ledger actions</div>
                        <div className="senior-blk-box">
                          <div className="senior-blk-title">🔒 Blocked for Maya Ivanova (compliance_officer)</div>
                          <div className="senior-blk-row">Force Ledger Repost — requires senior_compliance</div>
                          <div className="senior-blk-row">View Raw Network Payload — requires senior_compliance</div>
                          <div className="senior-blk-row">Override Deadline — requires senior_compliance</div>
                        </div>
                      </div>
                    </>}

                    {/* ── Decision ── */}
                    {detailTab === 'decision' && <>
                      {actionSuccess && (
                        <div style={{margin:'8px 14px'}}>
                          <div className={`alert-box ${actionSuccess.type === 'success' ? 'green' : 'amber'}`}>{actionSuccess.msg}</div>
                        </div>
                      )}
                      {isTerminal && (
                        <div style={{margin:'8px 14px'}}>
                          <div className="alert-box amber">Case is in a terminal state ({sel.state}). No further decisions can be made.</div>
                        </div>
                      )}
                      {!isTerminal && isSeniorOnly && (
                        <div style={{margin:'8px 14px'}}>
                          <div className="blocked-box">
                            <div className="blocked-title">🔒 Senior compliance required</div>
                            <div className="blocked-text">This case requires <strong>senior_compliance</strong> role to render WON/LOST decisions. Maya Ivanova (compliance_officer) can request evidence, add notes, and escalate.</div>
                          </div>
                        </div>
                      )}

                      <div className="decision-sec">
                        <div className="detail-sec-title" style={{marginBottom:8}}>Decision actions</div>
                        <div className="dec-grid">
                          <button
                            className={`dec-btn ${isTerminal ? 'blocked' : 'warn'}`}
                            onClick={isTerminal ? () => showPerm('Terminal state.') : handleRequestEvidence}
                          >📋 Request More Evidence</button>
                          <button
                            className={`dec-btn ${isTerminal ? 'blocked' : 'default'}`}
                            onClick={isTerminal ? () => showPerm('Terminal state.') : handleAcceptMerchant}
                          >✅ Accept Merchant Liability</button>
                          <button
                            className={`dec-btn ${canDecideWonLost && !activeDecision ? 'success' : 'blocked'}`}
                            onClick={() => {
                              if (!canDecideWonLost) {
                                if (isSeniorOnly) showPerm('Requires senior_compliance.');
                                else if (!evidenceComplete) showPerm('Evidence must be EVIDENCE_RECEIVED (all items received) to decide.');
                                else showPerm('Case not in a decidable state.');
                              } else setActiveDecision('WON');
                            }}
                          >
                            <span>⚖️ Decide WON</span>
                            {!canDecideWonLost && <span className="blocked-reason">{isSeniorOnly ? 'senior only' : 'evidence incomplete'}</span>}
                          </button>
                          <button
                            className={`dec-btn ${canDecideWonLost && !activeDecision ? 'danger' : 'blocked'}`}
                            onClick={() => {
                              if (!canDecideWonLost) {
                                if (isSeniorOnly) showPerm('Requires senior_compliance.');
                                else if (!evidenceComplete) showPerm('Evidence must be complete to decide.');
                                else showPerm('Case not in a decidable state.');
                              } else setActiveDecision('LOST');
                            }}
                          >
                            <span>❌ Decide LOST</span>
                            {!canDecideWonLost && <span className="blocked-reason">{isSeniorOnly ? 'senior only' : 'evidence incomplete'}</span>}
                          </button>
                          <button
                            className={`dec-btn ${isTerminal ? 'blocked' : 'purple'}`}
                            onClick={isTerminal ? undefined : handleEscalate}
                          >🔺 Escalate</button>
                          <button
                            className="dec-btn default"
                            onClick={() => setActiveDecision('NOTE')}
                          >📝 Add Case Note</button>
                        </div>
                      </div>

                      {/* Decision form: WON/LOST */}
                      {(activeDecision === 'WON' || activeDecision === 'LOST') && (
                        <div className="decision-sec">
                          <div className="detail-sec-title" style={{color: activeDecision==='WON'?'var(--g)':'var(--rd)'}}>
                            {activeDecision==='WON' ? '⚖️ Decision: WON' : '❌ Decision: LOST'} — {sel.id}
                          </div>
                          <div className="form-group">
                            <label className="form-lbl">Decision rationale *</label>
                            <textarea
                              className="form-ta"
                              placeholder="Describe the basis for this decision, referencing evidence categories reviewed…"
                              value={rationale}
                              onChange={e => setRationale(e.target.value)}
                            />
                          </div>
                          <div className="form-group">
                            <label className="form-lbl">Outcome reason *</label>
                            <select className="form-sel" value={reason} onChange={e => setReason(e.target.value)}>
                              <option value="">Select reason…</option>
                              <option value="CARDHOLDER_FRAUD_CONFIRMED">CARDHOLDER_FRAUD_CONFIRMED</option>
                              <option value="MERCHANT_EVIDENCE_SUFFICIENT">MERCHANT_EVIDENCE_SUFFICIENT</option>
                              <option value="MERCHANT_EVIDENCE_INSUFFICIENT">MERCHANT_EVIDENCE_INSUFFICIENT</option>
                              <option value="DEADLINE_EXPIRED">DEADLINE_EXPIRED</option>
                              <option value="MERCHANT_ACCEPTED_LIABILITY">MERCHANT_ACCEPTED_LIABILITY</option>
                              <option value="NETWORK_RULES_SUPPORT_CARDHOLDER">NETWORK_RULES_SUPPORT_CARDHOLDER</option>
                              <option value="NETWORK_RULES_SUPPORT_MERCHANT">NETWORK_RULES_SUPPORT_MERCHANT</option>
                              <option value="NEEDS_SENIOR_REVIEW">NEEDS_SENIOR_REVIEW</option>
                            </select>
                          </div>
                          <label className="form-chk">
                            <input type="checkbox" checked={evChecked} onChange={e => setEvChecked(e.target.checked)} />
                            I confirm I have reviewed all available evidence and the checklist is complete
                          </label>
                          <label className="form-chk">
                            <input type="checkbox" checked={dlChecked} onChange={e => setDlChecked(e.target.checked)} />
                            I am aware of current deadline status (merchant deadline {dlRemain(sel.deadline)} remaining)
                          </label>
                          <label className="form-chk">
                            <input type="checkbox" checked={lgChecked} onChange={e => setLgChecked(e.target.checked)} />
                            I have reviewed the projected ledger impact for this outcome
                          </label>
                          <div className="alert-box amber">
                            Final ledger movement is executed server-side only. This decision will be strongly audited and cannot be reversed without senior_compliance approval.
                          </div>
                          <div className="submit-btn-row">
                            <button
                              className={`submit-btn ${activeDecision==='WON'?'success':'danger'}`}
                              disabled={!rationale.trim() || !evChecked}
                              onClick={() => handleDecide(activeDecision)}
                            >Submit Decision — {activeDecision}</button>
                            <button className="submit-btn cancel" onClick={() => setActiveDecision(null)}>Cancel</button>
                          </div>
                        </div>
                      )}

                      {/* Note form */}
                      {activeDecision === 'NOTE' && (
                        <div className="decision-sec">
                          <div className="detail-sec-title">Add Case Note — {sel.id}</div>
                          <div className="form-group">
                            <label className="form-lbl">Note</label>
                            <textarea
                              className="form-ta"
                              placeholder="Enter case note…"
                              value={noteText}
                              onChange={e => setNoteText(e.target.value)}
                            />
                          </div>
                          <div className="submit-btn-row">
                            <button
                              className="submit-btn success"
                              disabled={!noteText.trim()}
                              onClick={handleAddNote}
                            >Save Note</button>
                            <button className="submit-btn cancel" onClick={() => setActiveDecision(null)}>Cancel</button>
                          </div>
                        </div>
                      )}

                      {/* Senior-only blocked panel */}
                      <div className="decision-sec">
                        <div className="detail-sec-title">Senior-only actions (blocked for Maya)</div>
                        <div className="senior-blk-box">
                          <div className="senior-blk-title">🔒 Requires senior_compliance</div>
                          <div className="senior-blk-row">Override Deadline — cannot be performed by compliance_officer</div>
                          <div className="senior-blk-row">Force Ledger Repost — direct ledger mutation requires senior role</div>
                          <div className="senior-blk-row">View Raw Network Payload — network arbitration data is senior-only</div>
                        </div>
                      </div>
                    </>}

                  </div>{/* end tab-content */}
                </>
            }
          </div>{/* end detail-panel */}

          {/* ── Audit rail ── */}
          <div className="audit-rail">
            <div className="au-hdr">
              <div className="au-title">Security &amp; Audit</div>
              <div className="au-sub">BOF-UI-08 · compliance_officer</div>
            </div>
            <div className="au-body">

              <div>
                <div className="au-sec-title">Session identity</div>
                <div className="au-row"><span className="au-k">User</span><span className="au-v">{USER.name}</span></div>
                <div className="au-row"><span className="au-k">OIDC role</span><span className="au-v ok">compliance_officer</span></div>
                <div className="au-row"><span className="au-k">Auth source</span><span className="au-v">Keycloak OIDC</span></div>
                <div className="au-row"><span className="au-k">Token status</span><span className="au-v ok">active</span></div>
                <div className="au-row"><span className="au-k">Platform role</span><span className="au-v ok">compliance_officer</span></div>
              </div>

              <div>
                <div className="au-sec-title">Access invariants</div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico ok">✓</span>
                  <span className="au-rbac-txt"><strong>Chargeback decisions</strong> are strongly audited</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico ok">✓</span>
                  <span className="au-rbac-txt"><strong>Evidence preview</strong> requires read-audit confirmation</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico ok">✓</span>
                  <span className="au-rbac-txt"><strong>Ledger movement</strong> is server-side only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>Raw network payload</strong> — senior_compliance only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>Deadline override</strong> — senior_compliance only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>Force ledger repost</strong> — senior_compliance only</span>
                </div>
                <div className="au-rbac-row">
                  <span className="au-rbac-ico no">✗</span>
                  <span className="au-rbac-txt blocked"><strong>End-user / merchant sessions</strong> cannot access this screen</span>
                </div>
              </div>

              <div>
                <div className="au-sec-title">Audit event types</div>
                <div style={{display:'flex',flexDirection:'column',gap:0}}>
                  {[
                    'chargeback.case_opened',
                    'chargeback.evidence_requested',
                    'chargeback.evidence_received',
                    'read_audit.evidence_previewed',
                    'chargeback.note_added',
                    'chargeback.decision_won',
                    'chargeback.decision_lost',
                    'chargeback.merchant_accepted',
                    'chargeback.escalated',
                    'chargeback.deadline_override_denied',
                    'chargeback.ledger_projection_viewed',
                  ].map(ev => (
                    <div key={ev} className="au-inv">{ev}</div>
                  ))}
                </div>
              </div>

              <div>
                <div className="au-sec-title">Event log — {sel ? sel.id : 'no selection'}</div>
                <div className="au-ev-log">
                  {auditLog.slice(0, 8).map((e, i) => (
                    <div key={i} className="au-ev">
                      <div className={`au-ev-code${e.isNew ? ' new' : ''}`}>{e.ev}</div>
                      <div className="au-ev-meta">{e.meta}</div>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>

        </div>{/* end content-area */}
      </div>{/* end main */}

      {/* Permission tooltip */}
      {permMsg && (
        <div className="perm-popover" style={{bottom:24,right:24}}>
          🔒 {permMsg}
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
