<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Payments — MDB-UI-05</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#eceae5; --surface:#ffffff; --surf2:#f7f6f3; --inp:#faf9f7; --hover:#f0efe9;
      --sb:#111114; --sb-bdr:#1e1e22; --sb-muted:#545460; --sb-active:#1e1e28;
      --bdr:#dddad2; --bdr-mid:#c5c2ba; --bdr-focus:#1c1c1f;
      --t1:#1c1c1f; --t2:#575763; --t3:#9898a6; --t4:#d0d0da;
      --cta:#1c1c1f; --cta-hov:#2e2e35; --cta-t:#ffffff;
      --g:#166534;  --g-bg:#f0fdf4;  --g-bd:#bbf7d0;
      --am:#854d0e; --am-bg:#fffbeb; --am-bd:#fde68a;
      --rd:#9b1c1c; --rd-bg:#fef2f2; --rd-bd:#fecaca;
      --or:#b45309; --or-bg:#fff7ed; --or-bd:#fed7aa;
      --pu:#5b21b6; --pu-bg:#f5f3ff; --pu-bd:#ddd6fe;
      --bl:#1d4ed8; --bl-bg:#eff6ff; --bl-bd:#bfdbfe;
      --sb-env-bg:#1a1030; --sb-env-t:#b39cf0; --sb-env-bd:#362566;
      --f-ui:'IBM Plex Sans',sans-serif; --f-mono:'IBM Plex Mono',monospace;
      --r:3px; --r-lg:5px; --w-sb:220px; --w-tl:252px;
    }
    html,body { height:100%; background:var(--bg); color:var(--t1); font-family:var(--f-ui); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    #root { width:100%; height:100vh; display:flex; overflow:hidden; }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--bdr-mid); border-radius:2px; }

    /* SIDEBAR */
    .sidebar { width:var(--w-sb); flex-shrink:0; background:var(--sb); border-right:1px solid var(--sb-bdr); display:flex; flex-direction:column; overflow:hidden; }
    .sb-brand { padding:14px 14px 12px; border-bottom:1px solid var(--sb-bdr); }
    .sb-mark  { display:flex; align-items:center; gap:9px; }
    .sb-name  { font-size:14.5px; font-weight:600; color:#eaeaf4; letter-spacing:-0.01em; }
    .sb-sub   { font-size:9.5px; color:var(--sb-muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:3px; }
    .sb-merchant { margin-top:10px; padding:7px 9px; background:rgba(255,255,255,0.04); border-radius:var(--r); border:1px solid var(--sb-bdr); }
    .sb-m-label { font-size:9px; color:var(--sb-muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:3px; }
    .sb-m-name  { font-size:12.5px; font-weight:600; color:#eaeaf4; }
    .sb-m-id    { font-size:10px; color:var(--sb-muted); font-family:var(--f-mono); margin-top:1px; }
    .sb-nav   { flex:1; padding:10px 7px; overflow-y:auto; }
    .nav-sec  { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--sb-muted); padding:4px 9px 5px; margin-top:4px; }
    .nav-item { display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:var(--r); color:var(--sb-muted); font-size:12px; cursor:default; user-select:none; transition:background 0.1s; }
    .nav-item.locked  { opacity:0.35; }
    .nav-item.current { background:var(--sb-active); color:#e0e0ec; }
    .nav-lock { margin-left:auto; font-size:9px; opacity:0.6; }
    .nav-id   { margin-left:auto; font-size:9px; font-family:var(--f-mono); color:var(--sb-muted); opacity:0.8; }
    .nav-item.current .nav-id { color:#7c6ff7; opacity:1; }
    .sb-footer { padding:10px 14px; border-top:1px solid var(--sb-bdr); }
    .env-chip  { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:var(--r); background:var(--sb-env-bg); border:1px solid var(--sb-env-bd); font-size:10px; color:var(--sb-env-t); font-family:var(--f-mono); margin-bottom:4px; }
    .env-dot   { width:5px; height:5px; border-radius:50%; background:var(--sb-env-t); opacity:0.7; }
    .env-host  { font-size:10px; color:var(--sb-muted); font-family:var(--f-mono); }
    .sb-user   { display:flex; align-items:center; gap:7px; margin-top:9px; }
    .sb-avatar { width:24px; height:24px; border-radius:50%; background:#5b21b6; color:#fff; font-size:9px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sb-uname  { font-size:11px; font-weight:500; color:#eaeaf4; }
    .sb-urole  { font-size:9.5px; color:var(--sb-muted); text-transform:uppercase; letter-spacing:0.05em; }

    /* MAIN */
    .main-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
    .page-hdr  { display:flex; align-items:center; justify-content:space-between; padding:10px 22px; border-bottom:1px solid var(--bdr); background:var(--surface); flex-shrink:0; gap:10px; flex-wrap:wrap; }
    .page-bc   { font-size:12.5px; color:var(--t2); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .page-bc strong { color:var(--t1); font-weight:500; }
    .page-bc .sep   { color:var(--t3); }
    .page-meta { display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; }
    .screen-id { font-size:10px; font-family:var(--f-mono); color:var(--t3); padding:2px 6px; border:1px solid var(--bdr); border-radius:var(--r); }
    .env-badge { font-size:10px; font-family:var(--f-mono); color:var(--am); background:var(--am-bg); border:1px solid var(--am-bd); padding:2px 8px; border-radius:var(--r); display:flex; align-items:center; gap:5px; }
    .env-badge-dot { width:5px; height:5px; border-radius:50%; background:var(--am); }
    .user-chip { display:flex; align-items:center; gap:7px; padding:3px 9px 3px 3px; border:1px solid var(--bdr); border-radius:20px; background:var(--surf2); }
    .user-avatar { width:22px; height:22px; border-radius:50%; background:#5b21b6; color:#fff; font-size:9px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .user-name { font-size:11.5px; color:var(--t2); font-weight:500; }

    /* CONTENT */
    .content-area { flex:1; display:flex; overflow:hidden; }
    .left-scroll  { flex:1; overflow-y:auto; padding:14px 18px; background:var(--bg); display:flex; flex-direction:column; gap:11px; min-width:0; }

    /* PANELS */
    .panel    { background:var(--surface); border:1px solid var(--bdr); border-radius:var(--r-lg); overflow:hidden; flex-shrink:0; }
    .panel-hdr{ display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-bottom:1px solid var(--bdr); background:var(--surf2); flex-shrink:0; flex-wrap:wrap; gap:8px; }
    .panel-title { font-size:11.5px; font-weight:600; color:var(--t1); text-transform:uppercase; letter-spacing:0.04em; }
    .panel-body  { padding:13px 16px; }

    /* BADGES */
    .badge { display:inline-flex; align-items:center; padding:2px 6px; border-radius:2px; font-size:9.5px; font-weight:600; letter-spacing:0.07em; font-family:var(--f-mono); border:1px solid transparent; white-space:nowrap; }
    .b-active   { background:var(--g-bg);  color:var(--g);   border-color:var(--g-bd); }
    .b-locked   { background:var(--hover); color:var(--t2);  border-color:var(--bdr); }
    .b-disabled { background:var(--hover); color:var(--t3);  border-color:var(--bdr); }
    .b-sandbox  { background:var(--pu-bg); color:var(--pu);  border-color:var(--pu-bd); }
    .b-inreview { background:var(--pu-bg); color:var(--pu);  border-color:var(--pu-bd); }
    .b-delivered{ background:var(--g-bg);  color:var(--g);   border-color:var(--g-bd); }
    .b-retrying { background:var(--or-bg); color:var(--or);  border-color:var(--or-bd); }
    .b-dlq      { background:#1c0520;      color:#e879f9;     border-color:#a21caf; }
    /* Payment status */
    .b-rqpm     { background:var(--am-bg); color:var(--am);  border-color:var(--am-bd); }
    .b-auth     { background:var(--bl-bg); color:var(--bl);  border-color:var(--bl-bd); }
    .b-req-cap  { background:var(--or-bg); color:var(--or);  border-color:var(--or-bd); }
    .b-captured { background:var(--g-bg);  color:var(--g);   border-color:var(--g-bd); }
    .b-succeeded{ background:var(--g-bg);  color:var(--g);   border-color:var(--g-bd); }
    .b-failed   { background:var(--rd-bg); color:var(--rd);  border-color:var(--rd-bd); }
    .b-refunded { background:var(--pu-bg); color:var(--pu);  border-color:var(--pu-bd); }
    .b-disputed { background:#fff7ed;      color:#c2410c;    border-color:#fed7aa; }
    .b-none     { color:var(--t4); font-family:var(--f-mono); font-size:11px; }

    /* STATUS STRIP */
    .status-strip { display:flex; flex-wrap:wrap; background:var(--surface); border:1px solid var(--bdr); border-radius:var(--r-lg); overflow:hidden; flex-shrink:0; }
    .stat-cell { padding:11px 14px; border-right:1px solid var(--bdr); flex:1 1 110px; min-width:0; }
    .stat-cell:last-child { border-right:none; }
    .stat-k { font-size:9.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--t3); margin-bottom:4px; font-weight:600; }
    .stat-v { font-size:12.5px; color:var(--t1); font-weight:500; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .stat-v.mono { font-family:var(--f-mono); font-size:11px; }
    .stat-v.red { color:var(--rd); } .stat-v.warn { color:var(--am); } .stat-v.pu { color:var(--pu); }

    /* KV */
    .kv-table { display:flex; flex-direction:column; }
    .kv-row   { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid var(--hover); }
    .kv-row:last-child { border-bottom:none; }
    .kv-k { font-size:11px; color:var(--t3); min-width:164px; flex-shrink:0; padding-top:2px; }
    .kv-v { font-size:12px; color:var(--t1); flex:1; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .kv-v.mono { font-family:var(--f-mono); font-size:11px; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 14px; border-radius:var(--r); font-size:12.5px; font-weight:500; font-family:var(--f-ui); cursor:pointer; border:none; transition:background 0.1s; white-space:nowrap; }
    .btn-primary { background:var(--cta); color:var(--cta-t); }
    .btn-primary:hover { background:var(--cta-hov); }
    .btn-ghost   { background:var(--surface); color:var(--t2); border:1px solid var(--bdr-mid); }
    .btn-ghost:hover { background:var(--hover); color:var(--t1); }
    .btn-danger  { background:var(--rd-bg); color:var(--rd); border:1px solid var(--rd-bd); }
    .btn-sm { padding:4px 10px; font-size:11px; } .btn-xs { padding:2px 7px; font-size:10.5px; }
    .btn:disabled { opacity:0.32; cursor:not-allowed; }
    .btn-faux-dis { opacity:0.32; cursor:not-allowed; }

    /* ALERTS */
    .alert { display:flex; gap:10px; padding:9px 12px 9px 13px; font-size:12px; line-height:1.55; border-left-width:3px; border-left-style:solid; border-radius:var(--r); }
    .alert-warn  { background:var(--am-bg); border-left-color:var(--am); color:#78350f; }
    .alert-red   { background:var(--rd-bg); border-left-color:var(--rd); color:#7f1d1d; }
    .alert-info  { background:var(--hover); border-left-color:var(--bdr-mid); color:var(--t2); }
    .alert-green { background:var(--g-bg);  border-left-color:var(--g);  color:#14532d; }
    .alert-pu    { background:var(--pu-bg); border-left-color:var(--pu); color:#3b0764; }
    .alert-blue  { background:var(--bl-bg); border-left-color:var(--bl); color:#1e3a8a; }

    /* TABLES */
    .data-table { width:100%; border-collapse:collapse; }
    .data-table th { font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--t3); padding:6px 10px; text-align:left; border-bottom:1px solid var(--bdr); background:var(--surf2); font-weight:600; white-space:nowrap; }
    .data-table td { padding:7px 10px; font-size:12px; border-bottom:1px solid var(--hover); vertical-align:middle; }
    .data-table tr:last-child td { border-bottom:none; }
    .data-table tr.row-hover:hover td { background:var(--surf2); cursor:pointer; }
    .data-table tr.row-selected td { background:rgba(29,78,216,0.04); }
    .mono-cell { font-family:var(--f-mono); font-size:11px; }
    .url-cell { font-family:var(--f-mono); font-size:10.5px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--t2); }
    .payment-table { table-layout:fixed; }
    .payment-table th,
    .payment-table td { padding-left:8px; padding-right:8px; overflow:hidden; }
    .payment-table .pi-col { width:8%; }
    .payment-table .customer-col { width:15%; }
    .payment-table .amount-col { width:7%; }
    .payment-table .status-col { width:8%; }
    .payment-table .capture-col { width:8%; }
    .payment-table .date-col { width:8%; }
    .payment-table .api-col { width:8%; }
    .payment-table .request-col { width:9%; }
    .payment-table .actions-col { width:21%; }
    .payment-table .truncate { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .payment-actions { display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap; }
    .payment-actions .btn-xs { padding-left:6px; padding-right:6px; font-size:10px; }

    /* FORMS */
    .inp-field { width:100%; padding:6px 9px; border:1px solid var(--bdr-mid); border-radius:var(--r); font-size:12px; color:var(--t1); background:var(--inp); outline:none; font-family:var(--f-ui); transition:border-color 0.12s; }
    .inp-field:focus { border-color:var(--bdr-focus); }
    select.inp-field { cursor:pointer; }

    /* FILTER CHIPS */
    .filter-chips { display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; padding-bottom:1px; }
    .filter-chips::-webkit-scrollbar { height:2px; }
    .fc { display:inline-flex; align-items:center; padding:3px 9px; border-radius:2px; font-size:10px; font-family:var(--f-mono); border:1px solid var(--bdr-mid); background:var(--surf2); color:var(--t2); cursor:pointer; transition:all 0.1s; white-space:nowrap; font-weight:500; user-select:none; }
    .fc:hover { border-color:var(--bdr-focus); color:var(--t1); background:var(--hover); }
    .fc.fc-on { background:var(--cta); color:var(--cta-t); border-color:var(--cta); }

    /* TOGGLE */
    .toggle-row { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
    .toggle-track { width:32px; height:17px; border-radius:9px; background:var(--bdr-mid); position:relative; transition:background 0.15s; flex-shrink:0; }
    .toggle-track.on { background:#1d4ed8; }
    .toggle-thumb { width:13px; height:13px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left 0.15s; box-shadow:0 1px 2px rgba(0,0,0,0.15); }
    .toggle-track.on .toggle-thumb { left:17px; }
    .toggle-label { font-size:10.5px; color:var(--t2); }
    .toggle-track.on + .toggle-label { color:var(--bl); font-weight:500; }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(17,17,20,0.52); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
    .modal { background:var(--surface); border:1px solid var(--bdr); border-radius:var(--r-lg); width:480px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,0.18); }
    .modal-hdr   { display:flex; align-items:flex-start; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--bdr); flex-shrink:0; background:var(--surf2); }
    .modal-title { font-size:13px; font-weight:600; color:var(--t1); }
    .modal-sub   { font-size:11px; color:var(--t3); margin-top:2px; }
    .modal-close { width:24px; height:24px; border-radius:var(--r); background:transparent; border:none; color:var(--t3); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; transition:background 0.1s; }
    .modal-close:hover { background:var(--hover); color:var(--t1); }
    .modal-body  { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .modal-footer{ padding:12px 16px; border-top:1px solid var(--bdr); display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
    .modal-note  { font-size:10.5px; color:var(--t3); margin-left:auto; font-style:italic; }

    /* DRAWER */
    .drawer-overlay { position:fixed; inset:0; background:rgba(17,17,20,0.35); z-index:90; }
    .drawer { position:fixed; top:0; right:0; bottom:0; width:440px; max-width:95vw; background:var(--surface); border-left:1px solid var(--bdr); display:flex; flex-direction:column; z-index:91; box-shadow:-4px 0 24px rgba(0,0,0,0.12); }
    .drawer-hdr  { padding:12px 16px; border-bottom:1px solid var(--bdr); flex-shrink:0; background:var(--surf2); display:flex; align-items:flex-start; justify-content:space-between; }
    .drawer-title{ font-size:13px; font-weight:600; color:var(--t1); }
    .drawer-sub  { font-size:10.5px; color:var(--t3); margin-top:2px; font-family:var(--f-mono); }
    .drawer-body { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
    .drawer-footer{ padding:10px 16px; border-top:1px solid var(--bdr); flex-shrink:0; display:flex; gap:6px; flex-wrap:wrap; }
    .drawer-tabs { display:flex; border-bottom:1px solid var(--bdr); background:var(--surf2); flex-shrink:0; overflow-x:auto; }
    .drawer-tabs::-webkit-scrollbar { height:2px; }
    .dt { padding:8px 12px; font-size:11px; font-weight:500; color:var(--t3); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.1s; white-space:nowrap; user-select:none; }
    .dt:hover { color:var(--t1); }
    .dt.dt-on { color:var(--t1); border-bottom-color:var(--cta); }

    /* LIFECYCLE */
    .lc-flow  { display:flex; align-items:flex-start; overflow-x:auto; gap:0; padding-bottom:4px; }
    .lc-step  { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:5px 5px; border-radius:var(--r); min-width:58px; transition:background 0.1s; flex-shrink:0; }
    .lc-step:hover { background:var(--hover); }
    .lc-icon  { width:26px; height:26px; border-radius:50%; border:1.5px solid var(--bdr-mid); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0; }
    .lc-done   .lc-icon { background:var(--g);    color:#fff; border-color:var(--g); }
    .lc-curr   .lc-icon { background:var(--bl);   color:#fff; border-color:var(--bl); }
    .lc-pend   .lc-icon { background:var(--surf2); color:var(--t3); border-color:var(--bdr-mid); }
    .lc-fail   .lc-icon { background:var(--rd);   color:#fff; border-color:var(--rd); }
    .lc-label { font-size:9px; font-family:var(--f-mono); color:var(--t3); text-align:center; line-height:1.3; max-width:58px; }
    .lc-done  .lc-label { color:var(--g); }
    .lc-curr  .lc-label { color:var(--bl); font-weight:600; }
    .lc-fail  .lc-label { color:var(--rd); font-weight:600; }
    .lc-arrow { font-size:13px; color:var(--t4); flex-shrink:0; align-self:center; margin:0 1px; margin-bottom:18px; }

    /* TIMELINE RAIL */
    .tl-rail  { width:var(--w-tl); flex-shrink:0; background:var(--surface); border-left:1px solid var(--bdr); display:flex; flex-direction:column; overflow:hidden; }
    .tl-hdr   { padding:10px 14px; border-bottom:1px solid var(--bdr); flex-shrink:0; font-size:9.5px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:0.1em; }
    .tl-body  { flex:1; overflow-y:auto; padding:10px 14px; }
    .tl-evt   { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--hover); cursor:pointer; }
    .tl-evt:last-child { border-bottom:none; }
    .tl-evt:hover .tl-name { color:var(--cta); }
    .tl-spine { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
    .tl-dot   { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px; }

function Badge({ cls, children }) { return <span className={`badge ${cls}`}>{children}</span>; }

function StatusBadge({ status }) {
  const M = {
    requires_payment_method:{ cls:'b-rqpm',     label:'REQ. PM' },
    authorized:             { cls:'b-auth',      label:'AUTHORIZED' },
    requires_capture:       { cls:'b-req-cap',   label:'REQ. CAPTURE' },
    captured:               { cls:'b-captured',  label:'CAPTURED' },
    succeeded:              { cls:'b-succeeded', label:'SUCCEEDED' },
    failed:                 { cls:'b-failed',    label:'FAILED' },
    refunded:               { cls:'b-refunded',  label:'REFUNDED' },
    disputed:               { cls:'b-disputed',  label:'DISPUTED' },
  };
  const c = M[status] || { cls:'b-locked', label: status.toUpperCase() };
  return <span className={`badge ${c.cls}`}>{c.label}</span>;
}

function CaptureStateBadge({ state }) {
  if (!state || state === 'none' || state === 'uncaptured') return <span style={{color:'var(--t4)'}}>—</span>;
  if (state === 'authorized_hold') return <Badge cls="b-auth">AUTH HOLD</Badge>;
  if (state === 'captured') return <Badge cls="b-captured">CAPTURED</Badge>;
  return <span style={{fontFamily:'var(--f-mono)', fontSize:11, color:'var(--t3)'}}>{state}</span>;
}

function WhBadge({ status }) {
  const M = {
    delivered:  { cls:'b-delivered', label:'DELIVERED' },
    retrying:   { cls:'b-retrying',  label:'RETRYING' },
    dlq:        { cls:'b-dlq',       label:'DLQ' },
    failed:     { cls:'b-failed',    label:'FAILED' },
    not_emitted:{ cls:'b-locked',    label:'NOT EMITTED' },
  };
  const c = M[status] || { cls:'b-locked', label:status };
  return <Badge cls={c.cls}>{c.label}</Badge>;
}

function IdempBadge({ result }) {
  if (result === 'created')  return <Badge cls="b-active">CREATED</Badge>;
  if (result === 'replayed') return <Badge cls="b-auth">REPLAYED</Badge>;
  if (result === 'conflict') return <Badge cls="b-failed">CONFLICT 409</Badge>;
  return <Badge cls="b-locked">{result}</Badge>;
}

function LifecycleTab({ p, explanationStep, onStepClick }) {
  const pos = p.statusPosition;
  const isFailedTerminal = p.status === 'failed';

  function stepClass(i) {
    if (isFailedTerminal) {
      if (i < 2) return 'lc-done';
      if (i === 2) return 'lc-fail';
      return 'lc-pend';
    }
    if (typeof pos === 'number') {
      if (i < pos) return 'lc-done';
      if (i === pos) return 'lc-curr';
      return 'lc-pend';
    }
    return 'lc-pend';
  }

  function stepIcon(i, cls) {
    if (cls === 'lc-done') return '✓';
    if (cls === 'lc-fail') return '✕';
    return String(i + 1);
  }

  return (
    <div style={{display:'flex', flexDirection:'column', gap:12}}>
      {/* Flow visualization */}
      <div>
        <div style={{fontSize:10.5, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:10}}>State Progression — click a step for details</div>
        <div className="lc-flow">
          {LC_STEPS.map((step, i) => {
            const cls = stepClass(i);
            return (
              <React.Fragment key={step.id}>
                <div className={`lc-step ${cls}`} onClick={() => onStepClick(explanationStep === step.id ? null : step.id)}>
                  <div className="lc-icon">{stepIcon(i, cls)}</div>
                  <div className="lc-label">{step.label}</div>
                </div>
                {i < LC_STEPS.length - 1 && <div className="lc-arrow">›</div>}
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {/* Terminal state alerts */}
      {isFailedTerminal && (
        <div className="alert alert-red" style={{fontSize:11}}>
          <strong>FAILED</strong> — Authorization declined. Error: <span style={{fontFamily:'var(--f-mono)', fontSize:10.5}}>{p.apiCtx.errorCode}</span>. No hold, no capture, no ledger entry.
        </div>
      )}
      {p.status === 'refunded' && (
        <div className="alert alert-pu" style={{fontSize:11}}>
          <strong>REFUNDED</strong> — Full refund of EUR {p.refund?.amount?.toFixed(2)} issued. Net merchant receivable: EUR 0.00.
        </div>
      )}
      {p.status === 'disputed' && (
        <div className="alert alert-warn" style={{fontSize:11}}>
          <strong>DISPUTED</strong> — Chargeback {p.dispute?.id}. EUR {p.dispute?.amount?.toFixed(2)} on hold. Settlement blocked. Use Disputes screen (MDB-UI-07) to respond.
        </div>
      )}

      {/* Step explanation */}
      {explanationStep && STEP_EXPLAIN[explanationStep] && (
        <div className="alert alert-blue" style={{fontSize:11}}>
          <div>
            <strong style={{textTransform:'uppercase', fontSize:9.5, letterSpacing:'0.05em'}}>{explanationStep.replace(/_/g,' ')}</strong>
            <div style={{marginTop:3}}>{STEP_EXPLAIN[explanationStep]}</div>
          </div>
        </div>
      )}

      {/* Policy notes */}
      <div style={{display:'flex', flexDirection:'column', gap:5}}>
        {[
          { icon:'⚠', text:'Authorized holds are NOT final captures. The hold may expire if not captured within the issuer window.' },
          { icon:'⊘', text:'Capture and Refund require API calls or backoffice action. These workflows are not yet available in the merchant UI.' },
          { icon:'⚑', text:'Disputes are handled in the Disputes workflow (MDB-UI-07). Failed payments do not post captured ledger entries.' },
        ].map((n, i) => (
          <div key={i} style={{display:'flex', gap:8, padding:'5px 9px', background:'var(--surf2)', border:'1px solid var(--bdr)', borderRadius:'var(--r)', fontSize:11, color:'var(--t2)'}}>
            <span style={{fontSize:11, color:'var(--t3)', flexShrink:0}}>{n.icon}</span>
            {n.text}
          </div>
        ))}
      </div>

      {/* Lifecycle events timeline */}
      <div>
        <div style={{fontSize:10.5, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:8}}>Lifecycle Events</div>
        {p.lifecycleEvts.map((evt, i) => (
          <div key={i} style={{display:'flex', gap:10, paddingBottom:10}}>
            <div style={{display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0}}>
              <div style={{width:8, height:8, borderRadius:'50%', marginTop:3, background: evt.s==='done'?'var(--g)': evt.s==='failed'?'var(--rd)': evt.s==='dispute'?'var(--or)': evt.s==='current'?'var(--bl)':'var(--t4)'}} />
              {i < p.lifecycleEvts.length - 1 && <div style={{width:1, flex:1, background:'var(--bdr)', margin:'4px 0', minHeight:12}} />}
            </div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:9.5, fontFamily:'var(--f-mono)', color:'var(--t3)', marginBottom:1}}>{evt.ts}</div>
              <div style={{fontSize:11.5, fontWeight:600, color:'var(--t1)', marginBottom:evt.note?2:0}}>{evt.label}</div>
              {evt.note && <div style={{fontSize:11, color:'var(--t2)', lineHeight:1.4}}>{evt.note}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ApiTab({ p }) {
  const c = p.apiCtx;
  const isConflict = c.idempotencyResult === 'conflict';
  const isFailed   = c.errorCode != null;
  const isReplay   = c.idempotencyResult === 'replayed';

  return (
    <div style={{display:'flex', flexDirection:'column', gap:12}}>
      {isConflict && (
        <div className="alert alert-red">
          <div>
            <strong>Idempotency Key Reuse Violation</strong> — A request was submitted with an existing idempotency key but different parameters. The request was rejected with 409. The original payment intent is unaffected.
          </div>
        </div>
      )}
      {isReplay && (
        <div className="alert alert-blue">
          <div>
            <strong>Idempotent Replay</strong> — A duplicate request was detected. The stored response was returned without creating a new payment. Safe retry behavior confirmed.
          </div>
        </div>
      )}
      {isFailed && (
        <div className="alert alert-red" style={{fontSize:11}}>
          <div>
            <strong>Authorization Failed</strong> — Error code: <span style={{fontFamily:'var(--f-mono)'}}>{c.errorCode}</span>. HTTP {c.responseStatus}. No capture occurred.
          </div>
        </div>
      )}
      <div className="kv-table">
        <KV k="Endpoint path" mono><span style={{color:'var(--bl)'}}>{c.endpoint}</span></KV>
        <KV k="Method" mono>POST</KV>
        <KV k="API key prefix" mono>{p.apiKeyPrefix}</KV>
        <KV k="Request ID" mono>{p.requestId}</KV>
        <KV k="Idempotency key" mono><span style={{color:'var(--t2)', wordBreak:'break-all'}}>{p.idempotencyKey}</span></KV>
        <KV k="Idempotency result"><IdempBadge result={c.idempotencyResult} /></KV>
        <KV k="Response status" mono>
          <span style={{color: c.responseStatus < 300 ? 'var(--g)' : c.responseStatus < 500 ? 'var(--am)' : 'var(--rd)'}}>
            {c.responseStatus}
          </span>
        </KV>
        {c.errorCode && <KV k="Error code" mono><span style={{color:'var(--rd)'}}>{c.errorCode}</span></KV>}
        <KV k="Scope used"><span className="scope-tag">{c.scopeUsed}</span></KV>
      </div>
      {c.note && (
        <div className="alert alert-info" style={{fontSize:11}}>
          {c.note}
        </div>
      )}
      {/* Idempotency rules */}
      <div>
        <div style={{fontSize:10.5, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:8}}>Idempotency Rules</div>
        {[
          { icon:'✓', color:'var(--g)', text:'Same key + same params → cached response returned, no duplicate created.' },
          { icon:'✕', color:'var(--rd)', text:'Same key + different params → 409 idempotency_key_reuse_violation. Request rejected.' },
          { icon:'⏱', color:'var(--am)', text:'Idempotency keys are stored for 24 hours. TTL resets on each access.' },
        ].map((r, i) => (
          <div key={i} style={{display:'flex', gap:8, padding:'5px 9px', background:'var(--surf2)', border:'1px solid var(--bdr)', borderRadius:'var(--r)', fontSize:11, color:'var(--t2)', marginBottom:4}}>
            <span style={{color:r.color, fontWeight:700, flexShrink:0, fontSize:11}}>{r.icon}</span>
            {r.text}
          </div>
        ))}
      </div>
    </div>
  );
}

function LedgerTab({ p }) {
  return (
    <div style={{display:'flex', flexDirection:'column', gap:12}}>
      <div>
        <div style={{fontSize:10.5, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:8}}>
          Ledger &amp; Settlement Summary — {p.id}
        </div>
        {p.ledgerItems.map((item, i) => (
          <div key={i} className="ledger-row">
            <div className="ledger-k">{item.k}</div>
            <div style={{textAlign:'right'}}>
              <div className="ledger-v">{item.v}</div>
              {item.note && <div style={{fontSize:9.5, color:'var(--t3)', marginTop:1}}>{item.note}</div>}
            </div>
          </div>
        ))}
      </div>
      <div className="alert alert-info" style={{fontSize:11}}>
        This is a business-facing summary. Platform fee is estimated at 2.9% + €0.30 (sandbox rate). Actual settlement timing and fees depend on production configuration.
      </div>
      {p.status === 'disputed' && (
        <div className="alert alert-warn" style={{fontSize:11}}>
          Settlement is blocked pending dispute resolution. EUR {p.dispute?.amount?.toFixed(2)} is held in chargeback reserve. Merchant receivable will remain on hold until the dispute is resolved.
        </div>
      )}
      {p.status === 'failed' && (
        <div className="alert alert-info" style={{fontSize:11}}>
          No ledger entries posted. Authorization was declined and no funds movement occurred.
        </div>
      )}
    </div>
  );
}

function WebhooksTab({ p }) {
  return (
    <div style={{display:'flex', flexDirection:'column', gap:12}}>
      <div>
        <div style={{fontSize:10.5, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:600, marginBottom:8}}>
          Webhook Events — {p.id}
        </div>
        {p.webhooks.map((w, i) => (
          <div key={i} className="wh-row">
            <span style={{fontFamily:'var(--f-mono)', fontSize:10.5, color:'var(--t2)', flex:'1 1 180px'}}>{w.event}</span>
            <WhBadge status={w.status} />
            <span style={{fontFamily:'var(--f-mono)', fontSize:10, color:'var(--t3)', marginLeft:'auto'}}>{w.ts}</span>
          </div>
        ))}
      </div>
      {p.webhooks.some(w => w.status === 'retrying' || w.status === 'dlq') && (
        <div className="alert alert-warn" style={{fontSize:11}}>
          One or more webhook deliveries are retrying or have been moved to DLQ. See the Webhooks screen (MDB-UI-04) for retry state, DLQ management, and delivery logs.
        </div>
      )}
      <button className="btn btn-ghost btn-sm" style={{alignSelf:'flex-start'}}>View in Webhooks → MDB-UI-04</button>
    </div>
  );
}

/* ── PAYMENT DRAWER ── */
function PaymentDrawer({ payment, tab, onTabChange, onClose, explanationStep, onStepClick }) {
  const TABS = [
    { id:'detail',   label:'Detail' },
    { id:'lifecycle',label:'Lifecycle' },
    { id:'api',      label:'API Context' },
    { id:'ledger',   label:'Ledger' },
    { id:'webhooks', label:'Webhooks' },
  ];
  return (
    <>
      <div className="drawer-overlay" onClick={onClose} />
      <div className="drawer">
        <div className="drawer-hdr">
          <div>
            <div className="drawer-title">{payment.id}</div>
            <div className="drawer-sub">{payment.customer.email} · EUR {payment.amount.toFixed(2)} · {payment.currency}</div>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-tabs">
          {TABS.map(t => (
            <div key={t.id} className={`dt${tab === t.id ? ' dt-on' : ''}`} onClick={() => onTabChange(t.id)}>{t.label}</div>
          ))}
        </div>
        <div className="drawer-body">
          {tab === 'detail'    && <DetailTab    p={payment} />}
          {tab === 'lifecycle' && <LifecycleTab p={payment} explanationStep={explanationStep} onStepClick={onStepClick} />}
          {tab === 'api'       && <ApiTab       p={payment} />}
          {tab === 'ledger'    && <LedgerTab    p={payment} />}
          {tab === 'webhooks'  && <WebhooksTab  p={payment} />}
        </div>
        <div className="drawer-footer">
          <button
            className="btn btn-ghost btn-sm btn-faux-dis"
            style={{opacity:0.4, cursor:'not-allowed'}}
            title="Capture not available in merchant UI"
          >Capture</button>
          <button
            className="btn btn-ghost btn-sm btn-faux-dis"
            style={{opacity:0.4, cursor:'not-allowed'}}
            title="Refund workflow pending"
          >Refund</button>
          {payment.dispute && (
            <button className="btn btn-ghost btn-sm btn-faux-dis" style={{opacity:0.4, cursor:'not-allowed'}} title="Dispute response in Disputes screen">
              Dispute Response
            </button>
          )}
          <button className="btn btn-ghost btn-sm" onClick={onClose}>Close</button>
        </div>
      </div>
    </>
  );
}

/* ── TIMELINE RAIL ── */
function TimelineRail({ expandedIdx, onExpand }) {
  return (
    <div className="tl-rail">
      <div className="tl-hdr">Activity &amp; Audit</div>
      <div className="tl-body">
        {TL_EVENTS.map((evt, i) => (
          <div key={i} className="tl-evt" onClick={() => onExpand(expandedIdx === i ? null : i)}>
            <div className="tl-spine">
              <div className={`tl-dot ${evt.dot}`} />
              {i < TL_EVENTS.length - 1 && <div className="tl-line" />}
            </div>
            <div className="tl-content">
              <div className="tl-ts">{evt.ts}</div>
              <div className="tl-name">{evt.name}</div>
              <div className="tl-actor">{evt.actor}</div>
              <div className="tl-desc">{evt.desc}</div>
              <div className="tl-audit">{evt.audit}</div>
              {expandedIdx !== i && <div className="tl-expand-hint">click to expand</div>}
              {expandedIdx === i && <div className="tl-meta">{evt.meta}</div>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [filters, setFilters]   = useState({ search:'', status:'all', currency:'all', apiKey:'All keys', failedOnly:false });
  const [selectedId, setSelectedId] = useState(null);
  const [drawerTab, setDrawerTab]   = useState('detail');
  const [copiedId, setCopiedId]     = useState(null);
  const [expandedTl, setExpandedTl] = useState(null);
  const [lcStep, setLcStep]         = useState(null);

  const filtered = PAYMENTS.filter(p => {
    if (filters.status !== 'all' && p.status !== filters.status) return false;
    if (filters.currency !== 'all' && filters.currency !== 'all' && p.currency.toLowerCase() !== filters.currency) return false;
    if (filters.apiKey !== 'All keys' && p.apiKeyPrefix !== filters.apiKey) return false;
    if (filters.failedOnly && !['failed','disputed','requires_payment_method','requires_capture'].includes(p.status)) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      return (
        p.id.toLowerCase().includes(q) ||
        p.customer.email.toLowerCase().includes(q) ||
        p.customer.name.toLowerCase().includes(q) ||
        p.requestId.toLowerCase().includes(q) ||
        p.idempotencyKey.toLowerCase().includes(q)
      );
    }
    return true;
  });

  function handleRowClick(id) {
    setSelectedId(id);
    setDrawerTab('detail');
    setLcStep(null);
  }
  function handleCopyId(id) {
    setCopiedId(id);
    setTimeout(() => setCopiedId(null), 2000);
  }
  function handleOpenApi(id) {
    setSelectedId(id);
    setDrawerTab('api');
  }
  function handleOpenEvents(id) {
    setSelectedId(id);
    setDrawerTab('webhooks');
  }

  const selectedPayment = PAYMENTS.find(p => p.id === selectedId);

  return (
    <>
      <Sidebar />
      <div className="main-wrap">
        <div className="page-hdr">
          <div className="page-bc">
            <span>Orbit Market</span>
            <span className="sep">›</span>
            <strong>Payments</strong>
            <span className="sep">·</span>
            <span style={{fontFamily:'var(--f-mono)', fontSize:11, color:'var(--t3)'}}>MRC-20491</span>
          </div>
          <div className="page-meta">
            <div className="env-badge"><div className="env-badge-dot"/>Local Sandbox</div>
            <Badge cls="b-inreview">KYB IN REVIEW</Badge>
            <div className="user-chip">
              <div className="user-avatar">NK</div>
              <span className="user-name">Nora Klein</span>
              <span style={{fontSize:10, color:'var(--t3)', marginLeft:2}}>Merchant Admin</span>
            </div>
            <span className="screen-id">MDB-UI-05</span>
          </div>
        </div>
        <div className="content-area">
          <div className="left-scroll">
            <StatusStrip payments={PAYMENTS} />
            <FilterWorkbar
              filters={filters}
              onChange={setFilters}
              count={filtered.length}
              total={PAYMENTS.length}
            />
            <PaymentsTable
              payments={filtered}
              selectedId={selectedId}
              onRowClick={handleRowClick}
              onCopyId={handleCopyId}
              copiedId={copiedId}
              onOpenApi={handleOpenApi}
              onOpenEvents={handleOpenEvents}
            />
            <div style={{height:14}} />
          </div>
          <TimelineRail expandedIdx={expandedTl} onExpand={setExpandedTl} />
        </div>
      </div>

      {selectedPayment && (
        <PaymentDrawer
          payment={selectedPayment}
          tab={drawerTab}
          onTabChange={setDrawerTab}
          onClose={() => setSelectedId(null)}
          explanationStep={lcStep}
          onStepClick={setLcStep}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
