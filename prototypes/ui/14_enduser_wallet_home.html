<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Wallet Home — UEW-UI-03</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --inp:     #faf9f7;
      --hover:   #f0efe9;

      --sb:        #111114;
      --sb-bdr:    #1e1e22;
      --sb-t:      #c8c8d4;
      --sb-muted:  #545460;
      --sb-hover:  #191920;
      --sb-active: #1e1e28;

      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;

      --t1: #1c1c1f;
      --t2: #575763;
      --t3: #9898a6;
      --t4: #d0d0da;

      --cta:     #1c1c1f;
      --cta-hov: #2e2e35;
      --cta-t:   #ffffff;

      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;

      --sb-env-bg:  #1a1030;
      --sb-env-t:   #b39cf0;
      --sb-env-bd:  #362566;

      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;

      --r:    3px;
      --r-lg: 5px;
      --w-sb: 220px;
      --w-tl: 244px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }

    #root { height: 100vh; display: flex; overflow: hidden; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 15px 15px 13px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14.5px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase;
      letter-spacing: 0.1em; margin-top: 4px; }
    .sb-nav   { flex: 1; padding: 10px 7px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 9px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 12px;
      cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.38; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; opacity: 1; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.6; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono);
      color: var(--sb-muted); opacity: 0.8; }
    .sb-div   { height: 1px; background: var(--sb-bdr); margin: 5px 0; }
    .sb-footer { padding: 10px 14px; border-top: 1px solid var(--sb-bdr); }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 10px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 4px; }
    .env-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host  { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* MAIN */
    .main-wrap    { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .page-hdr     { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .page-bc      { font-size: 12.5px; color: var(--t2); display: flex; align-items: center; gap: 5px; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep { color: var(--t3); }
    .page-bc .mode { font-family: var(--f-mono); font-size: 11.5px; color: var(--t2); }
    .page-meta    { display: flex; align-items: center; gap: 8px; }
    .screen-id    { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge    { font-size: 10px; font-family: var(--f-mono); color: var(--am);
      background: var(--am-bg); border: 1px solid var(--am-bd);
      padding: 2px 8px; border-radius: var(--r); display: flex; align-items: center; gap: 5px; }
    .env-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--am); }
    .user-chip    { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 3px;
      border: 1px solid var(--bdr); border-radius: 20px; background: var(--surf2); }
    .user-avatar  { width: 22px; height: 22px; border-radius: 50%; background: var(--cta);
      color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center;
      justify-content: center; letter-spacing: 0.03em; flex-shrink: 0; }
    .user-name    { font-size: 11.5px; color: var(--t2); font-weight: 500; }

    /* CONTENT */
    .content-area { flex: 1; display: flex; overflow: hidden; min-width: 0; }
    .left-scroll  { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 20px;
      background: var(--bg); display: flex; flex-direction: column; gap: 12px; }

    /* PANELS */
    .panel     { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; flex-shrink: 0; }
    .panel-hdr { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .panel-title { font-size: 11.5px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 13px 16px; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
      font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-active   { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-done     { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-pending  { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-limited  { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-action   { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-locked   { background: var(--hover); color: var(--t2);  border-color: var(--bdr); }
    .b-dev      { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-blocked  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-held     { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-enabled  { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-completed { background: var(--g-bg); color: var(--g);   border-color: var(--g-bd); }
    .b-recon    { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }

    /* KV */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 148px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center;
      gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11.5px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover:not(:disabled) { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); cursor: pointer; }
    .btn-ghost:hover:not(:disabled) { background: var(--hover); color: var(--t1); }
    .btn-danger  { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); cursor: pointer; }
    .btn-sm      { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-warn    { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); cursor: pointer; }
    .btn-warn:hover { background: #fef3c7; }

    /* ALERTS */
    .alert { display: flex; gap: 10px; padding: 9px 12px 9px 13px; font-size: 12px;
      line-height: 1.55; border-left-width: 3px; border-left-style: solid; }
    .alert-icon { flex-shrink: 0; font-style: normal; font-size: 11px;
      margin-top: 1px; font-weight: 600; }
    .alert-warn { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-red  { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-info { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-green { background: var(--g-bg); border-left-color: var(--g); color: #14532d; }

    /* TABLES */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--bdr); background: var(--surf2); font-weight: 600; }
    .data-table td { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--hover);
      vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: var(--hover); cursor: pointer; }
    .mono-cell { font-family: var(--f-mono); font-size: 11px; }
    .amt-credit { color: var(--g); font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; }
    .amt-debit  { color: var(--rd); font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; }
    .amt-zero   { color: var(--t3); font-family: var(--f-mono); font-size: 11.5px; }

    /* LIMITS TABLE */
    .lim-table { width: 100%; border-collapse: collapse; }
    .lim-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); padding: 6px 12px; text-align: left;
      border-bottom: 1px solid var(--bdr); background: var(--surf2); font-weight: 600; }
    .lim-table td { padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--hover);
      vertical-align: middle; }
    .lim-table tr:last-child td { border-bottom: none; }
    .lim-table tbody tr:hover td { background: var(--hover); cursor: pointer; }

    /* PENDING OPS */
    .pending-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid var(--hover); transition: background 0.1s; }
    .pending-item:last-child { border-bottom: none; }
    .pending-item:hover { background: var(--hover); }
    .pending-main { flex: 1; min-width: 0; }
    .pending-desc { font-size: 12px; color: var(--t1); font-weight: 500; margin-bottom: 2px; }
    .pending-meta { font-size: 10.5px; color: var(--t3); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; }
    .pending-action { font-size: 10.5px; color: var(--am); margin-top: 3px; }
    .pending-amount { font-family: var(--f-mono); font-size: 12px; color: var(--t1);
      font-weight: 500; white-space: nowrap; flex-shrink: 0; padding-top: 1px; }

    /* BALANCE GRID */
    .balance-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: var(--bdr); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; }
    .balance-cell { background: var(--surface); padding: 12px 14px; }
    .balance-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); font-weight: 600; margin-bottom: 4px; }
    .balance-amount { font-size: 22px; font-weight: 600; font-family: var(--f-mono);
      letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 3px; }
    .balance-sub { font-size: 10.5px; color: var(--t3); }
    .bal-avail  { color: var(--g); }
    .bal-pending { color: var(--am); }
    .bal-held   { color: var(--or); }
    .bal-total  { color: var(--t1); }

    /* PROGRESS BARS */
    .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .progress-label { font-size: 11px; color: var(--t2); min-width: 130px; flex-shrink: 0; }
    .progress-bar-wrap { flex: 1; height: 6px; background: var(--hover);
      border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .progress-nums { font-size: 10.5px; font-family: var(--f-mono); color: var(--t3);
      min-width: 80px; text-align: right; flex-shrink: 0; }
    .progress-blocked { font-size: 10.5px; color: var(--rd); font-weight: 600;
      font-family: var(--f-mono); min-width: 80px; text-align: right; flex-shrink: 0; }

    /* RECON STRIP */
    .recon-strip { display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      background: var(--g-bg); border: 1px solid var(--g-bd); border-radius: var(--r);
      font-size: 11px; color: #14532d; font-family: var(--f-mono); flex-wrap: wrap; }

    /* ACTIONS ROW */
    .actions-row { display: flex; align-items: center; gap: 8px; padding: 13px 16px; flex-wrap: wrap; }
    .actions-info { padding: 0 16px 12px; }

    /* WITHDRAW BLOCKED PANEL */
    .withdraw-blocked { margin: 0 16px 12px; background: var(--rd-bg);
      border: 1px solid var(--rd-bd); border-left: 3px solid var(--rd);
      border-radius: var(--r-lg); overflow: hidden; }
    .wb-hdr { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-bottom: 1px solid var(--rd-bd); }
    .wb-title { font-size: 12px; font-weight: 600; color: var(--rd); }
    .wb-body  { padding: 10px 14px; font-size: 12px; color: #7f1d1d; }
    .wb-list  { margin: 6px 0 0 12px; }
    .wb-list li { margin-bottom: 3px; }
    .wb-foot  { padding: 8px 14px; border-top: 1px solid var(--rd-bd);
      display: flex; align-items: center; justify-content: space-between; }

    /* TIMELINE RAIL */
    .tl-rail  { width: var(--w-tl); flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .tl-hdr   { padding: 10px 14px; border-bottom: 1px solid var(--bdr); flex-shrink: 0;
      font-size: 9.5px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.1em; }
    .tl-body  { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .tl-evt   { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--hover); }
    .tl-evt:last-child { border-bottom: none; }
    .tl-spine { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .tl-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .tl-dot.ok   { background: var(--g); }
    .tl-dot.pend { background: var(--am); }
    .tl-dot.bad  { background: var(--rd); }
    .tl-dot.pu   { background: var(--pu); }
    .tl-line  { width: 1px; flex: 1; background: var(--bdr); margin: 4px 0; min-height: 12px; }
    .tl-content { flex: 1; min-width: 0; }
    .tl-ts    { font-size: 9.5px; font-family: var(--f-mono); color: var(--t3); margin-bottom: 1px; }
    .tl-name  { font-size: 11px; font-weight: 600; color: var(--t1); margin-bottom: 1px;
      text-transform: uppercase; letter-spacing: 0.04em; }
    .tl-actor { font-size: 10px; color: var(--t3); margin-bottom: 2px; }
    .tl-desc  { font-size: 10.5px; color: var(--t2); line-height: 1.4; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,20,0.52);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal     { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); width: 490px; max-width: 100%; max-height: 88vh;
      display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08); }
    .modal-wide { width: 520px; }
    .modal-hdr { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--bdr); flex-shrink: 0;
      background: var(--surf2); }
    .modal-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .modal-sub   { font-size: 11px; color: var(--t3); margin-top: 2px; }
    .modal-close { width: 24px; height: 24px; border-radius: var(--r); background: transparent;
      border: none; color: var(--t3); cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.1s, color 0.1s; flex-shrink: 0; margin-top: 1px; }
    .modal-close:hover { background: var(--hover); color: var(--t1); }
    .modal-body   { flex: 1; overflow-y: auto; padding: 16px; display: flex;
      flex-direction: column; gap: 12px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--bdr); display: flex;
      gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .modal-note   { font-size: 10.5px; color: var(--t3); margin-left: auto; font-style: italic; }

    /* FORM INPUTS */
    .inp-label { font-size: 11px; color: var(--t2); margin-bottom: 4px; font-weight: 500;
      display: block; }
    .inp-field { width: 100%; padding: 7px 10px; border: 1px solid var(--bdr-mid);
      border-radius: var(--r); font-size: 12.5px; color: var(--t1);
      background: var(--inp); outline: none; font-family: var(--f-ui);
      transition: border-color 0.12s; }
    .inp-field:focus { border-color: var(--bdr-focus); }
    select.inp-field { cursor: pointer; }
    .form-group { display: flex; flex-direction: column; }
    .inp-prefix-wrap { display: flex; align-items: stretch; }
    .inp-prefix { padding: 7px 10px; background: var(--surf2); border: 1px solid var(--bdr-mid);
      border-right: none; border-radius: var(--r) 0 0 var(--r); font-size: 12px;
      color: var(--t3); font-family: var(--f-mono); display: flex; align-items: center; }
    .inp-prefix + .inp-field { border-radius: 0 var(--r) var(--r) 0; }

    /* LEDGER ENTRIES */
    .ledger-entry { display: grid; grid-template-columns: 1fr 1fr auto auto;
      gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--hover);
      font-size: 11px; align-items: center; }
    .ledger-entry:last-child { border-bottom: none; }
    .ledger-entry .le-acct { font-family: var(--f-mono); color: var(--t2); }
    .ledger-entry .le-amt  { font-family: var(--f-mono); font-weight: 500; text-align: right; }
    .ledger-entry .le-type { color: var(--t3); text-align: right; }

    /* MISC */
    .grid2    { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .link-btn { background: none; border: none; color: var(--am); font-size: 11px;
      font-family: var(--f-ui); cursor: pointer; text-decoration: underline;
      text-underline-offset: 2px; padding: 0; }
    .link-btn:hover { color: var(--cta); }
    .link-btn-sm { font-size: 11.5px; }
    .sandbox-note { font-size: 10px; color: var(--t3); font-family: var(--f-mono);
      padding: 4px 9px; background: var(--surf2); border: 1px solid var(--bdr);
      border-radius: var(--r); }
    .section-note { font-size: 10.5px; color: var(--t3); }

const KV = ({ k, mono, children }) => (

/* ── MODAL SHELL ────────────────────────────────────────────────────── */
const Modal = ({ title, subtitle, wide, onClose, footer, children }) => (
  <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
    <div className={`modal${wide ? ' modal-wide' : ''}`}>
      <div className="modal-hdr">
        <div>

);

/* ── DEPOSIT MODAL ──────────────────────────────────────────────────── */
const DepositModal = ({ onClose }) => {
  const [amount, setAmount] = useState('');
  const [ref, setRef] = useState('');
  const [sof, setSof] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const handleSubmit = () => {
    if (!amount) return;
    setSubmitted(true);
  };

  return (
    <Modal
      title="Request Deposit"
      subtitle="Manual deposit — operator review required"
      onClose={onClose}
      footer={!submitted ? (
        <>
          <button className="btn btn-primary" onClick={handleSubmit}>Submit Deposit Request</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <span className="modal-note">Funds are not credited immediately.</span>
        </>
      ) : (
        <>
          <button className="btn btn-ghost" onClick={onClose}>Close</button>
          <span style={{ fontSize: 11, color: 'var(--g)', marginLeft: 8 }}>Request submitted — awaiting operator review.</span>
        </>
      )}
    >
      {!submitted ? (
        <>
          <div className="alert alert-info" style={{ borderRadius: 'var(--r)' }}>
            <div>
              <div style={{ fontWeight: 600, marginBottom: 3, fontSize: 11.5 }}>Daily Deposit Limit</div>
              <div>Current limit: <strong>EUR 1,000/day</strong> · Used today: EUR 250 · Remaining: <strong>EUR 750</strong></div>
            </div>
          </div>
          <div className="alert alert-warn" style={{ borderRadius: 'var(--r)' }}>
            Deposits above EUR 500 require source of funds documentation. A compliance review may be triggered.
          </div>
          <div className="form-group">
            <label className="inp-label">Amount (EUR)</label>
            <div className="inp-prefix-wrap">
              <span className="inp-prefix">EUR</span>
              <input className="inp-field" type="number" placeholder="0.00" min="1" max="750"
                value={amount} onChange={e => setAmount(e.target.value)} />
            </div>
          </div>
          <div className="form-group">
            <label className="inp-label">Reference (optional)</label>
            <input className="inp-field" type="text" placeholder="e.g. Invoice #1234"
              value={ref} onChange={e => setRef(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="inp-label">Source of Funds</label>
            <select className="inp-field" value={sof} onChange={e => setSof(e.target.value)}>
              <option value="">Select source...</option>
              <option>Salary / Employment income</option>
              <option>Personal savings</option>
              <option>Business income</option>
              <option>Investment proceeds</option>
              <option>Other</option>
            </select>
          </div>
          <div style={{ fontSize: 10.5, color: 'var(--t3)', fontFamily: 'var(--f-mono)' }}>
            Request ref: DEP-{Math.floor(10000 + Math.random() * 90000)} · Wallet: WLT-EU-77820
          </div>
        </>
      ) : (
        <div className="alert alert-green" style={{ borderRadius: 'var(--r)', gap: 10 }}>
          <IcoCheck />
          <div>
            <div style={{ fontWeight: 600, marginBottom: 3 }}>Deposit Request Submitted</div>
            <div>Amount: EUR {parseFloat(amount || 0).toFixed(2)} · Status: PENDING OPERATOR REVIEW</div>
            <div style={{ marginTop: 4, fontSize: 10.5, fontFamily: 'var(--f-mono)', color: 'var(--t3)' }}>
              You will be notified when the operator processes this request.
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
};

/* ── TRANSFER MODAL ─────────────────────────────────────────────────── */
const TransferModal = ({ onClose }) => {
  const [recipient, setRecipient] = useState('');
  const [amount, setAmount] = useState('');
  const [note, setNote] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const recipientStatus = recipient === 'EU-10831' ? 'unverified' :
                          recipient.length > 4     ? 'checking'   : null;

  return (
    <Modal
      title="Send Transfer"
      subtitle="Internal transfer between MiniFin wallets"
      onClose={onClose}
      footer={!submitted ? (
        <>
          <button className="btn btn-primary" onClick={() => amount && recipient && setSubmitted(true)}>
            Submit Transfer
          </button>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        </>
      ) : (
        <button className="btn btn-ghost" onClick={onClose}>Close</button>
      )}
    >
      {!submitted ? (
        <>
          <div className="alert alert-warn" style={{ borderRadius: 'var(--r)' }}>
            <IcoWarn />
            <div>Transfers are only permitted to verified MiniFin wallet recipients. Unverified transfers are held pending recipient verification and may be delayed.</div>
          </div>
          <div className="form-group">
            <label className="inp-label">Recipient Wallet / User ID</label>
            <input className="inp-field" type="text" placeholder="EU-XXXXX or WLT-EU-XXXXX"
              value={recipient} onChange={e => setRecipient(e.target.value)} />
            {recipientStatus === 'unverified' && (
              <div style={{ marginTop: 5, fontSize: 11, color: 'var(--or)', display: 'flex', gap: 5, alignItems: 'center' }}>
                <IcoWarn /> Recipient EU-10831 (J. Hofer) — verification pending. Transfer will be held.
              </div>
            )}
            {recipientStatus === 'checking' && recipient !== 'EU-10831' && (
              <div style={{ marginTop: 5, fontSize: 11, color: 'var(--g)', display: 'flex', gap: 5, alignItems: 'center' }}>
                <IcoCheck /> Recipient found — verified wallet user.
              </div>
            )}
          </div>
          <div className="form-group">
            <label className="inp-label">Amount (EUR)</label>
            <div className="inp-prefix-wrap">
              <span className="inp-prefix">EUR</span>
              <input className="inp-field" type="number" placeholder="0.00"
                value={amount} onChange={e => setAmount(e.target.value)} />
            </div>
          </div>
          <div className="form-group">
            <label className="inp-label">Note (optional)</label>
            <input className="inp-field" type="text" placeholder="Payment reference or note"
              value={note} onChange={e => setNote(e.target.value)} />
          </div>
          <div style={{ fontSize: 10.5, color: 'var(--t3)' }}>
            Available for transfer: <strong style={{ fontFamily: 'var(--f-mono)' }}>EUR 842.50</strong>
            {' · '}Transfers to verified recipients are processed within minutes.
          </div>
        </>
      ) : (
        <div className="alert alert-green" style={{ borderRadius: 'var(--r)', gap: 10 }}>
          <IcoCheck />
          <div>
            <div style={{ fontWeight: 600, marginBottom: 3 }}>Transfer Submitted</div>
            <div>EUR {parseFloat(amount || 0).toFixed(2)} → {recipient}</div>
            <div style={{ marginTop: 4, fontSize: 10.5, color: 'var(--t3)', fontFamily: 'var(--f-mono)' }}>
              {recipientStatus === 'unverified' ? 'Transfer held — awaiting recipient verification.' : 'Transfer processing — funds will arrive shortly.'}
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
};

          <div><strong>Hold / Block Reason:</strong> {tx.holdReason}</div>

        <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em',

          gridTemplateColumns: '1fr 1fr auto auto', gap: 6,
          padding: '4px 0 6px', borderBottom: '1px solid var(--bdr)',
