<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — App Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --inp:     #faf9f7;
      --hover:   #f0efe9;
      --sb:        #111114;
      --sb-bdr:    #1e1e22;
      --sb-t:      #c8c8d4;
      --sb-muted:  #545460;
      --sb-hover:  #191920;
      --sb-active: #1e1e28;
      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;
      --t1: #1c1c1f;  --t2: #575763;  --t3: #9898a6;  --t4: #d0d0da;
      --cta:     #1c1c1f;  --cta-hov: #2e2e35;  --cta-t: #ffffff;
      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;
      --bl:   #1e40af;  --bl-bg:#eff6ff;  --bl-bd:#bfdbfe;
      --sb-env-bg:  #1a1030;
      --sb-env-t:   #b39cf0;
      --sb-env-bd:  #362566;
      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;
      --r:    3px;  --r-lg: 5px;
      --w-sb: 216px;  --w-au: 260px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }

    #root { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* ── SURFACE BAR ── */
    .surf-bar { display: flex; align-items: center; gap: 16px; padding: 0 16px;
      height: 38px; flex-shrink: 0; background: var(--surf2);
      border-bottom: 1px solid var(--bdr); }
    .surf-bar-title { font-size: 11px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .surf-bar-divider { width: 1px; height: 18px; background: var(--bdr); flex-shrink: 0; }
    .surf-btns { display: flex; gap: 2px; }
    .surf-btn { padding: 4px 11px; border-radius: var(--r); font-size: 11.5px;
      font-weight: 500; color: var(--t3); cursor: pointer; border: 1px solid transparent;
      user-select: none; transition: all 0.1s; font-family: var(--f-ui);
      display: flex; align-items: center; gap: 6px; }
    .surf-btn:hover { color: var(--t2); background: var(--hover); }
    .surf-btn.active { color: var(--t1); background: var(--surface);
      border-color: var(--bdr-mid); }
    .surf-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.5; }
    .surf-btn.active .surf-dot { opacity: 1; }
    .surf-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* ── SHELL AREA ── */
    .shell { flex: 1; display: flex; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 13px 14px 11px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9px; color: var(--sb-muted); text-transform: uppercase;
      letter-spacing: 0.1em; margin-top: 4px; }
    .sb-nav  { flex: 1; padding: 8px 6px; overflow-y: auto; }
    .nav-sec { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 8px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 7px; padding: 5.5px 8px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 11.5px;
      cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.33; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; opacity: 1; }
    .nav-item.warn-item { color: #c4963a; opacity: 1; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.6; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono);
      color: var(--sb-muted); opacity: 0.7; }
    .nav-badge-sm { margin-left: auto; font-size: 8.5px; font-family: var(--f-mono);
      font-weight: 600; padding: 1px 4px; border-radius: 2px; }
    .nav-badge-warn { background: #3a2800; color: #c4963a; }
    .nav-badge-err  { background: #2a0a0a; color: #d87272; }
    .sb-div  { height: 1px; background: var(--sb-bdr); margin: 5px 0; }
    .sb-footer { padding: 9px 13px; border-top: 1px solid var(--sb-bdr); }
    .sb-user-name  { font-size: 11.5px; font-weight: 500; color: #c8c8d4; margin-bottom: 1px; }
    .sb-user-role  { font-size: 9.5px; font-family: var(--f-mono); color: var(--sb-muted); margin-bottom: 7px; }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 9.5px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 3px; }
    .env-dot   { width: 4px; height: 4px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.8; }
    .env-host  { font-size: 9.5px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* ── MAIN ── */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .page-hdr { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 20px; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .page-bc  { font-size: 12px; color: var(--t2); display: flex; align-items: center; gap: 5px; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep   { color: var(--t3); }
    .page-bc .mode  { font-family: var(--f-mono); font-size: 11px; color: var(--t2); }
    .page-meta { display: flex; align-items: center; gap: 8px; }
    .screen-id { font-size: 9.5px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge { font-size: 9.5px; font-family: var(--f-mono); color: var(--am);
      background: var(--am-bg); border: 1px solid var(--am-bd);
      padding: 2px 7px; border-radius: var(--r); display: flex; align-items: center; gap: 4px; }
    .env-badge-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--am); }
    .user-chip { display: flex; align-items: center; gap: 6px; padding: 3px 9px;
      border: 1px solid var(--bdr); border-radius: var(--r); background: var(--surf2);
      font-size: 11px; color: var(--t2); }
    .user-chip-role { font-family: var(--f-mono); font-size: 10px; color: var(--t3); }
    .main-body { flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--bg); }

    /* ── MODE TABS ── */
    .mode-tabs { display: flex; border-bottom: 1px solid var(--bdr); margin-bottom: 16px; }
    .mode-tab  { padding: 6px 14px; font-size: 12px; font-weight: 500; color: var(--t3);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
      white-space: nowrap; user-select: none; transition: color 0.12s, border-color 0.12s; }
    .mode-tab:hover  { color: var(--t2); }
    .mode-tab.active { color: var(--t1); border-bottom-color: var(--t1); }

    /* ── PANELS ── */
    .panel      { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; }
    .panel-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 8px 13px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .panel-title { font-size: 11px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 13px 15px; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 13px; border-radius: var(--r); font-size: 12px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover { background: var(--hover); color: var(--t1); }
    .btn-sm      { padding: 4px 10px; font-size: 11px; }
    .btn-xs      { padding: 3px 8px; font-size: 10.5px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-warn    { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .btn-err     { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }

    /* ── ALERTS ── */
    .alert { display: flex; gap: 9px; padding: 9px 11px 9px 12px; font-size: 11.5px;
      line-height: 1.55; border-radius: 0 var(--r) var(--r) 0; border-left-width: 3px;
      border-left-style: solid; }
    .alert-icon { flex-shrink: 0; font-style: normal; font-size: 11px;
      margin-top: 1px; font-weight: 600; }
    .alert-err  { background: var(--rd-bg); border-left-color: var(--rd);  color: #7f1d1d; }
    .alert-ok   { background: var(--g-bg);  border-left-color: var(--g);   color: #14532d; }
    .alert-warn { background: var(--am-bg); border-left-color: var(--am);  color: #78350f; }
    .alert-info { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-dev  { background: var(--pu-bg); border-left-color: var(--pu);  color: #4c1d95; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 5px; border-radius: 2px;
      font-size: 9px; font-weight: 600; letter-spacing: 0.07em;
      font-family: var(--f-mono); border: 1px solid transparent; }
    .b-active     { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-notstarted { background: var(--hover); color: var(--t2);  border-color: var(--bdr); }
    .b-locked     { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-pending    { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-inreview   { background: var(--bl-bg); color: var(--bl);  border-color: var(--bl-bd); }
    .b-401        { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-403        { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-dev        { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-low        { background: var(--bl-bg); color: var(--bl);  border-color: var(--bl-bd); }
    .b-medium     { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-high       { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-critical   { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-readaudit  { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-operator   { background: var(--bl-bg); color: var(--bl);  border-color: var(--bl-bd); }
    .b-compliance { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }

    /* ── KV TABLE ── */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 4.5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 10.5px; color: var(--t3); min-width: 140px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center;
      gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11px; }

    /* ── STAT CARDS ── */
    .stat-row { display: grid; gap: 10px; margin-bottom: 16px; }
    .stat-row-3 { grid-template-columns: repeat(3, 1fr); }
    .stat-row-6 { grid-template-columns: repeat(6, 1fr); }
    .stat-card { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); padding: 11px 13px; }
    .stat-card.locked-card { opacity: 0.42; background: var(--surf2); }
    .stat-num  { font-size: 22px; font-weight: 600; font-family: var(--f-mono);
      color: var(--t1); line-height: 1.1; letter-spacing: -0.02em; }
    .stat-num.lock-num { font-size: 14px; color: var(--t4); }
    .stat-lbl  { font-size: 10px; color: var(--t3); margin-top: 4px;
      text-transform: uppercase; letter-spacing: 0.07em; }
    .stat-sub  { font-size: 10px; color: var(--t4); margin-top: 2px;
      font-family: var(--f-mono); }

    /* ── QUEUE TABLE ── */
    .q-wrap { overflow-x: auto; border: 1px solid var(--bdr); border-radius: var(--r-lg);
      background: var(--surface); }
    .q-table { width: 100%; border-collapse: collapse; }
    .q-thead { background: var(--surf2); }
    .q-th { padding: 7px 12px; font-size: 9.5px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.07em; text-align: left;
      border-bottom: 1px solid var(--bdr); white-space: nowrap; }
    .q-td { padding: 8px 12px; font-size: 12px; color: var(--t1);
      border-bottom: 1px solid var(--hover); vertical-align: middle; }
    .q-td.mono { font-family: var(--f-mono); font-size: 11px; color: var(--t2); }
    .q-row:last-child .q-td { border-bottom: none; }
    .q-row:hover .q-td { background: var(--hover); }
    .q-row-locked .q-td { opacity: 0.38; cursor: not-allowed; }
    .q-row-locked:hover .q-td { background: transparent; }
    .q-actions { display: flex; gap: 5px; align-items: center; }

    /* ── ROLE SWITCHER ── */
    .role-sw { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r-lg);
      margin-bottom: 14px; }
    .role-sw-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--t3); font-weight: 600; white-space: nowrap; }
    .role-sw-btns { display: flex; gap: 4px; }
    .role-sw-btn { padding: 4px 11px; border-radius: var(--r); font-size: 11.5px;
      font-weight: 500; cursor: pointer; border: 1px solid var(--bdr-mid);
      background: var(--surface); color: var(--t3); font-family: var(--f-ui);
      display: flex; align-items: center; gap: 6px; transition: all 0.1s; }
    .role-sw-btn.active-op { background: var(--bl-bg); color: var(--bl);
      border-color: var(--bl-bd); }
    .role-sw-btn.active-co { background: var(--pu-bg); color: var(--pu);
      border-color: var(--pu-bd); }
    .role-note { font-size: 10.5px; color: var(--t3); margin-left: auto; }

    /* ── FEATURE GATE ── */
    .feat-gate { display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 20px; text-align: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); }
    .feat-gate-code { font-size: 28px; font-weight: 600; font-family: var(--f-mono);
      color: var(--t4); line-height: 1; }
    .feat-gate-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .feat-gate-desc { font-size: 12px; color: var(--t2); max-width: 340px; line-height: 1.55; }

    /* ── BALANCE ── */
    .balance-block { padding: 18px 20px; display: flex; align-items: flex-end; gap: 8px; }
    .balance-num { font-size: 32px; font-weight: 600; font-family: var(--f-mono);
      color: var(--t1); letter-spacing: -0.03em; line-height: 1; }
    .balance-cur { font-size: 14px; font-weight: 500; color: var(--t3);
      margin-bottom: 4px; font-family: var(--f-mono); }

    /* ── ACTION ROW ── */
    .action-row { display: flex; gap: 8px; padding: 12px 15px;
      border-top: 1px solid var(--bdr); flex-wrap: wrap; }
    .action-btn { display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 8px 14px; border-radius: var(--r); cursor: pointer;
      border: 1px solid var(--bdr-mid); background: var(--surface);
      font-family: var(--f-ui); transition: background 0.1s; }
    .action-btn:hover { background: var(--hover); }
    .action-btn.locked-btn { opacity: 0.35; cursor: not-allowed; }
    .action-btn-label { font-size: 11px; font-weight: 500; color: var(--t1); }
    .action-btn-sub   { font-size: 9.5px; color: var(--t3); }

    /* ── CHECKLIST ── */
    .checklist   { display: flex; flex-direction: column; }
    .check-item  { display: flex; align-items: flex-start; gap: 10px;
      padding: 6px 0; border-bottom: 1px solid var(--bdr); }
    .check-item:last-child { border-bottom: none; }
    .check-dot   { width: 15px; height: 15px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 8px;
      flex-shrink: 0; margin-top: 2px; }
    .check-dot.done   { background: var(--g-bg); color: var(--g); border: 1px solid var(--g-bd); }
    .check-dot.later  { background: var(--hover); color: var(--t3); border: 1px solid var(--bdr); }
    .check-dot.locked { background: var(--hover); color: var(--t4); border: 1px solid var(--bdr); }
    .check-lbl   { font-size: 12px; font-weight: 500; color: var(--t1); }
    .check-lbl.dim { color: var(--t3); font-weight: 400; }
    .check-desc  { font-size: 10.5px; color: var(--t3); margin-top: 1px; }

    /* ── DENIED ── */
    .denied-code { font-size: 32px; font-weight: 600; font-family: var(--f-mono); line-height: 1; }
    .code-401 { color: var(--rd); }
    .code-403 { color: var(--or); }

    /* ── SUBSTATE SWITCHER ── */
    .sub-sw  { display: flex; gap: 5px; margin-bottom: 13px; flex-wrap: wrap; }
    .sub-btn { padding: 4px 9px; border-radius: var(--r); font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--bdr-mid); background: var(--surface);
      color: var(--t3); transition: all 0.1s; font-family: var(--f-ui); }
    .sub-btn:hover { color: var(--t2); background: var(--hover); }
    .sub-btn.active { background: var(--cta); color: #fff; border-color: var(--cta); }
    .sub-btn.err-s  { color: var(--rd); border-color: var(--rd-bd); background: var(--rd-bg); }
    .sub-btn.err-s.active { background: var(--rd); color: #fff; border-color: var(--rd); }

    /* ── AUDIT RAIL ── */
    .audit-rail { width: var(--w-au); flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .audit-hdr  { padding: 9px 13px; border-bottom: 1px solid var(--bdr);
      font-size: 9px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.1em; }
    .audit-body { flex: 1; overflow-y: auto; padding: 11px 13px; }
    .audit-sec  { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--t3); margin-bottom: 6px; margin-top: 2px; }
    .audit-evt  { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .audit-evt:last-child { border-bottom: none; }
    .audit-dot  { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .audit-dot.ok   { background: var(--g); }
    .audit-dot.pend { background: var(--am); }
    .audit-dot.bad  { background: var(--rd); }
