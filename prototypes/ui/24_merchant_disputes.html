<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Disputes — MDB-UI-07</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#eceae5; --surface:#ffffff; --surf2:#f7f6f3; --inp:#faf9f7; --hover:#f0efe9;
      --sb:#111114; --sb-bdr:#1e1e22; --sb-muted:#545460; --sb-active:#1e1e28;
      --bdr:#dddad2; --bdr-mid:#c5c2ba; --bdr-focus:#1c1c1f;
      --t1:#1c1c1f; --t2:#575763; --t3:#9898a6; --t4:#d0d0da;
      --cta:#1c1c1f; --cta-hov:#2e2e35; --cta-t:#ffffff;
      --g:#166534;  --g-bg:#f0fdf4;  --g-bd:#bbf7d0;
      --am:#854d0e; --am-bg:#fffbeb; --am-bd:#fde68a;
      --rd:#9b1c1c; --rd-bg:#fef2f2; --rd-bd:#fecaca;
      --or:#b45309; --or-bg:#fff7ed; --or-bd:#fed7aa;
      --pu:#5b21b6; --pu-bg:#f5f3ff; --pu-bd:#ddd6fe;
      --bl:#1d4ed8; --bl-bg:#eff6ff; --bl-bd:#bfdbfe;
      --sb-env-bg:#1a1030; --sb-env-t:#b39cf0; --sb-env-bd:#362566;
      --f-ui:'IBM Plex Sans',sans-serif; --f-mono:'IBM Plex Mono',monospace;
      --r:3px; --r-lg:5px; --w-sb:220px; --w-tl:256px;
    }
    html,body { height:100%; background:var(--bg); color:var(--t1); font-family:var(--f-ui); font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    #root { width:100%; height:100vh; display:flex; overflow:hidden; }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--bdr-mid); border-radius:2px; }

    /* SIDEBAR */
    .sidebar { width:var(--w-sb); flex-shrink:0; background:var(--sb); border-right:1px solid var(--sb-bdr); display:flex; flex-direction:column; overflow:hidden; }
    .sb-brand { padding:14px 14px 12px; border-bottom:1px solid var(--sb-bdr); }
    .sb-mark  { display:flex; align-items:center; gap:9px; }
    .sb-name  { font-size:14.5px; font-weight:600; color:#eaeaf4; letter-spacing:-0.01em; }
    .sb-sub   { font-size:9.5px; color:var(--sb-muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:3px; }
    .sb-merchant { margin-top:10px; padding:7px 9px; background:rgba(255,255,255,0.04); border-radius:var(--r); border:1px solid var(--sb-bdr); }
    .sb-m-label { font-size:9px; color:var(--sb-muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:3px; }
    .sb-m-name  { font-size:12.5px; font-weight:600; color:#eaeaf4; }
    .sb-m-id    { font-size:10px; color:var(--sb-muted); font-family:var(--f-mono); margin-top:1px; }
    .sb-nav   { flex:1; padding:10px 7px; overflow-y:auto; }
    .nav-sec  { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--sb-muted); padding:4px 9px 5px; margin-top:4px; }
    .nav-item { display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:var(--r); color:var(--sb-muted); font-size:12px; cursor:default; user-select:none; transition:background 0.1s; }
    .nav-item.locked  { opacity:0.35; }
    .nav-item.current { background:var(--sb-active); color:#e0e0ec; }
    .nav-lock { margin-left:auto; font-size:9px; opacity:0.6; }
    .nav-id   { margin-left:auto; font-size:9px; font-family:var(--f-mono); color:var(--sb-muted); opacity:0.8; }
    .nav-item.current .nav-id { color:#7c6ff7; opacity:1; }
    .sb-footer { padding:10px 14px; border-top:1px solid var(--sb-bdr); }
    .env-chip  { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:var(--r); background:var(--sb-env-bg); border:1px solid var(--sb-env-bd); font-size:10px; color:var(--sb-env-t); font-family:var(--f-mono); margin-bottom:4px; }
    .env-dot   { width:5px; height:5px; border-radius:50%; background:var(--sb-env-t); opacity:0.7; }
    .env-host  { font-size:10px; color:var(--sb-muted); font-family:var(--f-mono); }
    .sb-user   { display:flex; align-items:center; gap:7px; margin-top:9px; }
    .sb-avatar { width:24px; height:24px; border-radius:50%; background:#5b21b6; color:#fff; font-size:9px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sb-uname  { font-size:11px; font-weight:500; color:#eaeaf4; }
    .sb-urole  { font-size:9.5px; color:var(--sb-muted); text-transform:uppercase; letter-spacing:0.05em; }

    /* MAIN */
    .main-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
    .page-hdr  { display:flex; align-items:center; justify-content:space-between; padding:10px 22px; border-bottom:1px solid var(--bdr); background:var(--surface); flex-shrink:0; gap:10px; flex-wrap:wrap; }
    .page-bc   { font-size:12.5px; color:var(--t2); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .page-bc strong { color:var(--t1); font-weight:500; }
    .page-bc .sep   { color:var(--t3); }
    .page-meta { display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; }
    .screen-id { font-size:10px; font-family:var(--f-mono); color:var(--t3); padding:2px 6px; border:1px solid var(--bdr); border-radius:var(--r); }
    .env-badge { font-size:10px; font-family:var(--f-mono); color:var(--am); background:var(--am-bg); border:1px solid var(--am-bd); padding:2px 8px; border-radius:var(--r); display:flex; align-items:center; gap:5px; }
    .env-badge-dot { width:5px; height:5px; border-radius:50%; background:var(--am); }
    .user-chip { display:flex; align-items:center; gap:7px; padding:3px 9px 3px 3px; border:1px solid var(--bdr); border-radius:20px; background:var(--surf2); }
    .user-avatar { width:22px; height:22px; border-radius:50%; background:#5b21b6; color:#fff; font-size:9px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .user-name { font-size:11.5px; color:var(--t2); font-weight:500; }

    /* CONTENT */
    .content-area { flex:1; display:flex; overflow:hidden; }
    .left-scroll  { flex:1; overflow-y:auto; padding:14px 18px; background:var(--bg); display:flex; flex-direction:column; gap:11px; min-width:0; }

    /* PANELS */
    .panel    { background:var(--surface); border:1px solid var(--bdr); border-radius:var(--r-lg); overflow:hidden; flex-shrink:0; }
    .panel-hdr{ display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-bottom:1px solid var(--bdr); background:var(--surf2); flex-shrink:0; flex-wrap:wrap; gap:8px; }
    .panel-title { font-size:11.5px; font-weight:600; color:var(--t1); text-transform:uppercase; letter-spacing:0.04em; }
    .panel-body  { padding:13px 16px; }

    /* BADGES */
    .badge { display:inline-flex; align-items:center; padding:2px 6px; border-radius:2px; font-size:9.5px; font-weight:600; letter-spacing:0.07em; font-family:var(--f-mono); border:1px solid transparent; white-space:nowrap; }
    .b-needs-resp { background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
    .b-under-rev  { background:var(--bl-bg); color:var(--bl); border-color:var(--bl-bd); }
    .b-won        { background:var(--g-bg); color:var(--g); border-color:var(--g-bd); }
    .b-lost       { background:var(--rd-bg); color:var(--rd); border-color:var(--rd-bd); }
    .b-accepted   { background:var(--hover); color:var(--t2); border-color:var(--bdr-mid); }
    .b-hold-active   { background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
    .b-hold-released { background:var(--g-bg); color:var(--g); border-color:var(--g-bd); }
    .b-hold-captured { background:var(--rd-bg); color:var(--rd); border-color:var(--rd-bd); }
    .b-due-soon   { background:#fffbeb; color:#854d0e; border-color:#fde68a; }
    .b-overdue    { background:var(--rd-bg); color:var(--rd); border-color:var(--rd-bd); }
    .b-sandbox    { background:var(--pu-bg); color:var(--pu); border-color:var(--pu-bd); }
    .b-disabled   { background:var(--hover); color:var(--t3); border-color:var(--bdr); }
    .b-ev-missing { background:var(--rd-bg); color:var(--rd); border-color:var(--rd-bd); }
    .b-ev-draft   { background:var(--am-bg); color:var(--am); border-color:var(--am-bd); }
    .b-ev-sub     { background:var(--bl-bg); color:var(--bl); border-color:var(--bl-bd); }
    .b-ev-review  { background:var(--pu-bg); color:var(--pu); border-color:var(--pu-bd); }
    .b-ev-expired { background:var(--rd-bg); color:var(--rd); border-color:var(--rd-bd); }
    .b-none { color:var(--t4); font-family:var(--f-mono); font-size:11px; }
    .b-delivered{ background:var(--g-bg); color:var(--g); border-color:var(--g-bd); }
    .b-retrying { background:var(--or-bg); color:var(--or); border-color:var(--or-bd); }
    .b-dlq      { background:#1c0520; color:#e879f9; border-color:#a21caf; }
    .b-not-emit { background:var(--hover); color:var(--t3); border-color:var(--bdr); }

    /* STATUS STRIP */
    .status-strip { display:flex; flex-wrap:wrap; background:var(--surface); border:1px solid var(--bdr); border-radius:var(--r-lg); overflow:hidden; flex-shrink:0; }
    .stat-cell { padding:11px 14px; border-right:1px solid var(--bdr); flex:1 1 100px; min-width:0; }
    .stat-cell:last-child { border-right:none; }
    .stat-k { font-size:9.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--t3); margin-bottom:4px; font-weight:600; }
    .stat-v { font-size:13px; color:var(--t1); font-weight:600; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .stat-v.mono { font-family:var(--f-mono); font-size:11px; font-weight:400; }
    .stat-v.red  { color:var(--rd); }
    .stat-v.warn { color:var(--am); }
    .stat-v.pu   { color:var(--pu); }
    .stat-v.bl   { color:var(--bl); }
    .stat-v.g    { color:var(--g); }

    /* KV */
    .kv-table { display:flex; flex-direction:column; }
    .kv-row   { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid var(--hover); }
    .kv-row:last-child { border-bottom:none; }
    .kv-k { font-size:11px; color:var(--t3); min-width:164px; flex-shrink:0; padding-top:2px; }
    .kv-v { font-size:12px; color:var(--t1); flex:1; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .kv-v.mono { font-family:var(--f-mono); font-size:11px; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 14px; border-radius:var(--r); font-size:12.5px; font-weight:500; font-family:var(--f-ui); cursor:pointer; border:none; transition:background 0.1s; white-space:nowrap; }
    .btn-primary { background:var(--cta); color:var(--cta-t); }
    .btn-primary:hover { background:var(--cta-hov); }
    .btn-ghost   { background:var(--surface); color:var(--t2); border:1px solid var(--bdr-mid); }
    .btn-ghost:hover { background:var(--hover); color:var(--t1); }
    .btn-danger  { background:var(--rd-bg); color:var(--rd); border:1px solid var(--rd-bd); }
    .btn-warn    { background:var(--am-bg); color:var(--am); border:1px solid var(--am-bd); }
    .btn-sm { padding:4px 10px; font-size:11px; } .btn-xs { padding:2px 7px; font-size:10.5px; }
    .btn:disabled { opacity:0.32; cursor:not-allowed; }
    .btn-faux-dis { opacity:0.4; cursor:not-allowed; pointer-events:none; }

    /* ALERTS */
    .alert { display:flex; gap:10px; padding:9px 12px 9px 13px; font-size:12px; line-height:1.55; border-left-width:3px; border-left-style:solid; border-radius:var(--r); }
    .alert-warn  { background:var(--am-bg); border-left-color:var(--am); color:#78350f; }
    .alert-red   { background:var(--rd-bg); border-left-color:var(--rd); color:#7f1d1d; }
    .alert-info  { background:var(--hover); border-left-color:var(--bdr-mid); color:var(--t2); }
    .alert-green { background:var(--g-bg);  border-left-color:var(--g);  color:#14532d; }
    .alert-pu    { background:var(--pu-bg); border-left-color:var(--pu); color:#3b0764; }
    .alert-blue  { background:var(--bl-bg); border-left-color:var(--bl); color:#1e3a8a; }

    /* TABLES */
    .data-table { width:100%; border-collapse:collapse; }
    .data-table th { font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--t3); padding:6px 10px; text-align:left; border-bottom:1px solid var(--bdr); background:var(--surf2); font-weight:600; white-space:nowrap; }
    .data-table td { padding:7px 10px; font-size:12px; border-bottom:1px solid var(--hover); vertical-align:middle; }
    .data-table tr:last-child td { border-bottom:none; }
    .data-table tr.row-hover:hover td { background:var(--surf2); cursor:pointer; }
    .data-table tr.row-selected td { background:rgba(29,78,216,0.05); }
    .mono-cell { font-family:var(--f-mono); font-size:11px; }
    .disputes-table { table-layout:fixed; }
    .disputes-table th,
    .disputes-table td { padding-left:8px; padding-right:8px; overflow:hidden; }
    .disputes-table .dispute-id-col { width:9%; }
    .disputes-table .payment-col { width:8%; }
    .disputes-table .customer-col { width:18%; }
    .disputes-table .amount-col { width:8%; }
    .disputes-table .reason-col { width:11%; }
    .disputes-table .status-col { width:11%; }
    .disputes-table .due-col { width:10%; }
    .disputes-table .hold-col { width:12%; }
    .disputes-table .updated-col { width:8%; }
    .disputes-table .actions-col { width:5%; }
    .disputes-table .truncate { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dispute-actions { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .dispute-actions .btn-xs { padding-left:6px; padding-right:6px; font-size:10px; }

    /* FORMS */
    .inp-field { width:100%; padding:6px 9px; border:1px solid var(--bdr-mid); border-radius:var(--r); font-size:12px; color:var(--t1); background:var(--inp); outline:none; font-family:var(--f-ui); transition:border-color 0.12s; }
    .inp-field:focus { border-color:var(--bdr-focus); }
    select.inp-field { cursor:pointer; }
    textarea.inp-field { resize:vertical; min-height:72px; line-height:1.5; }

    /* FILTER CHIPS */
    .filter-chips { display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; padding-bottom:1px; }
    .filter-chips::-webkit-scrollbar { height:2px; }
    .fc { display:inline-flex; align-items:center; padding:3px 9px; border-radius:2px; font-size:10px; font-family:var(--f-mono); border:1px solid var(--bdr-mid); background:var(--surf2); color:var(--t2); cursor:pointer; transition:all 0.1s; white-space:nowrap; font-weight:500; user-select:none; }
    .fc:hover { border-color:var(--bdr-focus); color:var(--t1); background:var(--hover); }
    .fc.fc-on { background:var(--cta); color:var(--cta-t); border-color:var(--cta); }

    /* TOGGLE */
    .toggle-row { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
    .toggle-track { width:32px; height:17px; border-radius:9px; background:var(--bdr-mid); position:relative; transition:background 0.15s; flex-shrink:0; }
    .toggle-track.on { background:#1d4ed8; }
    .toggle-thumb { width:13px; height:13px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left 0.15s; box-shadow:0 1px 2px rgba(0,0,0,0.15); }
    .toggle-track.on .toggle-thumb { left:17px; }
    .toggle-label { font-size:10.5px; color:var(--t2); }
    .toggle-track.on + .toggle-label { color:var(--bl); font-weight:500; }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(17,17,20,0.52); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
    .modal { background:var(--surface); border:1px solid var(--bdr); border-radius:var(--r-lg); width:480px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,0.18); }
    .modal-hdr   { display:flex; align-items:flex-start; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--bdr); flex-shrink:0; background:var(--surf2); }
    .modal-title { font-size:13px; font-weight:600; color:var(--t1); }
    .modal-sub   { font-size:11px; color:var(--t3); margin-top:2px; }
    .modal-close { width:24px; height:24px; border-radius:var(--r); background:transparent; border:none; color:var(--t3); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; transition:background 0.1s; }
    .modal-close:hover { background:var(--hover); color:var(--t1); }
    .modal-body  { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .modal-footer{ padding:12px 16px; border-top:1px solid var(--bdr); display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
    .modal-note  { font-size:10.5px; color:var(--t3); margin-left:auto; font-style:italic; }

    /* DRAWER */
    .drawer-overlay { position:fixed; inset:0; background:rgba(17,17,20,0.35); z-index:90; }
    .drawer { position:fixed; top:0; right:0; bottom:0; width:500px; max-width:95vw; background:var(--surface); border-left:1px solid var(--bdr); display:flex; flex-direction:column; z-index:91; box-shadow:-4px 0 24px rgba(0,0,0,0.12); }
    .drawer-hdr  { padding:12px 16px; border-bottom:1px solid var(--bdr); flex-shrink:0; background:var(--surf2); display:flex; align-items:flex-start; justify-content:space-between; }
    .drawer-title{ font-size:13px; font-weight:600; color:var(--t1); }
    .drawer-sub  { font-size:10.5px; color:var(--t3); margin-top:2px; font-family:var(--f-mono); }
    .drawer-body { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
    .drawer-footer{ padding:10px 16px; border-top:1px solid var(--bdr); flex-shrink:0; display:flex; gap:6px; flex-wrap:wrap; }
    .drawer-tabs { display:flex; border-bottom:1px solid var(--bdr); background:var(--surf2); flex-shrink:0; overflow-x:auto; }
    .drawer-tabs::-webkit-scrollbar { height:2px; }
    .dt { padding:8px 12px; font-size:11px; font-weight:500; color:var(--t3); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.1s; white-space:nowrap; user-select:none; }
    .dt:hover { color:var(--t1); }
    .dt.dt-on { color:var(--t1); border-bottom-color:var(--cta); }

    /* TIMELINE RAIL */
    .tl-rail  { width:var(--w-tl); flex-shrink:0; background:var(--surface); border-left:1px solid var(--bdr); display:flex; flex-direction:column; overflow:hidden; }
    .tl-hdr   { padding:10px 14px; border-bottom:1px solid var(--bdr); flex-shrink:0; font-size:9.5px; font-weight:600; color:var(--t3); text-transform:uppercase; letter-spacing:0.1em; }
    .tl-body  { flex:1; overflow-y:auto; padding:10px 14px; }
    .tl-evt   { display:flex; gap:9px; padding:7px 0; border-bottom:1px solid var(--hover); cursor:pointer; }
    .tl-evt:last-child { border-bottom:none; }
    .tl-evt:hover .tl-name { color:var(--bl); }
    .tl-spine { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
    .tl-dot   { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px; }
    .tl-dot.ok   { background:var(--g); } .tl-dot.pend { background:var(--or); }
    .tl-dot.bad  { background:var(--rd); } .tl-dot.neu  { background:var(--t4); }
    .tl-dot.pu   { background:var(--pu); } .tl-dot.bl   { background:var(--bl); }
    .tl-dot.warn { background:var(--am); }
    .tl-line  { width:1px; flex:1; background:var(--bdr); margin:4px 0; min-height:12px; }
    .tl-content { flex:1; min-width:0; }
    .tl-ts    { font-size:9.5px; font-family:var(--f-mono); color:var(--t3); margin-bottom:1px; }
    .tl-name  { font-size:10.5px; font-weight:600; color:var(--t1); margin-bottom:1px; text-transform:uppercase; letter-spacing:0.04em; transition:color 0.1s; }

/* ── HELPERS ── */
function statusBadge(s) {
  const map = {
    needs_response: <span className="badge b-needs-resp">NEEDS RESPONSE</span>,
    under_review:   <span className="badge b-under-rev">UNDER REVIEW</span>,
    won:            <span className="badge b-won">WON</span>,
    lost:           <span className="badge b-lost">LOST</span>,
    accepted:       <span className="badge b-accepted">ACCEPTED</span>,
  };
  return map[s] || <span className="badge b-disabled">{s}</span>;
}
function holdBadge(h) {
  const map = {
    hold_active:    <span className="badge b-hold-active">HOLD ACTIVE</span>,
    hold_released:  <span className="badge b-hold-released">HOLD RELEASED</span>,
    hold_captured:  <span className="badge b-hold-captured">HOLD CAPTURED</span>,
  };
  return map[h] || <span className="badge b-disabled">{h}</span>;
}
function dueBadge(d) {
  if(!d) return <span className="b-none">—</span>;
  return <span className={`badge ${d.overdue ? 'b-overdue' : 'b-due-soon'}`}>{d.overdue ? '⚠ OVERDUE' : d.label}</span>;
}
function whBadge(s) {
  if(s==='delivered')  return <span className="badge b-delivered">DELIVERED</span>;
  if(s==='retrying')   return <span className="badge b-retrying">RETRYING</span>;
  if(s==='dlq')        return <span className="badge b-dlq">DLQ</span>;
  return <span className="badge b-not-emit">NOT EMITTED</span>;
}
function evStateBadge(s) {
  const map = {
    missing_required: <span className="badge b-ev-missing">MISSING REQUIRED</span>,
    evidence_draft:   <span className="badge b-ev-draft">DRAFT</span>,
    evidence_submitted: <span className="badge b-ev-sub">SUBMITTED</span>,
    under_network_review: <span className="badge b-ev-review">NETWORK REVIEW</span>,
    expired:          <span className="badge b-ev-expired">EXPIRED</span>,
  };
  return map[s] || null;
}

/* ── LIFECYCLE PANEL ── */
function LifecyclePanel({ dispute, onStepClick }) {
  const [activeStep, setActiveStep] = useState(null);
  const stage = dispute.lifecycleStage;
  const steps = LIFECYCLE_STAGES;
  const stepState = (i) => {
    if(dispute.status==='lost'||dispute.status==='accepted') {
      if(i<5) return 'lc-done';
      return 'lc-fail';
    }
    if(dispute.status==='won') {
      if(i<5) return 'lc-done';
      return 'lc-done';
    }
    if(i < stage) return 'lc-done';
    if(i === stage) return 'lc-curr';
    return 'lc-pend';
  };
  const stepNum = (i) => {
    const s = stepState(i);
    if(s==='lc-done') return '✓';
    if(s==='lc-fail') return '✕';
    if(s==='lc-curr') return `${i+1}`;
    return `${i+1}`;
  };
  const handleStep = (i) => {
    setActiveStep(activeStep===i ? null : i);
  };
  const stepInfos = [
    'Chargeback initiated by cardholder via issuer subsystem. Provisional credit applied to cardholder wallet.',
    'Merchant notified via webhook. Evidence deadline active. Action required to contest or accept.',
    'Evidence package being drafted. Documents attached but not yet submitted for review.',
    'Evidence submitted by merchant. Awaiting card network / backoffice arbitration.',
    'Under network review. No further merchant action possible at this stage.',
    dispute.status==='won' ? 'Outcome: WON — Merchant evidence accepted. Hold released to settlement balance.' : dispute.status==='lost' ? 'Outcome: LOST — Cardholder prevailed. Merchant settlement debited.' : 'Outcome: ACCEPTED — Merchant conceded. No arbitration. Settlement debited.',
  ];
  return (
    <div className="panel">
      <div className="panel-hdr"><span className="panel-title">Dispute Lifecycle</span>
        {dispute.overdue && <span className="badge b-overdue">⚠ DEADLINE OVERDUE</span>}
      </div>
      <div className="panel-body">
        <div className="lc-flow">
          {steps.map((s,i) => (
            <React.Fragment key={i}>
              <div className={`lc-step ${stepState(i)}`} onClick={()=>handleStep(i)}>
                <div className="lc-icon">{stepNum(i)}</div>
                <div className="lc-label">{s}</div>
              </div>
              {i<steps.length-1 && <div className="lc-arrow">›</div>}
            </React.Fragment>
          ))}
        </div>
        {activeStep!==null && (
          <div className="lc-step-info" style={{marginTop:10}}>{stepInfos[activeStep]}</div>
        )}
        {dispute.evidenceDue && (
          <div style={{marginTop:8,fontSize:11,color:dispute.overdue?'var(--rd)':'var(--am)',fontFamily:'var(--f-mono)'}}>
            {dispute.overdue ? '⚠ Evidence deadline OVERDUE — ' : '⏱ Evidence due — '}{dispute.evidenceDue}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── EVIDENCE PANEL ── */
function EvidencePanel({ dispute, onItemToggle, localEvidence, setLocalEvidence }) {
  const isTerminal = ['won','lost','accepted'].includes(dispute.status);
  const submitted = dispute.evidenceState === 'evidence_submitted';
  const hasAllRequired = (localEvidence||dispute.evidence).filter(e=>e.req==='required').every(e=>e.attached);
  return (
    <div className="panel">
      <div className="panel-hdr">
        <span className="panel-title">Evidence</span>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          {evStateBadge(dispute.evidenceState)}
          {!isTerminal && !hasAllRequired && <span className="badge b-ev-missing">MISSING REQUIRED</span>}
        </div>
      </div>
      <div className="panel-body" style={{padding:'8px 14px'}}>
        {isTerminal && (
          <div className="alert alert-info" style={{marginBottom:10,fontSize:11}}>
            This dispute is in a terminal state. Evidence submission is closed.
          </div>
        )}
        {!isTerminal && (
          <div className="alert alert-pu" style={{marginBottom:10,fontSize:11}}>
            <div><strong>Sandbox preview:</strong> Evidence submission (upload + submit) is a backoffice-only operation in the current implementation. Checklist reflects local draft state only.</div>
          </div>
        )}
        {(localEvidence||dispute.evidence).map((ev,i) => (
          <div key={i} className="ev-item">
            <div
              className={`ev-check${ev.attached?' checked':ev.req==='required'?' missing':''}`}
              onClick={()=>{
                if(isTerminal) return;
                const updated = [...(localEvidence||dispute.evidence)];
                updated[i] = {...updated[i], attached:!updated[i].attached, updated: updated[i].attached ? '—' : '2026-05-19'};
                setLocalEvidence(updated);
              }}
            >{ev.attached ? '✓' : ''}</div>
            <div className="ev-name">{ev.name}</div>
            <div style={{display:'flex',gap:5,alignItems:'center'}}>
              <span className={`ev-req ${ev.req}`}>{ev.req}</span>
              {ev.attached && <span style={{fontSize:9.5,color:'var(--g)',fontFamily:'var(--f-mono)'}}>attached</span>}
              {ev.updated!=='—' && <span style={{fontSize:9,color:'var(--t3)',fontFamily:'var(--f-mono)'}}>{ev.updated}</span>}
            </div>
          </div>
        ))}
        {!isTerminal && (
          <div style={{marginTop:12,display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-ghost btn-sm btn-faux-dis" title="Upload document — backoffice-only in current implementation">
              ↑ Upload Document
            </button>
            <button className="btn btn-primary btn-sm btn-faux-dis" title="Submit evidence — backoffice-only in current implementation">
              Submit Evidence
            </button>
            <span style={{fontSize:10,color:'var(--t3)',alignSelf:'center',fontStyle:'italic'}}>Submit & Upload are backoffice-only in current build</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── NOTE COMPOSER ── */
function NoteComposer({ onSuccess, onCancel }) {
  const [note, setNote] = useState('');
  const [saved, setSaved] = useState(false);
  const submit = () => {
    if(!note.trim()) return;
    setSaved(true);
    setTimeout(()=>{ onSuccess(note); }, 1200);
  };
  if(saved) return (
    <div className="note-success">
      <span style={{fontSize:14}}>✓</span>
      <span>Note saved successfully.</span>
    </div>
  );
  return (
    <div className="note-composer">
      <div style={{fontSize:11,color:'var(--t2)',fontWeight:500}}>Add internal note</div>
      <textarea className="inp-field" placeholder="Enter note…" value={note} onChange={e=>setNote(e.target.value)} style={{minHeight:64}} />
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-primary btn-sm" onClick={submit} disabled={!note.trim()}>Save Note</button>
        <button className="btn btn-ghost btn-sm" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [statusFilter, setStatusFilter] = useState('all');
  const [reasonFilter, setReasonFilter] = useState('all');
  const [actionOnly, setActionOnly] = useState(false);
  const [dueSoon, setDueSoon] = useState(false);
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [openTab, setOpenTab] = useState('Summary');
  const [acceptModal, setAcceptModal] = useState(null);
  const [localEvidence, setLocalEvidence] = useState(null);
  const [acceptedIds, setAcceptedIds] = useState([]);

  const handleSelect = (d, tab = 'Summary') => {
    setSelected(d);
    setOpenTab(tab);
    setLocalEvidence(null);
  };
  const handleTabChange = (t) => setOpenTab(t);

  const filtered = DISPUTES.filter(d => {
    if(statusFilter!=='all' && d.status!==statusFilter) return false;
    if(reasonFilter!=='all' && d.reason!==reasonFilter) return false;
    if(actionOnly && d.status!=='needs_response') return false;
    if(dueSoon && !d.dueSoon) return false;
    if(search) {
      const s = search.toLowerCase();
      if(!d.id.toLowerCase().includes(s) && !d.paymentId.toLowerCase().includes(s) && !d.customer.toLowerCase().includes(s) && !d.cbId.toLowerCase().includes(s)) return false;
    }
    return true;
  });

  const needsResponse = DISPUTES.filter(d=>d.status==='needs_response').length;
  const underReview   = DISPUTES.filter(d=>d.status==='under_review').length;
  const won           = DISPUTES.filter(d=>d.status==='won').length;
  const lost          = DISPUTES.filter(d=>d.status==='lost').length;
  const accepted      = DISPUTES.filter(d=>d.status==='accepted').length;
  const open          = needsResponse + underReview;
  const holdAmt       = DISPUTES.filter(d=>d.holdState==='hold_active').reduce((a,d)=>a+d.amount,0);
  const evidenceSoon  = DISPUTES.filter(d=>d.dueSoon && d.status==='needs_response').length;

  const handleAcceptConfirm = (id) => {
    setAcceptedIds(prev=>[...prev,id]);
    setAcceptModal(null);
  };

  return (
    <div id="root-inner" style={{display:'flex',width:'100%',height:'100%'}}>
      <Sidebar/>
      <div className="main-wrap">
        {/* PAGE HEADER */}

            <span className="sep">›</span>
            <strong>Disputes</strong>
          </div>

            <span className="badge b-sandbox">KYB IN REVIEW</span>
            <span className="badge b-disabled">LIVE LOCKED</span>
            <div className="user-chip">
              <div className="user-avatar">NK</div>
              <span className="user-name">Nora Klein</span>
            </div>
            <span className="screen-id">MDB-UI-07</span>
          </div>
        </div>

        <div className="content-area">
          <div className="left-scroll">

            {/* SANDBOX NOTICE */}
            <div className="alert alert-pu">
              <div>
                <strong>Sandbox-only preview.</strong> Dispute data reflects local sandbox transactions. Live mode remains locked until KYB approval and Stripe Connect onboarding are complete. Evidence submission and dispute response actions that require backoffice coordination are indicated as unavailable in this environment.
              </div>
            </div>

            {/* STATUS STRIP */}
            <div className="status-strip">
              <div className="stat-cell"><div className="stat-k">Open Disputes</div><div className="stat-v">{open}</div></div>
              <div className="stat-cell"><div className="stat-k">Needs Response</div><div className="stat-v warn">{needsResponse}</div></div>
              <div className="stat-cell"><div className="stat-k">Under Review</div><div className="stat-v bl">{underReview}</div></div>
              <div className="stat-cell"><div className="stat-k">Won</div><div className="stat-v g">{won}</div></div>
              <div className="stat-cell"><div className="stat-k">Lost</div><div className="stat-v red">{lost}</div></div>
              <div className="stat-cell"><div className="stat-k">Accepted</div><div className="stat-v">{accepted}</div></div>
              <div className="stat-cell"><div className="stat-k">On Hold</div><div className="stat-v warn mono">EUR {holdAmt.toFixed(2)}</div></div>
              <div className="stat-cell"><div className="stat-k">Evidence Due Soon</div><div className="stat-v warn">{evidenceSoon}</div></div>
              <div className="stat-cell"><div className="stat-k">Last Updated</div><div className="stat-v mono" style={{fontSize:11,fontWeight:400}}>2026-05-17 09:14</div></div>
            </div>

            {/* FILTER BAR */}
            <FilterBar
              statusFilter={statusFilter} setStatusFilter={setStatusFilter}
              reasonFilter={reasonFilter} setReasonFilter={setReasonFilter}
              actionOnly={actionOnly} setActionOnly={setActionOnly}
              dueSoon={dueSoon} setDueSoon={setDueSoon}
              search={search} setSearch={setSearch}
              onReset={()=>{ setStatusFilter('all'); setReasonFilter('all'); setActionOnly(false); setDueSoon(false); setSearch(''); }}
            />

            {/* DISPUTES TABLE */}
            <DisputesTable disputes={filtered} selected={selected} onSelect={handleSelect}/>

      {/* DISPUTE DRAWER */}

        <DisputeDrawer
          dispute={selected}
          onClose={()=>setSelected(null)}
          openTab={openTab}
          setOpenTab={handleTabChange}

          onAccept={(d)=>setAcceptModal(d)}

        />
      )}

      {/* ACCEPT MODAL */}
      {acceptModal && (
        <AcceptModal
          dispute={acceptModal}
          onClose={()=>setAcceptModal(null)}
          onConfirm={handleAcceptConfirm}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
