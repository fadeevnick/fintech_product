<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Transfer — UEW-UI-05</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --inp:     #faf9f7;
      --hover:   #f0efe9;

      --sb:        #111114;
      --sb-bdr:    #1e1e22;
      --sb-muted:  #545460;
      --sb-active: #1e1e28;

      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;

      --t1: #1c1c1f;
      --t2: #575763;
      --t3: #9898a6;
      --t4: #d0d0da;

      --cta:     #1c1c1f;
      --cta-hov: #2e2e35;
      --cta-t:   #ffffff;

      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;

      --sb-env-bg: #1a1030;
      --sb-env-t:  #b39cf0;
      --sb-env-bd: #362566;

      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;

      --r:    3px;
      --r-lg: 5px;
      --w-sb: 220px;
      --w-tl: 248px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; display: flex; overflow: hidden; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 15px 15px 13px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14.5px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .sb-nav   { flex: 1; padding: 10px 7px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 9px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 12px;
      cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.35; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.6; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono); color: var(--sb-muted); opacity: 0.8; }
    .sb-footer { padding: 10px 14px; border-top: 1px solid var(--sb-bdr); }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 10px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 4px; }
    .env-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host  { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* MAIN */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .page-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .page-bc   { font-size: 12.5px; color: var(--t2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep   { color: var(--t3); }
    .page-bc .mode  { font-family: var(--f-mono); font-size: 11.5px; color: var(--t2); }
    .page-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge { font-size: 10px; font-family: var(--f-mono); color: var(--am);
      background: var(--am-bg); border: 1px solid var(--am-bd);
      padding: 2px 8px; border-radius: var(--r); display: flex; align-items: center; gap: 5px; }
    .env-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--am); }
    .user-chip { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 3px;
      border: 1px solid var(--bdr); border-radius: 20px; background: var(--surf2); }
    .user-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--cta);
      color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center;
      justify-content: center; letter-spacing: 0.03em; flex-shrink: 0; }
    .user-name { font-size: 11.5px; color: var(--t2); font-weight: 500; }

    /* CONTENT */
    .content-area { flex: 1; display: flex; overflow: hidden; }
    .left-scroll  { flex: 1; overflow-y: auto; padding: 16px 20px;
      background: var(--bg); display: flex; flex-direction: column; gap: 12px; min-width: 0; }

    /* PANELS */
    .panel     { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; flex-shrink: 0; }
    .panel-hdr { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); flex-shrink: 0; }
    .panel-title { font-size: 11.5px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 13px 16px; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
      font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-active    { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-done      { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-completed { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-pending   { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-held      { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-limited   { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-action    { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-rejected  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-failed    { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-locked    { background: var(--hover); color: var(--t2);  border-color: var(--bdr); }
    .b-cancelled { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-inreview  { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-dev       { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-verified  { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-unverif   { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }

    /* DIRECTION */
    .dir-out { font-size: 10px; font-family: var(--f-mono); color: var(--rd); font-weight: 600; }
    .dir-in  { font-size: 10px; font-family: var(--f-mono); color: var(--g);  font-weight: 600; }
    .dir-neu { font-size: 10px; font-family: var(--f-mono); color: var(--t3); }

    /* KV */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 148px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11.5px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover:not(:disabled) { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover:not(:disabled)  { background: var(--hover); color: var(--t1); }
    .btn-warn    { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .btn-warn:hover { background: #fef3c7; }
    .btn-sm      { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ALERTS */
    .alert { display: flex; gap: 10px; padding: 9px 12px 9px 13px; font-size: 12px;
      line-height: 1.55; border-left-width: 3px; border-left-style: solid; border-radius: var(--r); }
    .alert-warn  { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-red   { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-info  { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-green { background: var(--g-bg);  border-left-color: var(--g); color: #14532d; }
    .alert-or    { background: var(--or-bg); border-left-color: var(--or); color: #7c2d12; }

    /* TABLES */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--bdr); background: var(--surf2); font-weight: 600; }
    .data-table td { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--hover); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background: var(--hover); cursor: pointer; }
    .mono-cell { font-family: var(--f-mono); font-size: 11px; }

    /* LEDGER TABLE in modal */
    .ledger-tbl { width: 100%; border-collapse: collapse; }
    .ledger-tbl th { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--t3); padding: 5px 10px; border-bottom: 1px solid var(--bdr);
      background: var(--surf2); font-weight: 600; text-align: left; }
    .ledger-tbl td { padding: 5px 10px; font-size: 11px; font-family: var(--f-mono);
      border-bottom: 1px solid var(--hover); vertical-align: middle; }
    .ledger-tbl tr:last-child td { border-bottom: none; }
    .le-dr { color: var(--rd); font-weight: 600; }
    .le-cr { color: var(--g);  font-weight: 600; }

    /* FORM */
    .inp-label { font-size: 11px; color: var(--t2); margin-bottom: 4px; font-weight: 500; display: block; }
    .inp-hint  { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
    .inp-err   { font-size: 10.5px; color: var(--rd); margin-top: 3px; }
    .inp-ok    { font-size: 10.5px; color: var(--g);  margin-top: 3px; }
    .inp-warn  { font-size: 10.5px; color: var(--or); margin-top: 3px; }
    .inp-field { width: 100%; padding: 7px 10px; border: 1px solid var(--bdr-mid);
      border-radius: var(--r); font-size: 12.5px; color: var(--t1);
      background: var(--inp); outline: none; font-family: var(--f-ui); transition: border-color 0.12s; }
    .inp-field:focus { border-color: var(--bdr-focus); }
    .inp-field.err  { border-color: var(--rd); }
    .inp-field.ok   { border-color: var(--g-bd); }
    select.inp-field { cursor: pointer; }
    .form-group  { display: flex; flex-direction: column; }
    .inp-prefix-wrap { display: flex; align-items: stretch; }
    .inp-prefix  { padding: 7px 10px; background: var(--surf2); border: 1px solid var(--bdr-mid);
      border-right: none; border-radius: var(--r) 0 0 var(--r); font-size: 12px;
      color: var(--t3); font-family: var(--f-mono); display: flex; align-items: center; flex-shrink: 0; }
    .inp-prefix + .inp-field { border-radius: 0 var(--r) var(--r) 0; }
    .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* PROGRESS BAR */
    .prog-wrap  { height: 5px; background: var(--hover); border-radius: 3px; overflow: hidden; margin-top: 5px; }
    .prog-fill  { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .prog-green { background: var(--g); }
    .prog-amber { background: var(--am); }
    .prog-red   { background: var(--rd); }

    /* STATE PATH */
    .state-path { display: flex; align-items: center; flex-wrap: wrap; padding: 10px 14px; gap: 0; }
    .sp-node  { display: flex; align-items: center; }
    .sp-pill  { padding: 3px 9px; border-radius: 2px; font-size: 10px; font-family: var(--f-mono);
      font-weight: 600; letter-spacing: 0.05em; white-space: nowrap; border: 1px solid transparent; }
    .sp-pill.done      { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .sp-pill.current   { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); box-shadow: 0 0 0 2px rgba(133,77,14,0.14); }
    .sp-pill.next      { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .sp-pill.next-warn { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); box-shadow: 0 0 0 2px rgba(180,83,9,0.12); }
    .sp-pill.bypassed  { background: var(--hover); color: var(--t4);  border-color: var(--bdr); text-decoration: line-through; opacity: 0.6; }
    .sp-pill.future    { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .sp-pill.bad       { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .sp-arrow { font-size: 10px; color: var(--t4); margin: 0 4px; flex-shrink: 0; }

    /* REVIEW ROWS */
    .rev-row { display: flex; align-items: baseline; justify-content: space-between;
      padding: 5px 0; border-bottom: 1px solid var(--hover); font-size: 12px; gap: 8px; }
    .rev-row:last-child { border-bottom: none; }
    .rev-k  { color: var(--t3); font-size: 11px; flex-shrink: 0; }
    .rev-v  { font-weight: 500; color: var(--t1); text-align: right; }
    .rev-v.mono { font-family: var(--f-mono); font-size: 11.5px; }
    .rev-v.warn { color: var(--am); }
    .rev-v.bad  { color: var(--rd); }
    .rev-v.good { color: var(--g); }
    .rev-v.or   { color: var(--or); }

    /* RECIPIENT CARD */
    .recip-card { border: 1px solid var(--bdr); border-radius: var(--r); overflow: hidden; }
    .recip-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--surf2); border-bottom: 1px solid var(--bdr); }
    .recip-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; letter-spacing: 0.03em; }
    .ra-unverif { background: var(--or-bg); color: var(--or); border: 1px solid var(--or-bd); }
    .ra-verified { background: var(--g-bg);  color: var(--g);  border: 1px solid var(--g-bd); }

    /* TIMELINE RAIL */
    .tl-rail  { width: var(--w-tl); flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .tl-hdr   { padding: 10px 14px; border-bottom: 1px solid var(--bdr); flex-shrink: 0;
      font-size: 9.5px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.1em; }
    .tl-body  { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .tl-evt   { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--hover); }
    .tl-evt:last-child { border-bottom: none; }
    .tl-spine { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .tl-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .tl-dot.ok   { background: var(--g); }
    .tl-dot.pend { background: var(--am); }
    .tl-dot.held { background: var(--or); }
    .tl-dot.bad  { background: var(--rd); }
    .tl-dot.neu  { background: var(--t4); }
    .tl-line  { width: 1px; flex: 1; background: var(--bdr); margin: 4px 0; min-height: 12px; }
    .tl-content { flex: 1; min-width: 0; }
    .tl-ts    { font-size: 9.5px; font-family: var(--f-mono); color: var(--t3); margin-bottom: 1px; }
    .tl-name  { font-size: 11px; font-weight: 600; color: var(--t1); margin-bottom: 1px; text-transform: uppercase; letter-spacing: 0.04em; }
    .tl-actor { font-size: 10px; color: var(--t3); margin-bottom: 2px; }
    .tl-desc  { font-size: 10.5px; color: var(--t2); line-height: 1.4; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,20,0.52);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg);
      width: 540px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08); }
    .modal-hdr  { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--bdr); flex-shrink: 0; background: var(--surf2); }
    .modal-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .modal-sub   { font-size: 11px; color: var(--t3); margin-top: 2px; }
    .modal-close { width: 24px; height: 24px; border-radius: var(--r); background: transparent;
      border: none; color: var(--t3); cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.1s, color 0.1s; flex-shrink: 0; margin-top: 1px; }
    .modal-close:hover { background: var(--hover); color: var(--t1); }
    .modal-body   { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--bdr); display: flex;
      gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .modal-note   { font-size: 10.5px; color: var(--t3); margin-left: auto; font-style: italic; }

    /* SUCCESS */
    .success-panel { background: var(--g-bg); border: 1px solid var(--g-bd);
      border-radius: var(--r-lg); padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }

    /* SANDBOX NOTE */
    .sandbox-note { font-size: 10px; color: var(--t3); font-family: var(--f-mono);
      padding: 4px 9px; background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r); }

    @media (max-width: 1100px) { :root { --w-tl: 210px; } }
    @media (max-width: 960px)  { .tl-rail { display: none; } }
    @media (max-width: 800px)  { .form-grid2 { grid-template-columns: 1fr; } .form-grid3 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px)  { .sidebar { display: none; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

  const numAmount = parseFloat(amount) || 0;
  const remaining = DAILY_LIMIT - USED_TODAY;
  const usedAfter = USED_TODAY + numAmount;
  const usedPct   = Math.min((usedAfter / DAILY_LIMIT) * 100, 100);

  const errExceedsBalance   = numAmount > AVAIL_BALANCE;
  const errExceedsDaily     = numAmount > remaining;
  const errExceedsPerTx     = numAmount > PER_TX_MAX_KYC;
  const amountErr = errExceedsBalance
    ? `Insufficient balance. Available: EUR ${AVAIL_BALANCE.toFixed(2)}`
    : errExceedsDaily
      ? `Exceeds daily limit. Remaining today: EUR ${remaining.toFixed(2)}`
      : errExceedsPerTx
        ? `Exceeds per-transfer cap of EUR ${PER_TX_MAX_KYC} while KYC is in review`
        : numAmount <= 0 && amount !== ''
          ? 'Amount must be greater than 0'
          : null;

  const canSubmit = numAmount > 0 && !errExceedsBalance && !errExceedsDaily && !errExceedsPerTx;
  const isHeld    = !recipient.verified;

  const handleSubmit = () => {
    if (!canSubmit) return;
    const id = `TRF-${Math.floor(71300 + Math.random() * 500)}`;
    setSubmittedId(id);
    setSubmitted(true);
  };

    setSubmitted(false);
    setAmount('');
    setSaveMsg('');
    setVerifyMsg('');

                    <div className={`tl-dot ${e.dot}`} />
                    {i < arr.length - 1 && <div className="tl-line" />}
                  </div>
                  <div className="tl-content">
                    <div className="tl-ts">{e.ts}</div>
                    <div className="tl-name">{e.name}</div>
                    <div className="tl-actor">{e.actor}</div>
                    <div className="tl-desc">{e.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

        </div>{/* content-area */}
      </div>

      {detailTxn && <DetailModal txn={detailTxn} onClose={() => setDetailTxn(null)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
