<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Transaction Detail — UEW-UI-07</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #eceae5;
      --surface: #ffffff;
      --surf2:   #f7f6f3;
      --inp:     #faf9f7;
      --hover:   #f0efe9;

      --sb:        #111114;
      --sb-bdr:    #1e1e22;
      --sb-muted:  #545460;
      --sb-active: #1e1e28;

      --bdr:       #dddad2;
      --bdr-mid:   #c5c2ba;
      --bdr-focus: #1c1c1f;

      --t1: #1c1c1f;
      --t2: #575763;
      --t3: #9898a6;
      --t4: #d0d0da;

      --cta:     #1c1c1f;
      --cta-hov: #2e2e35;
      --cta-t:   #ffffff;

      --g:    #166534;  --g-bg: #f0fdf4;  --g-bd: #bbf7d0;
      --am:   #854d0e;  --am-bg:#fffbeb;  --am-bd:#fde68a;
      --rd:   #9b1c1c;  --rd-bg:#fef2f2;  --rd-bd:#fecaca;
      --or:   #b45309;  --or-bg:#fff7ed;  --or-bd:#fed7aa;
      --pu:   #5b21b6;  --pu-bg:#f5f3ff;  --pu-bd:#ddd6fe;

      --sb-env-bg: #1a1030;
      --sb-env-t:  #b39cf0;
      --sb-env-bd: #362566;

      --f-ui:   'IBM Plex Sans', sans-serif;
      --f-mono: 'IBM Plex Mono', monospace;

      --r:    3px;
      --r-lg: 5px;
      --w-sb: 220px;
      --w-tl: 252px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; display: flex; overflow: hidden; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 15px 15px 13px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 9px; }
    .sb-name  { font-size: 14.5px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9.5px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .sb-nav   { flex: 1; padding: 10px 7px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 9px 5px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 12px;
      cursor: default; user-select: none; transition: background 0.1s; }
    .nav-item.locked  { opacity: 0.35; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.6; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono); color: var(--sb-muted); opacity: 0.8; }
    .sb-footer { padding: 10px 14px; border-top: 1px solid var(--sb-bdr); }
    .env-chip  { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 10px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 4px; }
    .env-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host  { font-size: 10px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* MAIN */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .page-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .page-bc   { font-size: 12.5px; color: var(--t2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .page-bc strong { color: var(--t1); font-weight: 500; }
    .page-bc .sep   { color: var(--t3); }
    .page-bc .mode  { font-family: var(--f-mono); font-size: 11.5px; color: var(--t2); }
    .page-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge { font-size: 10px; font-family: var(--f-mono); color: var(--am);
      background: var(--am-bg); border: 1px solid var(--am-bd);
      padding: 2px 8px; border-radius: var(--r); display: flex; align-items: center; gap: 5px; }
    .env-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--am); }
    .user-chip { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 3px;
      border: 1px solid var(--bdr); border-radius: 20px; background: var(--surf2); }
    .user-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--cta);
      color: #fff; font-size: 9px; font-weight: 600; display: flex; align-items: center;
      justify-content: center; letter-spacing: 0.03em; flex-shrink: 0; }
    .user-name { font-size: 11.5px; color: var(--t2); font-weight: 500; }

    /* CONTENT */
    .content-area { flex: 1; display: flex; overflow: hidden; }
    .left-scroll  { flex: 1; overflow-y: auto; padding: 16px 20px;
      background: var(--bg); display: flex; flex-direction: column; gap: 12px; min-width: 0; }

    /* PANELS */
    .panel     { background: var(--surface); border: 1px solid var(--bdr);
      border-radius: var(--r-lg); overflow: hidden; flex-shrink: 0; }
    .panel-hdr { display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; border-bottom: 1px solid var(--bdr); background: var(--surf2); flex-shrink: 0; }
    .panel-title { font-size: 11.5px; font-weight: 600; color: var(--t1);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .panel-body  { padding: 13px 16px; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
      font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-active    { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-done      { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-completed { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-pending   { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-held      { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-limited   { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-action    { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-rejected  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .b-locked    { background: var(--hover); color: var(--t2);  border-color: var(--bdr); }
    .b-cancelled { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .b-inreview  { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .b-approved  { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-captured  { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-unverif   { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); }
    .b-verified  { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-posted    { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-warn      { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }

    /* KV */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 11px; color: var(--t3); min-width: 152px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 12px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11.5px; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--r); font-size: 12.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover:not(:disabled) { background: var(--cta-hov); }
    .btn-ghost   { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover:not(:disabled)   { background: var(--hover); color: var(--t1); }
    .btn-warn    { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .btn-warn:hover { background: #fef3c7; }
    .btn-danger  { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }
    .btn-sm      { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ALERTS */
    .alert { display: flex; gap: 10px; padding: 9px 12px 9px 13px; font-size: 12px;
      line-height: 1.55; border-left-width: 3px; border-left-style: solid; border-radius: var(--r); }
    .alert-warn  { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-red   { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-info  { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-green { background: var(--g-bg);  border-left-color: var(--g);  color: #14532d; }
    .alert-or    { background: var(--or-bg); border-left-color: var(--or); color: #7c2d12; }
    .alert-pu    { background: var(--pu-bg); border-left-color: var(--pu); color: #3b0764; }

    /* STATE PATH */
    .state-path { display: flex; align-items: center; flex-wrap: wrap; padding: 10px 14px; gap: 0; }
    .sp-node  { display: flex; align-items: center; }
    .sp-pill  { padding: 3px 9px; border-radius: 2px; font-size: 10px; font-family: var(--f-mono);
      font-weight: 600; letter-spacing: 0.05em; white-space: nowrap; border: 1px solid transparent; }
    .sp-pill.past     { background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .sp-pill.current  { background: var(--or-bg); color: var(--or);  border-color: var(--or-bd); box-shadow: 0 0 0 2px rgba(180,83,9,0.14); }
    .sp-pill.next     { background: var(--pu-bg); color: var(--pu);  border-color: var(--pu-bd); }
    .sp-pill.future   { background: var(--hover); color: var(--t3);  border-color: var(--bdr); }
    .sp-pill.bad      { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    .sp-arrow { font-size: 10px; color: var(--t4); margin: 0 4px; flex-shrink: 0; }

    /* TABLES */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--t3); padding: 6px 10px; text-align: left;
      border-bottom: 1px solid var(--bdr); background: var(--surf2); font-weight: 600; }
    .data-table td { padding: 7px 10px; font-size: 12px; border-bottom: 1px solid var(--hover); vertical-align: middle; }
    .data-table tr:last-child td { border-bottom: none; }
    .mono-cell { font-family: var(--f-mono); font-size: 11px; }
    .le-dr { color: var(--rd); font-weight: 600; font-family: var(--f-mono); font-size: 10.5px; }
    .le-cr { color: var(--g);  font-weight: 600; font-family: var(--f-mono); font-size: 10.5px; }

    /* FORM */
    .inp-label { font-size: 11px; color: var(--t2); margin-bottom: 4px; font-weight: 500; display: block; }
    .inp-hint  { font-size: 10.5px; color: var(--t3); margin-top: 3px; }
    .inp-field { width: 100%; padding: 7px 10px; border: 1px solid var(--bdr-mid);
      border-radius: var(--r); font-size: 12.5px; color: var(--t1);
      background: var(--inp); outline: none; font-family: var(--f-ui); transition: border-color 0.12s; }
    .inp-field:focus { border-color: var(--bdr-focus); }
    select.inp-field { cursor: pointer; }
    .form-group  { display: flex; flex-direction: column; }

    /* COPY BUTTON */
    .copy-btn { padding: 3px 9px; font-size: 10px; font-family: var(--f-mono); background: var(--surf2);
      border: 1px solid var(--bdr-mid); border-radius: var(--r); cursor: pointer; color: var(--t2);
      transition: all 0.1s; }
    .copy-btn.copied { background: var(--g-bg); border-color: var(--g-bd); color: var(--g); }
    .copy-btn:hover:not(.copied) { background: var(--hover); }

    /* HOLD BAR */
    .hold-bar-wrap { height: 5px; background: var(--bdr); border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .hold-bar-fill { height: 100%; background: var(--or); border-radius: 3px; }

    /* OUTCOME ROW */
    .outcome-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0;
      border-bottom: 1px solid var(--hover); }
    .outcome-row:last-child { border-bottom: none; }
    .outcome-icon { width: 18px; height: 18px; border-radius: var(--r); font-size: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; font-weight: 700; }
    .outcome-body { flex: 1; min-width: 0; }
    .outcome-label { font-size: 11.5px; font-weight: 600; color: var(--t1); }
    .outcome-desc  { font-size: 10.5px; color: var(--t3); margin-top: 1px; }

    /* TIMELINE RAIL */
    .tl-rail  { width: var(--w-tl); flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--bdr); display: flex; flex-direction: column; overflow: hidden; }
    .tl-hdr   { padding: 10px 14px; border-bottom: 1px solid var(--bdr); flex-shrink: 0;
      font-size: 9.5px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.1em; }
    .tl-body  { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 14px; }
    .tl-evt   { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--hover); cursor: pointer; }
    .tl-evt:last-child { border-bottom: none; }
    .tl-evt:hover .tl-name { color: var(--cta); }
    .tl-spine { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .tl-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .tl-dot.ok   { background: var(--g); }
    .tl-dot.pend { background: var(--or); }
    .tl-dot.bad  { background: var(--rd); }
    .tl-dot.neu  { background: var(--t4); }
    .tl-line  { width: 1px; flex: 1; background: var(--bdr); margin: 4px 0; min-height: 12px; }
    .tl-content { flex: 1; min-width: 0; }
    .tl-ts    { font-size: 9.5px; font-family: var(--f-mono); color: var(--t3); margin-bottom: 1px; }
    .tl-name  { font-size: 11px; font-weight: 600; color: var(--t1); margin-bottom: 1px;
      text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.1s; }
    .tl-actor { font-size: 10px; color: var(--t3); margin-bottom: 2px; }
    .tl-desc  { font-size: 10.5px; color: var(--t2); line-height: 1.4; }
    .tl-audit { font-size: 9.5px; font-family: var(--f-mono); color: var(--pu); margin-top: 4px;
      background: var(--pu-bg); border: 1px solid var(--pu-bd); border-radius: var(--r);
      padding: 2px 6px; display: inline-block; max-width: 100%; white-space: normal;
      overflow-wrap: anywhere; word-break: break-word; }
    .tl-expand-hint { font-size: 9px; color: var(--t4); margin-top: 3px; font-style: italic; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(17,17,20,0.52);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg);
      width: 480px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08); }
    .modal-hdr  { display: flex; align-items: flex-start; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--bdr); flex-shrink: 0; background: var(--surf2); }
    .modal-title { font-size: 13px; font-weight: 600; color: var(--t1); }
    .modal-sub   { font-size: 11px; color: var(--t3); margin-top: 2px; }
    .modal-close { width: 24px; height: 24px; border-radius: var(--r); background: transparent;
      border: none; color: var(--t3); cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.1s, color 0.1s; flex-shrink: 0; margin-top: 1px; }
    .modal-close:hover { background: var(--hover); color: var(--t1); }
    .modal-body   { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer { padding: 12px 16px; border-top: 1px solid var(--bdr); display: flex;
      gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .modal-note   { font-size: 10.5px; color: var(--t3); margin-left: auto; font-style: italic; }

    /* SANDBOX */
    .sandbox-note { font-size: 10px; color: var(--t3); font-family: var(--f-mono);
      padding: 4px 9px; background: var(--surf2); border: 1px solid var(--bdr); border-radius: var(--r); }

    /* DETAIL GRID */
    .detail-grid { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }

    /* TXN AMOUNT DISPLAY */
    .txn-amount-block { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 4px; }
    .txn-amount-ccy   { font-size: 14px; font-family: var(--f-mono); color: var(--t3); font-weight: 500; }
    .txn-amount-val   { font-size: 28px; font-family: var(--f-mono); font-weight: 600; letter-spacing: -0.02em; color: var(--t1); }

    @media (max-width: 1200px) { .detail-grid { grid-template-columns: 1fr 280px; } }
    @media (max-width: 1100px) { :root { --w-tl: 210px; } .detail-grid { grid-template-columns: 1fr; } }
    @media (max-width: 960px)  { .tl-rail { display: none; } }
    @media (max-width: 640px)  { .sidebar { display: none; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ── DATA ───────────────────────────────────────────────────────────────── */
const TXN = {
  id: 'TXN-29376', publicRef: 'TRF-88201',
  type: 'Internal Transfer — Sent', typeCode: 'TRANSFER_SENT',
  amount: 120.00, currency: 'EUR', fee: 0.00,
  status: 'HELD_FOR_RECIPIENT_VERIFICATION',
  created: '2026-05-16 16:42:13', updated: '2026-05-17 08:55:02',
  walletId: 'WLT-EU-77820',
  sender:    { name: 'Elena Markovic', id: 'EU-10482', walletId: 'WLT-EU-77820' },

  balanceBefore: 962.50, balanceAfter: 842.50,

  holdStarted: '2026-05-16 16:42', holdExpiry: '2026-06-15 16:42',
  holdReason: 'Recipient EU-10831 (Jonas Hofer) has not completed KYC verification',
  holdDaysElapsed: 1, holdDaysTotal: 30,
  journalId: 'JRN-20260516-88201', journalTs: '2026-05-16 16:42:13',
  kycState: 'IN_REVIEW', accountControl: 'ACTIVE_WITHDRAWAL_LIMITS', frozen: false,

  note: 'Split invoice reimbursement',
};

const AUTH = {
  id: 'AUTH-48201', merchant: 'Supermarkt Müller',
  mcc: '5411', mccLabel: 'Grocery Stores',

                    <div className="txn-amount-block">
                      <span className="txn-amount-ccy">EUR</span>
                      <span className="txn-amount-val">120.00</span>
                      <span style={{ fontSize: 11, color: 'var(--rd)', fontFamily: 'var(--f-mono)', fontWeight: 600 }}>−</span>
                    </div>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 4 }}>
                      <Badge cls="b-locked" label="INTERNAL TRANSFER" />
                      <Badge cls="b-locked" label="→ SENT" />
                    </div>
                  </div>
                  {/* Right: key IDs */}
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '4px 20px' }}>
                    {[
                      { k: 'Transaction ID',   v: 'TXN-29376',           mono: true },
                      { k: 'Public Reference', v: 'TRF-88201',           mono: true },
                      { k: 'Wallet',           v: 'WLT-EU-77820',        mono: true },
                      { k: 'Created',          v: '2026-05-16 16:42:13', mono: true },
                      { k: 'Note',             v: TXN.note,              mono: false },
                      { k: 'Next Owner',       v: 'Hold Manager / System', mono: false },
                    ].map((f, i) => (
                      <div key={i}>
                        <div style={{ fontSize: 10, color: 'var(--t3)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 2 }}>{f.k}</div>
                        <div style={{ fontSize: 11.5, fontFamily: f.mono ? 'var(--f-mono)' : 'inherit', color: 'var(--t1)' }}>{f.v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* ── STATE PATH ───────────────────────────────────── */}
            <div className="panel">
              <div className="panel-hdr">
                <span className="panel-title">Transfer State Path</span>
                <span style={{ fontSize: 10.5, color: 'var(--or)' }}>Current owner: System — hold manager</span>
              </div>
              <div className="state-path">
                {[
                  { label: 'DRAFT',                        cls: 'past',    done: true },
                  { label: 'SUBMITTED',                    cls: 'past',    done: true },
                  { label: 'VALIDATION PASSED',            cls: 'past',    done: true },
                  { label: 'HELD — RECIPIENT VERIFICATION', cls: 'current', note: '← current' },
                  { label: 'LEDGER POSTED (RECIPIENT)',    cls: 'next' },
                  { label: 'COMPLETED',                    cls: 'future' },
                ].map((s, i, arr) => (
                  <div key={i} className="sp-node">
                    <div className={`sp-pill ${s.cls}`}>
                      {s.label}
                      {s.note && <span style={{ fontSize: 8, fontWeight: 400, marginLeft: 4, opacity: 0.8 }}>({s.note})</span>}
                    </div>
                    {i < arr.length - 1 && <span className="sp-arrow">→</span>}
                  </div>
                ))}
                <span className="sp-arrow" style={{ margin: '0 6px' }}>|</span>
                <div className="sp-node">
                  <div className="sp-pill bad">REJECTED</div>
                  <span className="sp-arrow"> / </span>
                  <div className="sp-pill future">CANCELLED</div>
                </div>
              </div>
              <div style={{ padding: '0 14px 10px', display: 'flex', gap: 16, flexWrap: 'wrap' }}>
                {[
                  { cls: 'past',    label: 'Completed states' },
                  { cls: 'current', label: 'Active state' },
                  { cls: 'next',    label: 'Next on verification' },
                  { cls: 'future',  label: 'Future' },
                  { cls: 'bad',     label: 'Failure / terminal' },
                ].map((l, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 10.5, color: 'var(--t3)' }}>
                    <span className={`sp-pill ${l.cls}`} style={{ fontSize: 8, padding: '1px 5px' }}>●</span>
                    {l.label}
                  </div>
                ))}
              </div>
            </div>

            {/* ── DETAIL GRID (two columns) ─────────────────────── */}
            <div className="detail-grid">

              {/* LEFT: Parties, Amounts, Timing, Risk */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>

                {/* Parties */}
                <div className="panel">
                  <div className="panel-hdr"><span className="panel-title">Parties</span></div>
                  <div className="panel-body">
                    <div style={{ marginBottom: 12, paddingBottom: 12, borderBottom: '1px solid var(--bdr)' }}>
                      <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 6 }}>Sender</div>
                      <div className="kv-table">
                        <KV  k="Name"><strong>Elena Markovic</strong></KV>
                        <KVm k="User ID">EU-10482</KVm>
                        <KVm k="Wallet ID">WLT-EU-77820</KVm>
                        <KV  k="KYC State"><Badge cls="b-inreview" label="IN REVIEW" /> <span style={{ fontSize: 11, color: 'var(--t3)', marginLeft: 4 }}>transfers allowed</span></KV>
                        <KV  k="Account Control"><Badge cls="b-limited" label="ACTIVE · WITHDRAW LIMIT" /></KV>
                        <KV  k="Account Freeze"><span style={{ color: 'var(--g)', fontSize: 11.5 }}>Not frozen</span></KV>
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 6 }}>Recipient</div>
                      <div className="kv-table">
                        <KV  k="Name"><strong>Jonas Hofer</strong></KV>
                        <KVm k="User ID">EU-10831</KVm>
                        <KVm k="Wallet ID">WLT-EU-10831</KVm>
                        <KV  k="Verification"><Badge cls="b-unverif" label="NOT VERIFIED" /></KV>
                        <KV  k="Funds held until">Recipient completes KYC verification</KV>
                        <KV  k="Risk flag"><span style={{ fontSize: 11, color: 'var(--or)' }}>recipient_kyc_incomplete</span></KV>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Amounts */}
                <div className="panel">
                  <div className="panel-hdr"><span className="panel-title">Amounts &amp; Balance Impact</span></div>
                  <div className="panel-body">
                    <div className="kv-table">
                      <KVm k="Transfer amount"><span style={{ fontWeight: 700, color: 'var(--t1)' }}>EUR 120.00</span></KVm>
                      <KVm k="Fee"><span style={{ color: 'var(--g)' }}>EUR 0.00</span></KVm>
                      <KVm k="Total debit">EUR 120.00</KVm>
                      <KVm k="Available before"><span style={{ color: 'var(--t2)' }}>EUR 962.50</span></KVm>
                      <KVm k="Available after"><span style={{ color: 'var(--rd)', fontWeight: 600 }}>EUR 842.50</span></KVm>
                      <KVm k="Amount in hold">EUR 120.00 → <span style={{ color: 'var(--or)' }}>platform.transfer.hold_account</span></KVm>
                      <KV  k="Recipient credited">Not yet — pending verification</KV>
                    </div>
                  </div>
                </div>

                {/* Timing */}
                <div className="panel">
                  <div className="panel-hdr"><span className="panel-title">Timing</span></div>
                  <div className="panel-body">
                    <div className="kv-table">
                      <KVm k="Created">2026-05-16 16:42:13</KVm>
                      <KVm k="Last updated">2026-05-17 08:55:02</KVm>
                      <KVm k="Hold started">2026-05-16 16:42</KVm>
                      <KVm k="Hold expiry">2026-06-15 16:42 <Badge cls="b-warn" label="30 DAYS" /></KVm>
                      <KV  k="Days elapsed">Day 1 of 30</KV>
                      <KV  k="Expected completion">On recipient KYC approval — no fixed date</KV>
                    </div>
                    <div style={{ marginTop: 10 }}>
                      <div style={{ fontSize: 10.5, color: 'var(--t3)', marginBottom: 4 }}>Hold period: 1 of 30 days elapsed</div>
                      <div className="hold-bar-wrap">
                        <div className="hold-bar-fill" style={{ width: '3.3%' }} />
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9.5, fontFamily: 'var(--f-mono)', color: 'var(--t4)', marginTop: 3 }}>
                        <span>2026-05-16</span><span>2026-06-15 (expiry)</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Risk / Compliance */}
                <div className="panel">
                  <div className="panel-hdr"><span className="panel-title">Risk &amp; Compliance Context</span></div>
                  <div className="panel-body">
                    <div className="kv-table">
                      <KV  k="Sender KYC"><Badge cls="b-inreview" label="IN REVIEW" /> <span style={{ fontSize: 11, color: 'var(--t3)', marginLeft: 4 }}>internal transfers not blocked</span></KV>
                      <KV  k="Recipient KYC"><Badge cls="b-unverif" label="NOT VERIFIED" /> <span style={{ fontSize: 11, color: 'var(--or)', marginLeft: 4 }}>hold applied</span></KV>
                      <KV  k="Account frozen">No</KV>
                      <KV  k="AML alert">None active</KV>
                      <KV  k="Sanctions check">No match</KV>
                      <KV  k="Audit event (submit)"    ><span style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>wallet.transfer_requested</span></KV>
                      <KV  k="Audit event (hold)"      ><span style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>wallet.ledger_hold_posted</span></KV>
                      <KV  k="Audit event (expiry)"    ><span style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>wallet.hold_expiry_scheduled</span></KV>
                    </div>
                  </div>
                </div>

              </div>{/* left col end */}

              {/* RIGHT: Hold/Release + Dispute/Actions */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>

                {/* Hold / Release */}
                <div className="panel">
                  <div className="panel-hdr">
                    <span className="panel-title">Hold &amp; Release</span>
                    <Badge cls="b-held" label="ACTIVE" />
                  </div>
                  <div className="panel-body" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    <div className="alert alert-or">
                      <IcoWarn />
                      <div>
                        <div style={{ fontWeight: 600, marginBottom: 2 }}>Funds held — recipient not verified</div>
                        <div style={{ fontSize: 11.5 }}>EUR 120.00 is in platform hold. Recipient EU-10831 must complete KYC to release funds.</div>
                      </div>
                    </div>
                    <div className="kv-table">
                      <KV  k="Hold reason">Recipient not KYC-verified</KV>
                      <KVm k="Hold account">platform.transfer.hold_account</KVm>
                      <KVm k="Hold amount"><span style={{ color: 'var(--or)', fontWeight: 600 }}>EUR 120.00</span></KVm>
                      <KVm k="Hold started">2026-05-16 16:42</KVm>
                      <KVm k="Hold expiry">2026-06-15 16:42</KVm>
                    </div>
                    <div style={{ paddingTop: 4 }}>
                      <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 8 }}>Possible Outcomes</div>
                      {[
                        { icon: '✓', cls: 'var(--g)',  bg: 'var(--g-bg)',  bd: 'var(--g-bd)',
                          label: 'Release to recipient',
                          desc: 'Jonas Hofer completes KYC. Funds credited to WLT-EU-10831.' },
                        { icon: '↩', cls: 'var(--am)', bg: 'var(--am-bg)', bd: 'var(--am-bd)',
                          label: 'Return to sender',
                          desc: 'Hold expires on 2026-06-15 if unverified. EUR 120.00 returned to WLT-EU-77820.' },
                        { icon: '…', cls: 'var(--pu)', bg: 'var(--pu-bg)', bd: 'var(--pu-bd)',
                          label: 'Manual review',
                          desc: 'Operator can escalate or override if warranted.' },
                      ].map((o, i) => (
                        <div key={i} className="outcome-row">
                          <div className="outcome-icon" style={{ background: o.bg, color: o.cls, border: `1px solid ${o.bd}` }}>{o.icon}</div>
                          <div className="outcome-body">
                            <div className="outcome-label">{o.label}</div>
                            <div className="outcome-desc">{o.desc}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Dispute / Support Actions */}
                <div className="panel">
                  <div className="panel-hdr"><span className="panel-title">Actions</span></div>
                  <div className="panel-body" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>

                    {disputeMsg && (
                      <div className="alert alert-warn" style={{ fontSize: 11.5 }}>
                        <IcoWarn /><div>{disputeMsg}</div>
                      </div>
                    )}
                    {downloadMsg && (
                      <div className="alert alert-info" style={{ fontSize: 11.5 }}>
                        {downloadMsg}
                      </div>
                    )}

                    <button className="btn btn-primary" style={{ justifyContent: 'flex-start' }} onClick={() => setShowSupport(true)}>
                      <IcoSupport /> Contact Support
                    </button>
                    <button className="btn btn-warn" style={{ justifyContent: 'flex-start' }} onClick={() => setShowReport(true)}>
                      <IcoFlag /> Report Problem
                    </button>
                    <button className="btn btn-ghost" style={{ justifyContent: 'flex-start' }} onClick={handleDispute}>
                      <IcoDispute /> Start Dispute
                    </button>
                    <div style={{ fontSize: 10.5, color: 'var(--t3)', paddingLeft: 2, marginTop: -4 }}>
                      Dispute unavailable — transfer not yet completed or captured.
                    </div>
                    <button className="btn btn-ghost" style={{ justifyContent: 'flex-start' }} onClick={handleDownload}>
                      <IcoDownload /> Download Receipt
                    </button>
                    <div style={{ borderTop: '1px solid var(--bdr)', paddingTop: 8, marginTop: 2 }}>
                      <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 6 }}>Dispute Eligibility</div>
                      {[
                        { label: 'Internal transfer held', eligible: false, reason: 'Not yet completed' },
                        { label: 'Card capture',           eligible: true,  reason: 'Eligible after capture' },
                        { label: 'Unauthorized charge',    eligible: true,  reason: 'Report problem above' },
                      ].map((e, i) => (
                        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: i < 2 ? '1px solid var(--hover)' : 'none', fontSize: 11.5 }}>
                          <span style={{ color: 'var(--t2)' }}>{e.label}</span>
                          <span style={{ color: e.eligible ? 'var(--g)' : 'var(--t3)', fontFamily: 'var(--f-mono)', fontSize: 10.5 }}>{e.reason}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

              </div>{/* right col end */}
            </div>{/* detail-grid end */}

            {/* ── LEDGER ENTRIES ────────────────────────────────── */}
            <div className="panel">
              <div className="panel-hdr">
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span className="panel-title">Ledger Entries</span>
                  <Badge cls="b-posted" label="POSTED" />
                </div>
                <span style={{ fontSize: 10.5, fontFamily: 'var(--f-mono)', color: 'var(--t3)' }}>Journal: JRN-20260516-88201</span>
              </div>
              <div>
                <table className="data-table">
                  <thead>
                    <tr>
                      <th style={{ width: 36 }}>Side</th>
                      <th>Account</th>
                      <th>Detail</th>
                      <th style={{ textAlign: 'right' }}>Amount</th>
                      <th>Currency</th>
                      <th>Entry Type</th>
                      <th>Status</th>
                      <th>Journal ID</th>
                      <th>Timestamp</th>
                    </tr>
                  </thead>
                  <tbody>
                    {TXN_LEDGER.map((l, i) => (
                      <tr key={i}>
                        <td className={l.side === 'DR' ? 'le-dr' : 'le-cr'}>{l.side}</td>
                        <td style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>{l.account}</td>
                        <td style={{ fontFamily: 'var(--f-mono)', fontSize: 10.5, color: 'var(--t3)' }}>{l.detail || '—'}</td>
                        <td style={{ textAlign: 'right', fontFamily: 'var(--f-mono)', fontSize: 11.5, fontWeight: 600 }}>{l.amount}</td>
                        <td style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>{l.currency}</td>
                        <td style={{ fontFamily: 'var(--f-mono)', fontSize: 10, color: 'var(--t3)' }}>{l.type}</td>
                        <td><Badge cls="b-posted" label={l.status.toUpperCase()} /></td>
                        <td style={{ fontFamily: 'var(--f-mono)', fontSize: 10.5, color: 'var(--t3)' }}>{l.journalId}</td>
                        <td style={{ fontFamily: 'var(--f-mono)', fontSize: 10, color: 'var(--t3)' }}>{l.ts}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div style={{ padding: '8px 14px', background: 'var(--surf2)', borderTop: '1px solid var(--bdr)' }}>
                <div style={{ fontSize: 11, color: 'var(--t2)', lineHeight: 1.5 }}>
                  <strong>Hold account entry:</strong> The debit reduces Elena's available balance immediately. The credit is to a platform hold account — not to Jonas Hofer's wallet. Recipient only receives funds when KYC is cleared and the hold is released with a second journal (DR hold account / CR recipient wallet).
                </div>
              </div>
            </div>

            {/* ── RELATED CARD AUTHORIZATION ────────────────────── */}
            <div className="panel">
              <div className="panel-hdr">
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span className="panel-title">Related: Card Authorization Hold</span>
                  <Badge cls="b-approved" label="APPROVED — HELD" />
                </div>
                <button className="btn btn-ghost btn-sm" onClick={() => setShowAuthDetail(true)}>
                  View Authorization Detail
                </button>
              </div>
              <div className="panel-body">
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1, background: 'var(--bdr)', borderRadius: 'var(--r)', overflow: 'hidden', marginBottom: 12 }}>
                  {[
                    { label: 'Auth ID',         val: AUTH.id,              mono: true },
                    { label: 'Merchant',         val: AUTH.merchant,        mono: false },
                    { label: 'Hold Amount',      val: `EUR ${AUTH.amount.toFixed(2)}`, mono: true, color: 'var(--or)' },
                    { label: 'Hold Expiry',      val: AUTH.holdExpiry,      mono: true },
                  ].map((c, i) => (
                    <div key={i} style={{ background: 'var(--surface)', padding: '9px 12px' }}>
                      <div style={{ fontSize: 9.5, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--t3)', fontWeight: 600, marginBottom: 4 }}>{c.label}</div>
                      <div style={{ fontSize: 12, fontFamily: c.mono ? 'var(--f-mono)' : 'inherit', color: c.color || 'var(--t1)', fontWeight: 600 }}>{c.val}</div>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize: 11.5, color: 'var(--t2)', lineHeight: 1.55 }}>
                  <strong>Distinction from transfer hold:</strong> This card authorization hold (<span style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>issuer.auth.hold_account</span>) is a separate hold from the transfer hold (<span style={{ fontFamily: 'var(--f-mono)', fontSize: 11 }}>platform.transfer.hold_account</span>). Both reduce available balance. The card hold will be released or captured when Supermarkt Müller processes the transaction. Card dispute is only available <em>after capture</em>.
                </div>
              </div>
            </div>

          </div>{/* left-scroll end */}

          {/* ── TIMELINE RAIL ──────────────────────────────────────── */}
          <div className="tl-rail">
            <div className="tl-hdr">Audit Trail · Click to expand</div>
            <div className="tl-body">
              {TIMELINE.map((e, i, arr) => {
                const expanded = expandedEvents.has(i);
                return (
                  <div key={i} className="tl-evt" onClick={() => toggleEvent(i)}>
                    <div className="tl-spine">
                      <div className={`tl-dot ${e.dot}`} />
                      {i < arr.length - 1 && <div className="tl-line" />}
                    </div>
                    <div className="tl-content">
                      <div className="tl-ts">{e.ts}</div>
                      <div className="tl-name">{e.type.replace(/_/g, ' ')}</div>
                      <div className="tl-actor">{e.actor}</div>
                      <div className="tl-desc">{e.desc}</div>
                      {expanded && (
                        <div className="tl-audit">{e.audit}</div>
                      )}
                      {!expanded && (
                        <div className="tl-expand-hint">click to show audit event</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

        </div>{/* content-area end */}
      </div>

      {showSupport    && <SupportModal    onClose={() => setShowSupport(false)} />}
      {showReport     && <ReportModal     onClose={() => setShowReport(false)} />}
      {showAuthDetail && <AuthDetailModal onClose={() => setShowAuthDetail(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
