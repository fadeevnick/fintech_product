<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniFin — Backoffice Manual Withdrawals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eceae5; --surface: #ffffff; --surf2: #f7f6f3; --hover: #f0efe9;
      --sb: #0e0e12; --sb-bdr: #1a1a20; --sb-muted: #4e4e5c; --sb-active: #1c1c2a;
      --bdr: #dddad2; --bdr-mid: #c5c2ba; --bdr-focus: #1c1c1f;
      --t1: #1c1c1f; --t2: #575763; --t3: #9898a6; --t4: #d0d0da;
      --cta: #1c1c1f; --cta-hov: #2e2e35; --cta-t: #ffffff;
      --g:  #166534; --g-bg:  #f0fdf4; --g-bd:  #bbf7d0;
      --am: #854d0e; --am-bg: #fffbeb; --am-bd: #fde68a;
      --rd: #9b1c1c; --rd-bg: #fef2f2; --rd-bd: #fecaca;
      --or: #b45309; --or-bg: #fff7ed; --or-bd: #fed7aa;
      --pu: #5b21b6; --pu-bg: #f5f3ff; --pu-bd: #ddd6fe;
      --bl: #1e40af; --bl-bg: #eff6ff; --bl-bd: #bfdbfe;
      --sb-env-bg: #0e1a30; --sb-env-t: #93c5fd; --sb-env-bd: #1e3a6a;
      --f-ui: 'IBM Plex Sans', sans-serif; --f-mono: 'IBM Plex Mono', monospace;
      --r: 3px; --r-lg: 5px; --w-sb: 210px; --w-au: 258px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--t1);
      font-family: var(--f-ui); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; display: flex; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bdr-mid); border-radius: 2px; }

    /* SIDEBAR */
    .sidebar { width: var(--w-sb); flex-shrink: 0; background: var(--sb);
      border-right: 1px solid var(--sb-bdr); display: flex; flex-direction: column; overflow: hidden; }
    .sb-brand { padding: 13px 13px 11px; border-bottom: 1px solid var(--sb-bdr); }
    .sb-mark  { display: flex; align-items: center; gap: 8px; }
    .sb-name  { font-size: 14px; font-weight: 600; color: #eaeaf4; letter-spacing: -0.01em; }
    .sb-sub   { font-size: 9px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
    .sb-nav   { flex: 1; padding: 8px 6px; overflow-y: auto; }
    .nav-sec  { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--sb-muted); padding: 4px 8px 4px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 7px; padding: 5px 8px;
      border-radius: var(--r); color: var(--sb-muted); font-size: 11.5px; cursor: default; user-select: none; }
    .nav-item.locked  { opacity: 0.28; }
    .nav-item.limited { opacity: 0.7; }
    .nav-item.nav-on  { color: #a5b4fc; opacity: 0.9; }
    .nav-item.current { background: var(--sb-active); color: #e0e0ec; opacity: 1; }
    .nav-badge-ro { margin-left: auto; font-size: 8px; font-family: var(--f-mono);
      color: var(--or); background: var(--or-bg); border: 1px solid var(--or-bd); padding: 1px 4px; border-radius: 2px; }
    .nav-lock { margin-left: auto; display: flex; align-items: center; opacity: 0.5; }
    .nav-id   { margin-left: auto; font-size: 9px; font-family: var(--f-mono); color: var(--sb-muted); opacity: 0.7; }
    .sb-div   { height: 1px; background: var(--sb-bdr); margin: 4px 0; }
    .sb-footer { padding: 9px 12px; border-top: 1px solid var(--sb-bdr); }
    .env-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px;
      border-radius: var(--r); background: var(--sb-env-bg); border: 1px solid var(--sb-env-bd);
      font-size: 9.5px; color: var(--sb-env-t); font-family: var(--f-mono); margin-bottom: 3px; }
    .env-dot  { width: 5px; height: 5px; border-radius: 50%; background: var(--sb-env-t); opacity: 0.7; }
    .env-host { font-size: 9.5px; color: var(--sb-muted); font-family: var(--f-mono); }

    /* MAIN WRAP */
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* PAGE HEADER */
    .page-hdr { display: flex; align-items: center; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .hdr-bc   { display: flex; align-items: center; gap: 5px; padding: 9px 16px;
      font-size: 12px; color: var(--t2); flex: 1; }
    .hdr-bc strong { color: var(--t1); font-weight: 500; }
    .hdr-sep  { color: var(--t4); }
    .hdr-session { display: flex; align-items: center; gap: 7px; padding: 7px 12px;
      border-left: 1px solid var(--bdr); flex-shrink: 0; }
    .session-user { font-size: 11.5px; font-weight: 500; color: var(--t1); }
    .session-meta { font-size: 10px; color: var(--t3); font-family: var(--f-mono); }
    .hdr-right { display: flex; align-items: center; gap: 7px; padding: 9px 14px;
      border-left: 1px solid var(--bdr); flex-shrink: 0; }
    .screen-id { font-size: 10px; font-family: var(--f-mono); color: var(--t3);
      padding: 2px 6px; border: 1px solid var(--bdr); border-radius: var(--r); }
    .env-badge-hdr { font-size: 10px; font-family: var(--f-mono); color: var(--bl);
      background: var(--bl-bg); border: 1px solid var(--bl-bd);
      padding: 2px 7px; border-radius: var(--r); display: flex; align-items: center; gap: 4px; }
    .env-bdot { width: 5px; height: 5px; border-radius: 50%; background: var(--bl); }

    /* SUB HEADER */
    .sub-hdr { display: flex; align-items: center; border-bottom: 1px solid var(--bdr);
      background: var(--surface); flex-shrink: 0; }
    .stat-row { display: flex; align-items: center; padding: 7px 16px;
      flex: 1; border-right: 1px solid var(--bdr); overflow-x: auto; gap: 0; }
    .stat-chip { display: flex; align-items: center; gap: 5px; padding: 4px 12px;
      border-right: 1px solid var(--bdr); white-space: nowrap; }
    .stat-chip:first-child { padding-left: 0; }
    .stat-chip:last-child  { border-right: none; }
    .stat-num  { font-size: 16px; font-weight: 600; font-family: var(--f-mono);
      color: var(--t1); line-height: 1; letter-spacing: -0.02em; }
    .stat-num.rd { color: var(--rd); }
    .stat-num.am { color: var(--am); }
    .stat-num.bl { color: var(--bl); }
    .stat-lbl  { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.06em; }
    .action-bar { display: flex; align-items: center; gap: 5px; padding: 7px 12px; flex-shrink: 0; flex-wrap: wrap; }

    /* MAIN BODY */
    .main-body { flex: 1; overflow-y: auto; padding: 13px 15px; background: var(--bg);
      display: flex; flex-direction: column; gap: 11px; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 2px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em;
      font-family: var(--f-mono); border: 1px solid transparent; white-space: nowrap; }
    .b-critical { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .b-high     { background: var(--or-bg); color: var(--or); border-color: var(--or-bd); }
    .b-medium   { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .b-low      { background: var(--hover); color: var(--t3); border-color: var(--bdr); }
    .b-co { background: var(--pu-bg); color: var(--pu); border-color: var(--pu-bd); }
    .b-op { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
    .b-sc { background: #fff1f2; color: #be123c; border-color: #fecdd3; }
    .b-oidc { background: var(--bl-bg); color: var(--bl); border-color: var(--bl-bd); }
    /* Withdrawal states */
    .b-st-req    { background: var(--hover);  color: var(--t3); border-color: var(--bdr); }
    .b-st-pend   { background: var(--bl-bg);  color: var(--bl); border-color: var(--bl-bd); }
    .b-st-risk   { background: var(--am-bg);  color: var(--am); border-color: var(--am-bd); }
    .b-st-cleared{ background: var(--pu-bg);  color: var(--pu); border-color: var(--pu-bd); }
    .b-st-held   { background: #fff7ed;       color: #c2410c;   border-color: #fed7aa; }
    .b-st-2nd    { background: #fff7ed;       color: #c2410c;   border-color: #fed7aa; }
    .b-st-esc    { background: var(--rd-bg);  color: var(--rd); border-color: var(--rd-bd); }
    .b-st-approved{ background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-st-completed{ background: var(--g-bg); color: var(--g);  border-color: var(--g-bd); }
    .b-st-rejected { background: var(--rd-bg);color: var(--rd); border-color: var(--rd-bd); }
    .b-st-frozen   { background: var(--rd-bg);color: var(--rd); border-color: var(--rd-bd); }
    /* Hold states */
    .b-h-none    { background: var(--hover); color: var(--t4);  border-color: var(--bdr); }
    .b-h-pending { background: var(--am-bg); color: var(--am);  border-color: var(--am-bd); }
    .b-h-held    { background: #fff7ed;      color: #c2410c;    border-color: #fed7aa; }
    .b-h-released{ background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-h-captured{ background: var(--g-bg);  color: var(--g);   border-color: var(--g-bd); }
    .b-h-failed  { background: var(--rd-bg); color: var(--rd);  border-color: var(--rd-bd); }
    /* Risk status */
    .b-r-clear   { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-r-elevated{ background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .b-r-match   { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .b-r-cleared { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-r-esc     { background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    /* Risk check cell */
    .b-rc-ok    { background: var(--g-bg);   color: var(--g);  border-color: var(--g-bd); }
    .b-rc-warn  { background: var(--am-bg);  color: var(--am); border-color: var(--am-bd); }
    .b-rc-block { background: var(--rd-bg);  color: var(--rd); border-color: var(--rd-bd); }
    .b-rc-na    { background: var(--hover);  color: var(--t4); border-color: var(--bdr); }
    /* Two-eyes */
    .b-te-ok     { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-te-blocked{ background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }
    .b-te-req    { background: var(--or-bg); color: var(--or); border-color: var(--or-bd); }
    .b-te-none   { background: var(--hover); color: var(--t3); border-color: var(--bdr); }
    /* User risk */
    .b-risk-low    { background: var(--g-bg);  color: var(--g);  border-color: var(--g-bd); }
    .b-risk-medium { background: var(--am-bg); color: var(--am); border-color: var(--am-bd); }
    .b-risk-high   { background: var(--or-bg); color: var(--or); border-color: var(--or-bd); }
    .b-risk-critical{background: var(--rd-bg); color: var(--rd); border-color: var(--rd-bd); }

    /* STATE FLOW */
    .state-flow-wrap { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); overflow: hidden; }
    .state-flow-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 7px 13px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .state-flow-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .state-flow-row  { display: flex; align-items: center; overflow-x: auto; gap: 0; }
    .state-node { display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 5px 8px; border-radius: var(--r); border: 1px solid var(--bdr);
      background: var(--surf2); min-width: 82px; text-align: center; flex-shrink: 0; }
    .state-node.active { background: var(--bl-bg); border-color: var(--bl); }
    .state-node.t-ok   { background: var(--g-bg);  border-color: var(--g-bd); }
    .state-node.t-bad  { background: var(--rd-bg); border-color: var(--rd-bd); }
    .state-node.t-esc  { background: var(--am-bg); border-color: var(--am-bd); }
    .s-lbl { font-size: 8.5px; font-family: var(--f-mono); color: var(--t2);
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .s-sub { font-size: 9px; color: var(--t4); margin-top: 1px; }
    .state-node.active .s-lbl  { color: var(--bl); }
    .state-node.t-ok .s-lbl   { color: var(--g); }
    .state-node.t-bad .s-lbl  { color: var(--rd); }
    .state-node.t-esc .s-lbl  { color: var(--am); }
    .state-arrow { color: var(--t4); font-size: 12px; padding: 0 2px; flex-shrink: 0; }

    /* FILTER BAR */
    .filter-bar { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .filter-lbl { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap; }
    .fchip { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--bdr-mid); background: var(--surface);
      color: var(--t3); transition: all 0.1s; font-family: var(--f-ui); white-space: nowrap; }
    .fchip:hover { color: var(--t2); background: var(--hover); }
    .fchip.on    { background: var(--cta); color: #fff; border-color: var(--cta); }
    .fchip.rd.on { background: var(--rd); border-color: var(--rd); }
    .fchip.am.on { background: var(--am); border-color: var(--am); }
    .fchip.or.on { background: var(--or); border-color: var(--or); }
    .ftoggle { padding: 3px 9px; border-radius: 99px; font-size: 11px; cursor: pointer;
      border: 1px solid var(--bdr-mid); background: var(--surface); color: var(--t3);
      font-family: var(--f-ui); transition: all 0.1s; }
    .ftoggle.on { background: var(--bl-bg); color: var(--bl); border-color: var(--bl-bd); }
    .search-wrap { margin-left: auto; }
    .search-input { background: var(--surface); border: 1px solid var(--bdr-mid);
      border-radius: var(--r); padding: 4px 10px; font-size: 12px; color: var(--t1);
      font-family: var(--f-ui); width: 210px; outline: none; }
    .search-input::placeholder { color: var(--t4); }
    .search-input:focus { border-color: var(--bdr-focus); }

    /* TABLE */
    .table-wrap { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); overflow: hidden; }
    .table-top { display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .table-ttl { font-size: 11px; font-weight: 600; color: var(--t1); text-transform: uppercase; letter-spacing: 0.04em; }
    .wt { width: 100%; border-collapse: collapse; }
    .wt th { font-size: 9.5px; font-weight: 600; color: var(--t3); text-transform: uppercase;
      letter-spacing: 0.07em; padding: 5px 8px; border-bottom: 1px solid var(--bdr);
      text-align: left; white-space: nowrap; background: var(--surf2); }
    .wt td { padding: 6px 8px; border-bottom: 1px solid var(--hover); font-size: 11.5px;
      color: var(--t1); vertical-align: middle; }
    .wt tr:last-child td { border-bottom: none; }
    .wt tr.sel td   { background: #f5f4ff; }
    .wt tr:hover td { background: var(--hover); }
    .wt tr.sel:hover td { background: #f0eeff; }
    .wt tr { cursor: pointer; }
    .mono { font-family: var(--f-mono); font-size: 10.5px; color: var(--t2); }
    .td-sub { font-size: 10px; color: var(--t3); margin-top: 1px; }
    .bal-pos { color: var(--g);  font-family: var(--f-mono); font-size: 11px; }
    .bal-neg { color: var(--rd); font-family: var(--f-mono); font-size: 11px; }

    /* SLA */
    .sla-ok     { font-size: 9px; padding: 1.5px 5px; border-radius: 2px; font-family: var(--f-mono);
      font-weight: 600; background: var(--g-bg); color: var(--g); border: 1px solid var(--g-bd); }
    .sla-warn   { font-size: 9px; padding: 1.5px 5px; border-radius: 2px; font-family: var(--f-mono);
      font-weight: 600; background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .sla-breach { font-size: 9px; padding: 1.5px 5px; border-radius: 2px; font-family: var(--f-mono);
      font-weight: 600; background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 5px 10px; border-radius: var(--r); font-size: 11.5px; font-weight: 500;
      font-family: var(--f-ui); cursor: pointer; border: none; transition: background 0.1s; }
    .btn-primary { background: var(--cta); color: var(--cta-t); }
    .btn-primary:hover { background: var(--cta-hov); }
    .btn-ghost  { background: var(--surface); color: var(--t2); border: 1px solid var(--bdr-mid); }
    .btn-ghost:hover { background: var(--hover); }
    .btn-success{ background: var(--g); color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: var(--rd-bg); color: var(--rd); border: 1px solid var(--rd-bd); }
    .btn-warn   { background: var(--am-bg); color: var(--am); border: 1px solid var(--am-bd); }
    .btn-hold   { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .btn-hold:hover { background: #fed7aa; }
    .btn-disabled { background: var(--surface); color: var(--t4); border: 1px solid var(--bdr); cursor: not-allowed; }
    .btn-sm { padding: 3px 9px; font-size: 10.5px; }
    .btn-xs { padding: 2px 7px; font-size: 10px; }

    /* ALERTS */
    .alert { display: flex; gap: 9px; padding: 8px 11px 8px 12px; font-size: 11.5px;
      line-height: 1.5; border-radius: 0 var(--r) var(--r) 0;
      border-left-width: 3px; border-left-style: solid; }
    .alert-icon { flex-shrink: 0; font-style: normal; font-size: 11px; margin-top: 1px; font-weight: 600; }
    .alert-err  { background: var(--rd-bg); border-left-color: var(--rd); color: #7f1d1d; }
    .alert-warn { background: var(--am-bg); border-left-color: var(--am); color: #78350f; }
    .alert-info { background: var(--hover); border-left-color: var(--bdr-mid); color: var(--t2); }
    .alert-ok   { background: var(--g-bg);  border-left-color: var(--g);  color: #14532d; }
    .alert-blue { background: var(--bl-bg); border-left-color: var(--bl); color: #1e3a8a; }
    .alert-pu   { background: var(--pu-bg); border-left-color: var(--pu); color: #4c1d95; }

    /* KV TABLE */
    .kv-table { display: flex; flex-direction: column; }
    .kv-row   { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--hover); }
    .kv-row:last-child { border-bottom: none; }
    .kv-k { font-size: 10.5px; color: var(--t3); min-width: 120px; flex-shrink: 0; padding-top: 2px; }
    .kv-v { font-size: 11.5px; color: var(--t1); flex: 1; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .kv-v.mono { font-family: var(--f-mono); font-size: 11px; }

    /* DETAIL PANE */
    .detail-pane { background: var(--surface); border: 1px solid var(--bdr); border-radius: var(--r-lg); overflow: hidden; }
    .detail-hdr  { display: flex; align-items: center; justify-content: space-between;
      padding: 8px 13px; border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .detail-title { font-size: 12px; font-weight: 600; color: var(--t1); display: flex; align-items: center; gap: 8px; }
    .detail-body  { padding: 13px 15px; display: flex; flex-direction: column; gap: 12px; }
    .detail-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .detail-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 13px; }

    /* INNER BOX */
    .inner-box { border: 1px solid var(--bdr); border-radius: var(--r); overflow: hidden; }
    .inner-hdr { display: flex; align-items: center; gap: 7px; padding: 6px 11px;
      border-bottom: 1px solid var(--bdr); background: var(--surf2); }
    .inner-title { font-size: 10.5px; font-weight: 600; color: var(--t1);

/* ── RISK CHECKS COMPONENT ── */
const RiskChecks = ({ risk, sanctionsBlock }) => {
  const checks = [
    { label: 'AML status',        val: risk.aml,      ok: risk.aml === 'clear', block: risk.aml === 'elevated' },
    { label: 'Sanctions',         val: risk.sanctions, ok: risk.sanctions === 'clear', block: risk.sanctions === 'possible_match' },
    { label: 'Account freeze',    val: risk.freeze,    ok: risk.freeze === 'not_frozen', block: risk.freeze === 'frozen' },
    { label: 'Velocity check',    val: risk.velocity,  ok: risk.velocity === 'normal',  block: risk.velocity === 'high' },
    { label: 'Destination risk',  val: risk.destRisk,  ok: risk.destRisk === 'low',     block: risk.destRisk === 'high' },
    { label: 'Source of wealth',  val: risk.sow,       ok: risk.sow === 'on_file' || risk.sow === 'not_required', block: risk.sow === 'requested' },
  ];
  return (
    <div className="inner-box">
      <div className="inner-hdr">
        <span className="inner-title">Risk Checks</span>
        {sanctionsBlock && <Bdg cls="b-r-match" label="SANCTIONS BLOCK" />}
      </div>
      <div className="inner-body">
        <div className="risk-grid">
          {checks.map((c, i) => (
            <div key={i} className={`risk-cell${c.block ? ' block' : c.ok ? ' ok' : ' warn'}`}>
              <span className={`risk-name${c.block ? ' block' : ''}`}>{c.label}</span>
              <Bdg cls={c.block ? 'b-rc-block' : c.ok ? 'b-rc-ok' : 'b-rc-warn'}
                label={c.val.replace('_',' ').toUpperCase()} />
            </div>
          ))}
        </div>
        {sanctionsBlock && (
          <div style={{ marginTop: 8 }}>
            <Alrt type="err" icon="×">
              <strong>Sanctions possible match</strong> — payout is blocked pending compliance review.
              Funds remain on hold. Cannot approve until sanctions hit is resolved (senior_compliance required to clear).
            </Alrt>
          </div>
        )}
      </div>
    </div>
  );
};

/* ── DETAIL PANEL ── */
const DetailPanel = ({ wdr, localState, onApprove, onReject, onHold, onClose }) => {
  const isApproved = localState === 'approved';
  const isRejected = localState === 'rejected';
  const isSameActor = wdr.sameActor;
  const isSanctionsBlocked = wdr.sanctionsBlock;
  const isRiskPending = wdr.state === 'PENDING_RISK_REVIEW' || wdr.state === 'ESCALATED_COMPLIANCE';

  const canApprove = !isSameActor && !isSanctionsBlocked && !isRiskPending && !isApproved && !isRejected &&
    (wdr.state === 'PENDING_OPERATOR_REVIEW' || wdr.state === 'READY_FOR_SECOND_REVIEW' || wdr.state === 'RISK_REVIEW_CLEARED');

  const displayState = isApproved ? 'APPROVED' : isRejected ? 'REJECTED' : wdr.state;
  const displayHold  = isApproved ? 'CAPTURED' : isRejected ? 'RELEASED' : wdr.holdState;

  const netAvail = wdr.walletBalance - wdr.heldAmount;

  const twEyes = wdr.requires2nd
    ? (isSameActor ? 'blocked' : wdr.state === 'READY_FOR_SECOND_REVIEW' ? 'required' : 'pending')
    : 'none';
  const teMap = {
    blocked: ['b-te-blocked', 'BLOCKED — SAME ACTOR'],
    required: ['b-te-req', '2ND REVIEW REQUIRED'],
    pending:  ['b-te-req', 'WILL BE REQUIRED'],
    none:     ['b-te-none', 'NOT REQUIRED'],
  };
  const [teCls, teLabel] = teMap[twEyes];

  return (
    <div className="detail-pane">
      <div className="detail-hdr">
        <div className="detail-title">
          <span style={{ fontFamily: 'var(--f-mono)', fontSize: '11.5px' }}>{wdr.id}</span>
          {stateBdg(displayState)}
          {holdBdg(displayHold)}
          {prioBdg(wdr.priority)}
          {userRiskBdg(wdr.userRisk)}
        </div>
        <button className="btn btn-ghost btn-sm" onClick={onClose}>Close</button>
      </div>

      {/* Status alerts */}
      {isApproved && (
        <div style={{ padding: '10px 15px', borderBottom: '1px solid var(--bdr)' }}>
          <Alrt type="ok" icon="✓">
            <strong>Approved successfully.</strong> withdrawal.second_review_approved recorded ·
            Hold captured → CAPTURED · Payout initiated · Both actor IDs in audit log.
          </Alrt>
        </div>
      )}
      {isRejected && (
        <div style={{ padding: '10px 15px', borderBottom: '1px solid var(--bdr)' }}>
          <Alrt type="warn" icon="!">
            <strong>Withdrawal rejected.</strong> Hold released → funds returned to available balance.
            withdrawal.rejected + withdrawal.hold_released recorded.
          </Alrt>
        </div>
      )}
      {isSameActor && !isApproved && !isRejected && (
        <div style={{ padding: '10px 15px', borderBottom: '1px solid var(--bdr)' }}>
          <Alrt type="err" icon="×">
            <strong>Two-eyes violation:</strong> You performed the first review on this withdrawal.
            A different reviewer must perform the second approval. Enforced server-side.
          </Alrt>
        </div>
      )}
      {isSanctionsBlocked && !isApproved && !isRejected && (
        <div style={{ padding: '10px 15px', borderBottom: '1px solid var(--bdr)' }}>
          <Alrt type="err" icon="×">
            <strong>Sanctions possible match</strong> — payout blocked pending resolution.
            Unresolved sanctions hit blocks all approval actions regardless of role.
            senior_compliance must clear the sanctions hit before payout can proceed.
          </Alrt>
        </div>
      )}
      {isRiskPending && !isApproved && !isRejected && !isSanctionsBlocked && (
        <div style={{ padding: '10px 15px', borderBottom: '1px solid var(--bdr)' }}>
          <Alrt type="warn" icon="!">
            <strong>Risk review in progress.</strong> Approval blocked until risk review completes and clears.
            You can escalate or assign but cannot approve yet.
          </Alrt>
        </div>
      )}

      <div className="detail-body">
        {/* Balance strip */}
        <div className="bal-strip">
          <div className="bal-card">
            <div className="bal-num">€{wdr.walletBalance.toLocaleString()}</div>
            <div className="bal-lbl">Wallet balance</div>
          </div>
          <div className="bal-card">
            <div className={`bal-num${wdr.heldAmount > 0 ? ' held' : ''}`}>
              {wdr.heldAmount > 0 ? `€${wdr.heldAmount.toLocaleString()}` : '—'}
            </div>
            <div className="bal-lbl">Held amount</div>
          </div>
          <div className="bal-card">
            <div className={`bal-num${netAvail < 1000 ? ' held' : ' net'}`}>€{netAvail.toLocaleString()}</div>
            <div className="bal-lbl">Net available</div>
          </div>
        </div>

        <div className="detail-grid">
          {/* Request summary */}

              <KV k="Request ID"     v={wdr.id} mono />
              <KV k="User"           v={wdr.user} />
              <KV k="User ID"        v={wdr.userId} mono />
              <KV k="User type"      v={wdr.userType} />
              <KV k="Amount"><span style={{ fontFamily: 'var(--f-mono)', fontWeight: 600, color: wdr.amount >= 10000 ? 'var(--or)' : 'var(--t1)' }}>

              <KV k="Destination"    v={wdr.destination} mono />

              </div>
              <div className="inner-body">
                <div className="kv-table">

              </div>
            </div>

            <div className="inner-box">
              <div className="inner-hdr">
                <span className="inner-title">Hold Lifecycle</span>
                {holdBdg(displayHold)}
              </div>
              <div className="inner-body">
                <div className="kv-table">
                  <KV k="Hold state"  v={displayHold.replace(/_/g, ' ')} />

                <div style={{ marginTop: 8, fontSize: '10.5px', color: 'var(--t3)' }}>

                </div>
              </div>
            </div>

        </div>

        {/* Risk checks */}
        <RiskChecks risk={wdr.risk} sanctionsBlock={wdr.sanctionsBlock} />

        <div>

            <div key={i} className="tl-row">
              <div className={`tl-dot ${t.dot}`} />

            </div>
          ))}
          {isApproved && <div className="tl-row">
            <div className="tl-dot ok" /><span className="tl-ts">now</span>
            <div><div className="tl-txt">Second review approved — Maya Ivanova · hold → CAPTURED</div>

          </div>}
          {isRejected && <div className="tl-row">
            <div className="tl-dot bad" /><span className="tl-ts">now</span>
            <div><div className="tl-txt">Withdrawal rejected — hold released → funds restored</div>
              <div className="tl-act">maya.ivanova@minifin.local</div></div>
          </div>}
        </div>

        {/* Actions */}
        {!isApproved && !isRejected && (
          <div>
            <div style={{ fontSize: '10px', color: 'var(--t3)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 8 }}>
              Actions for Maya — compliance_officer

            <div className="actions-grid">
              {canApprove && wdr.requires2nd && wdr.state === 'READY_FOR_SECOND_REVIEW' && (

                <div className="action-row allowed">
                  <span className="action-name">✓ Place hold — required before approval</span>
                  <button className="btn btn-hold btn-sm" onClick={onHold}>Place Hold</button>
                </div>
              )}
              {wdr.state !== 'ESCALATED_COMPLIANCE' && (
                <div className="action-row allowed">
                  <span className="action-name">✓ Escalate risk to compliance</span>
                  <button className="btn btn-warn btn-sm">Escalate Risk</button>
                </div>
              )}
              <div className="action-row blocked">
                <div>
                  <div className="action-name dim">— Senior override (bypass 2nd review / sanctions block)</div>
                  <div className="action-reason">requires senior_compliance role</div>
                </div>
                <button className="btn btn-disabled btn-xs">Locked</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* ── AUDIT RAIL ── */
const AuditRail = ({ selectedId }) => {
  const events = [
    { name: 'withdrawal.review_opened',       meta: '11:30 · WDR-3051',             dot: 'bl' },
    { name: 'withdrawal.hold_placed',         meta: '06:35 · WDR-3044 · €12,400',   dot: 'or' },
    { name: 'withdrawal.risk_review_requested', meta: '09:16 · WDR-3063 · sanctions',dot: 'bad' },
    { name: 'withdrawal.risk_review_cleared', meta: '12:40 · WDR-3082 · cleared',   dot: 'ok' },
    { name: 'withdrawal.first_review_approved', meta: '08:22 · WDR-3044 · Oliver',  dot: 'ok' },
    { name: 'withdrawal.second_review_required', meta: '08:22 · WDR-3044',          dot: 'am' },
    { name: 'withdrawal.account_frozen_blocked', meta: 'WDR-3063 · sanctions hit',  dot: 'bad' },
    selectedId ? { name: 'withdrawal.review_opened', meta: `now · ${selectedId}`, dot: 'bl' } : null,
  ].filter(Boolean);

  return (
    <aside className="audit-rail">
      <div className="audit-hdr">Audit &amp; Security</div>
      <div className="audit-body">
        <div className="audit-sec">Session identity</div>
        <div className="kv-table" style={{ marginBottom: 8 }}>
          <KV k="User"      v={MAYA.name} />
          <KV k="Role"><Bdg cls="b-co" label="CO" /></KV>
          <KV k="OIDC role" v="compliance_officer" mono />
          <KV k="Token exp" v={`Today ${MAYA.tokenExp}`} mono />
          <KV k="Session"   v="Bearer token — Keycloak OIDC" />
        </div>
        <div className="hr" />
        <div className="audit-sec">Audit requirements</div>
        {[
          'All withdrawal approvals and rejections audited with actor ID.',
          'Two-eyes approvals record both actor IDs and timestamps.',
          'Hold lifecycle events (place, release, capture) are audited.',
          'Sanctions and freeze blocks recorded with case cross-reference.',
          'End-user / merchant sessions cannot access this screen.',
        ].map((f, i) => (
          <div key={i} className="sec-fact">
            <span className="sec-mark">—</span>
            <span className="sec-text">{f}</span>
          </div>
        ))}
        <div className="hr" />
        <div className="audit-sec">Two-eyes + hold rules</div>
        <div className="kv-table" style={{ marginBottom: 8 }}>
          <KV k="Threshold"    v="≥ €10,000" mono />
          <KV k="Applies to"   v="Deposits + withdrawals" />
          <KV k="Hold required" v="Before approval can complete" />
          <KV k="Enforcement"  v="Server-side always" />
        </div>
        <div className="hr" />
        <div className="audit-sec">Event log (this session)</div>
        {events.map((ev, i) => (
          <div key={i} className="audit-evt">
            <div className={`audit-dot ${ev.dot}`} />
            <div>
              <div className="audit-name">{ev.name}</div>
              <div className="audit-meta">{ev.meta}</div>
            </div>
          </div>
        ))}
      </div>
    </aside>
  );
};

/* ── APP ── */
function App() {
  const [selectedId,    setSelectedId]    = useState('WDR-3044');
  const [filterState,   setFilterState]   = useState('all');
  const [filterHold,    setFilterHold]    = useState('all');
  const [filterRisk,    setFilterRisk]    = useState('all');
  const [filterSla,     setFilterSla]     = useState('all');
  const [assignedMe,    setAssignedMe]    = useState(false);
  const [search,        setSearch]        = useState('');
  const [showFlow,      setShowFlow]      = useState(true);
  const [localStates,   setLocalStates]   = useState({});

  const selected = WITHDRAWALS_DATA.find(w => w.id === selectedId);
  const localState = localStates[selectedId];

  const handleApprove = () => {
    if (selected) setLocalStates(p => ({ ...p, [selected.id]: 'approved' }));
  };
  const handleReject = () => {
    if (selected) { setLocalStates(p => ({ ...p, [selected.id]: 'rejected' })); }
  };
  const handleHold = () => {
    if (selected) setLocalStates(p => ({ ...p, [selected.id]: 'held' }));
  };

  const canApproveSelected = selected && !selected.sameActor && !selected.sanctionsBlock &&
    !['PENDING_RISK_REVIEW','ESCALATED_COMPLIANCE'].includes(selected.state) &&
    !localState &&
    ['PENDING_OPERATOR_REVIEW','READY_FOR_SECOND_REVIEW','RISK_REVIEW_CLEARED'].includes(selected.state);

  const filteredItems = useMemo(() => {
    return WITHDRAWALS_DATA.filter(w => {
      if (filterState !== 'all' && w.state !== filterState) return false;
      if (filterHold !== 'all' && w.holdState !== filterHold) return false;
      if (filterRisk === 'elevated' && w.riskStatus !== 'elevated' && w.riskStatus !== 'sanctions_match' && w.riskStatus !== 'escalated') return false;
      if (filterSla === 'breach' && w.sla !== 'breach') return false;
      if (assignedMe && w.assignedTo !== 'Maya I.') return false;
      if (search) {
        const q = search.toLowerCase();
        if (!w.id.toLowerCase().includes(q) && !w.user.toLowerCase().includes(q) && !w.destination.toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }, [filterState, filterHold, filterRisk, filterSla, assignedMe, search]);

  return (
    <>
      <Sidebar />
      <div className="main-wrap">
        <div className="page-hdr">
          <div className="hdr-bc">
            <span>Backoffice</span><span className="hdr-sep">/</span>
            <strong>Manual Withdrawals</strong>
            {selected && <><span className="hdr-sep">·</span>
              <span style={{ fontFamily: 'var(--f-mono)', fontSize: '11.5px', color: 'var(--t2)' }}>{selected.id}</span>
            </>}
          </div>
          <div className="hdr-session">
            <div>
              <div className="session-user">{MAYA.name}</div>
              <div className="session-meta">{MAYA.email}</div>
            </div>
            <Bdg cls="b-co" label="CO" />
            <Bdg cls="b-oidc" label="OIDC" />
            <span style={{ fontSize: '10px', color: 'var(--t3)', fontFamily: 'var(--f-mono)', whiteSpace: 'nowrap' }}>exp {MAYA.tokenExp}</span>
          </div>
          <div className="hdr-right">
            <span className="screen-id">BOF-UI-04</span>
            <span className="env-badge-hdr"><span className="env-bdot" />Local Sandbox</span>
          </div>
        </div>

        <div className="sub-hdr">
          <div className="stat-row">
            <div className="stat-chip"><div><div className="stat-num">11</div><div className="stat-lbl">Open</div></div></div>
            <div className="stat-chip"><div><div className="stat-num am">2</div><div className="stat-lbl">High priority</div></div></div>
            <div className="stat-chip"><div><div className="stat-num rd">2</div><div className="stat-lbl">SLA breached</div></div></div>
            <div className="stat-chip"><div><div className="stat-num am">3</div><div className="stat-lbl">Risk review</div></div></div>
            <div className="stat-chip"><div><div className="stat-num am">4</div><div className="stat-lbl">2nd review req.</div></div></div>
            <div className="stat-chip"><div><div className="stat-num bl">5</div><div className="stat-lbl">Funds held</div></div></div>
          </div>
          <div className="action-bar">
            <button className={`btn btn-ghost btn-sm${!selected || selected.assignedTo ? ' btn-disabled' : ''}`}
              disabled={!selected || !!selected.assignedTo}>Assign to me</button>
            <button className={`btn btn-success btn-sm${!canApproveSelected ? ' btn-disabled' : ''}`}
              disabled={!canApproveSelected} onClick={handleApprove}
              title={selected?.sameActor ? 'Two-eyes: same actor' : selected?.sanctionsBlock ? 'Sanctions block' : ''}>
              Approve
            </button>
            <button className={`btn btn-danger btn-sm${!selected || !!localState ? ' btn-disabled' : ''}`}
              disabled={!selected || !!localState} onClick={handleReject}>Reject</button>
            <button className="btn btn-hold btn-sm"
              disabled={!selected || selected.holdState !== 'NO_HOLD'} onClick={handleHold}
              style={{ opacity: (!selected || selected.holdState !== 'NO_HOLD') ? 0.4 : 1 }}>
              Place Hold
            </button>
            <button className="btn btn-ghost btn-sm"
              disabled={!selected || selected.holdState !== 'HELD'}
              style={{ opacity: (!selected || selected.holdState !== 'HELD') ? 0.4 : 1 }}>
              Release Hold
            </button>
            <button className="btn btn-warn btn-sm" disabled={!selected}
              style={{ opacity: !selected ? 0.4 : 1 }}>Escalate Risk</button>
            <button className="btn btn-disabled btn-sm" title="senior_compliance required">Senior Override</button>
          </div>
        </div>

        <div className="main-body">
          <StateFlowStrip
            activeState={selected ? (localStates[selected.id] === 'approved' ? 'APPROVED' : localStates[selected.id] === 'rejected' ? 'REJECTED' : selected.state) : null}
            show={showFlow} onToggle={() => setShowFlow(p => !p)} />
          <FilterBar filterState={filterState} setFilterState={setFilterState}
            filterHold={filterHold} setFilterHold={setFilterHold}
            filterRisk={filterRisk} setFilterRisk={setFilterRisk}
            filterSla={filterSla} setFilterSla={setFilterSla}
            assignedMe={assignedMe} setAssignedMe={setAssignedMe}
            search={search} setSearch={setSearch} />
          <WithdrawalsTable items={filteredItems} selectedId={selectedId} onSelect={setSelectedId} />
          {selected && (
            <DetailPanel
              wdr={selected}
              localState={localStates[selected.id]}
              onApprove={handleApprove}
              onReject={handleReject}
              onHold={handleHold}
              onClose={() => setSelectedId(null)}
            />
          )}
        </div>
      </div>
      <AuditRail selectedId={selectedId} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
